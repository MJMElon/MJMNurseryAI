<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELOS — Automate Cases</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ENL%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_nelos.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#f1f5f9; margin:0; }
  .hidden { display:none !important; }

  .backlink { display:inline-flex; align-items:center; gap:7px; margin-bottom:14px;
              padding:9px 16px; border-radius:999px; border:1.5px solid #ddd6fe; background:#fff;
              color:#6d28d9; font-size:10.5px; font-weight:900; letter-spacing:.08em;
              text-transform:uppercase; text-decoration:none;
              box-shadow:0 3px 10px rgba(124,58,237,.10); }
  .backlink:hover { background:#ede9fe; }

  .head { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:10px; }
  .head h1 { font-size:22px; font-weight:900; color:#1e293b; letter-spacing:-.01em; margin:0;
             text-align:center; }
  .tool-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 16px;
              border-radius:999px; background:#7c3aed; border:1.5px solid #7c3aed; color:#fff;
              font-weight:900; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
              cursor:pointer; box-shadow:0 3px 10px rgba(124,58,237,.10); }
  .tool-btn:hover { background:#6d28d9; }
  .plus { font-size:17px; font-weight:900; line-height:0; margin-top:-1px; }

  .sec-h { font-size:11px; font-weight:900; letter-spacing:.12em; text-transform:uppercase;
           color:#94a3b8; margin:26px 0 6px; }
  .sec-note { font-size:11.5px; font-weight:600; color:#94a3b8; line-height:1.6; margin:0 0 12px; }

  /* One system, one card; one condition, one row. Two columns, because
     there are two things to know: when it fires, and where it lands. */
  /* Each system reads as its own block. It was a 1.5px line in almost the
     page's own colour against a header tinted three shades off the page —
     six cards ran together as one long list, which is the opposite of what
     a card is for. So: the page goes grey, the cards stay white, the header
     takes the full violet, and each card carries a real shadow and a rule
     under its heading. */
  .cond-sys { background:#fff; border:1px solid #e2e8f0; border-radius:14px; margin-bottom:16px;
              overflow:hidden; box-shadow:0 4px 16px -6px rgba(15,23,42,.16); }
  .cond-sys-h { display:flex; align-items:center; gap:9px; padding:13px 16px;
                background:linear-gradient(180deg,#7c3aed,#6d28d9);
                font-size:12.5px; font-weight:900; color:#fff;
                letter-spacing:.06em; text-transform:uppercase; }
  .cond-sys-n { margin-left:auto; font-size:9.5px; font-weight:900; color:#a78bfa;
                letter-spacing:.06em; text-transform:uppercase; }
  /* On the violet header now, so it inverts: a pale outline that fills in. */
  .cond-add { margin-left:auto; width:24px; height:24px; border-radius:8px;
              border:1.5px solid rgba(255,255,255,.45); background:rgba(255,255,255,.12);
              color:#fff; font-size:15px; font-weight:900; line-height:0;
              cursor:pointer; flex-shrink:0; }
  .cond-add:hover { background:#fff; border-color:#fff; color:#6d28d9; }
  .sec-bar { display:flex; align-items:center; gap:12px; }
  .sec-bar .sec-h { margin-bottom:0; }
  .sec-bar .tool-btn { margin-left:auto; }
  .cond-head, .cond-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
                          gap:14px; padding:10px 16px; align-items:center; }
  .cond-head { font-size:9px; font-weight:900; letter-spacing:.11em; text-transform:uppercase;
               color:#a1a1aa; padding-top:9px; padding-bottom:5px; }
  .cond-row { border-top:1px dashed #f1e9ff; }
  .cond-work { font-size:13px; font-weight:800; color:#1e293b; line-height:1.4; }
  .cond-when { font-size:11px; font-weight:600; color:#94a3b8; line-height:1.5; margin-top:2px; }
  .cond-act { display:flex; flex-wrap:wrap; gap:7px; }
  .cond-act select { flex:1 1 130px; min-width:0; font-size:11.5px; font-weight:700; color:#1e293b;
                     background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:9px;
                     padding:7px 9px; outline:none; }
  .cond-act select:focus { border-color:#a78bfa; background:#fff; }
  .cond-empty { padding:14px 16px; font-size:11.5px; font-weight:700; color:#cbd5e1; }
  @media (max-width:640px) {
    .cond-head { display:none; }
    .cond-row { grid-template-columns:1fr; gap:8px; }
  }

  .lede-sec { text-align:left; margin-left:0; margin-right:0; max-width:none; }
  .lede { font-size:12px; font-weight:600; color:#6b7280; line-height:1.6; margin:0 0 18px;
         text-align:center; max-width:640px; margin-left:auto; margin-right:auto;
          max-width:70ch; }

  .card { background:#fff; border:1.5px solid #ede9fe; border-radius:16px; margin-bottom:12px;
          box-shadow:0 4px 16px rgba(124,58,237,.06); overflow:hidden; }
  .card.off { opacity:.6; }

  .au { display:grid; grid-template-columns:46px 1.1fr 1fr 1fr 128px; gap:14px;
        align-items:center; padding:15px 18px; }
  @media (max-width:820px) { .au { grid-template-columns:46px 1fr; } }
  .au-ico { width:46px; height:46px; border-radius:13px; background:#f5f3ff;
            display:flex; align-items:center; justify-content:center; font-size:22px; }
  .au-what { font-size:14px; font-weight:900; color:#111827; }
  .au-where { font-size:11.5px; font-weight:700; color:#6b7280; margin-top:2px; }
  .cap { display:block; font-size:9px; font-weight:900; letter-spacing:.11em;
         text-transform:uppercase; color:#9ca3af; margin-bottom:2px; }
  .val { font-size:12.5px; font-weight:800; color:#111827; }
  .val-soft { font-size:11px; font-weight:700; color:#6b7280; }
  .au-act { display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .act { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
         border-radius:9px; border:1.5px solid #e5e7eb; background:#fff; cursor:pointer;
         font-size:15px; line-height:1; color:#374151; padding:0; }
  .act:hover { background:#f3f4f6; border-color:#9ca3af; }
  .act-del:hover { background:#fef2f2; border-color:#fca5a5; color:#b91c1c; }
  .pill { font-size:9px; font-weight:900; letter-spacing:.07em; text-transform:uppercase;
          padding:3px 9px; border-radius:999px; }
  .pi-on  { background:#dcfce7; color:#15803d; }
  .pi-off { background:#f1f5f9; color:#64748b; }

  .empty { text-align:center; padding:52px 16px; color:#a5b4c4; font-weight:700; font-size:13px; }

  /* ── The drawer ─────────────────────────────────────────────── */
  .scrim { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:60; display:flex;
           align-items:flex-end; justify-content:center; }
  @media (min-width:768px) { .scrim { align-items:center; } }
  .sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh;
           overflow-y:auto; padding:22px; box-shadow:0 -10px 40px rgba(0,0,0,.25); }
  @media (min-width:768px) { .sheet { border-radius:20px; } }

  .step { border:1.5px solid #ede9fe; border-radius:13px; padding:13px 15px; margin-bottom:11px;
          background:#fdfcff; }
  .step-h { display:flex; align-items:center; gap:9px; margin-bottom:9px;
            font-size:12.5px; font-weight:900; color:#4c1d95; }
  .step-n { width:21px; height:21px; border-radius:7px; background:#7c3aed; color:#fff; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  @media (max-width:520px) { .row2 { grid-template-columns:1fr; } }
  .note { font-size:10.5px; font-weight:600; color:#a78bfa; margin-top:7px; line-height:1.5; }

  .lbl { font-size:9.5px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; color:#94a3b8;
         display:block; margin-bottom:5px; }
  .inp { width:100%; font-size:13.5px; font-weight:600; color:#1e293b; background:#f8fafc;
         border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 12px; outline:none; box-sizing:border-box; }
  .inp:focus { border-color:#a78bfa; background:#fff; box-shadow:0 0 0 3px rgba(167,139,250,.18); }
  textarea.inp { min-height:72px; resize:vertical; }
  .save-btn { width:100%; padding:13px; border-radius:12px; background:#7c3aed; color:#fff; border:none;
              font-size:12px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; cursor:pointer; }
  .save-btn:hover { background:#6d28d9; }
  .save-btn:disabled { opacity:.55; cursor:not-allowed; }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:80;
           padding:11px 20px; border-radius:11px; font-size:12px; font-weight:800; color:#fff;
           box-shadow:0 8px 26px rgba(0,0,0,.25); max-width:88vw; text-align:center; }
</style>
</head>
<body>

<div id="mjm-ribbon" data-brand="MJM Nursery AI System" data-center="NELOS" data-sub="Nursery Case Log" data-logo="off"></div>
<script src="../shared/shared_ribbon.js"></script>

<div id="loading" class="max-w-[1100px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[1100px] mx-auto px-4 md:px-6 py-7 hidden">

  <a class="backlink" href="nelos_dashboard.html">&lsaquo; Back to Nelos Main Page</a>

  <!-- The name centred on the page, with the one action it offers under
       it rather than beside it — a heading pushed off centre by a button is
       a heading arranged around the button. -->
  <div class="head">
    <h1>Automate Cases</h1>
  </div>


  <!-- What each system opens a case for on its own, and where that case
       goes. The condition is the module's own code and is shown, not set,
       here; the two dropdowns beside it ARE the setting. -->
  <div id="conds"></div>


</div>

<!-- ── The drawer ───────────────────────────────────────────────── -->
<div id="scrim" class="scrim hidden">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <span class="font-black text-slate-800 uppercase tracking-widest text-xs" id="a-heading">New Automation</span>
      <button id="a-close" class="text-slate-400 hover:text-slate-700 text-2xl leading-none font-bold">&times;</button>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">1</span>What work is it?</div>
      <select id="a-type" class="inp"></select>
      <p class="note" id="a-type-note"></p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">2</span>Where?</div>
      <div class="row2">
        <div><label class="lbl" for="a-nursery">Nursery *</label>
          <select id="a-nursery" class="inp"></select></div>
        <div><label class="lbl" for="a-plot">Plot</label>
          <select id="a-plot" class="inp"></select></div>
      </div>
      <p class="note">Leave the plot on “every plot” and one case is raised per plot,
        every time it comes round.</p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">3</span>Who deals with it?</div>
      <div class="row2">
        <div><label class="lbl" for="a-dest">System</label><select id="a-dest" class="inp"></select></div>
        <div><label class="lbl" for="a-pic">Person in charge</label><select id="a-pic" class="inp"></select></div>
      </div>
      <p class="note" id="a-who-note"></p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">4</span>How often?</div>
      <div class="row2">
        <div><label class="lbl" for="a-repeat">Repeat</label>
          <select id="a-repeat" class="inp">
            <option value="weekly">Every week</option>
            <option value="monthly" selected>Every month</option>
          </select></div>
        <div><label class="lbl" for="a-day">On</label><select id="a-day" class="inp"></select></div>
      </div>
      <div class="row2" style="margin-top:9px;">
        <div><label class="lbl" for="a-priority">Priority</label>
          <select id="a-priority" class="inp">
            <option value="low">Low</option><option value="normal" selected>Normal</option>
            <option value="high">High</option><option value="urgent">Urgent</option>
          </select></div>
        <div><label class="lbl" for="a-due">Days to do it</label>
          <input id="a-due" class="inp" type="number" min="1" max="90" value="7"></div>
      </div>
      <p class="note" id="a-next-note"></p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">5</span>Anything to add?</div>
      <textarea id="a-note" class="inp"
                placeholder="Goes into every case this raises — “Measure ten seedlings per plot.”"></textarea>
    </div>

    <button id="a-save" class="save-btn">Save Automation</button>
  </div>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = id => document.getElementById(id);
const esc = MJMNelos.esc;

let types = [];        // nelos_work_types
let autos = [];        // nelos_automations
let modules = [];      // nelos_modules
let handlers = [];     // nelos_handlers
let plots = [];        // shared_plots
let editingId = null;
let me = { name: '' };

const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ORD = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

function toast(msg, ok) {
  const t = document.createElement('div');
  t.id = 'toast';
  t.style.background = ok === false ? '#dc2626' : '#16a34a';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

const typeOf  = k => types.find(t => t.key === k) || {};
const labelOf = k => (modules.find(m => m.key === k) || {}).label || k || '';
/* True once nelos_categories.auto_condition and the route PIC columns
   exist — i.e. once migration_nelos_auto_conditions.sql has run. */
let hasConds = false;
const handlerLabel = k => (modules.find(m => m.key === k) || {}).handler_label || labelOf(k);
const handlersIn = k => handlers.filter(h => h.primary_module === k && k)
                                .sort((a, b) => (a.seat_no || 99) - (b.seat_no || 99));

const fmtDate = d => d
  ? new Date(d + 'T00:00:00').toLocaleDateString('en-MY', { day:'numeric', month:'short', year:'numeric' })
  : '—';

/* How often, in words. "Every month on the 1st" reads; "monthly/1" does not. */
const everyText = a => a.repeat_every === 'weekly'
  ? `Every ${DOW[a.on_day] || 'week'}`
  : `Every month, ${ORD(a.on_day || 1)}`;

/* ── The list ──────────────────────────────────────────────────── */

/* PARKED, NOT DELETED.
   The "Work that comes round" half of this page — the schedule list and its
   New Automation drawer — was taken off screen on request. Everything below
   still works and nothing in the database changed: nelos_automations still
   holds the schedules and nelos_run_automations() still raises them, with or
   without a screen. Putting it back is putting two elements back:

     <div class="sec-bar"><h2 class="sec-h">Work that comes round</h2>
       <button class="tool-btn" id="new-btn"><span class="plus">+</span> New Automation</button></div>
     <div id="list"></div>

   Until then these render into nothing, so they check for it rather than
   throwing on a null. */
function render() {
  if (!$('list')) return;
  if (!autos.length) {
    $('list').innerHTML = `<div class="empty">Nothing repeats yet.<br>
      <span class="text-[11px] font-semibold text-slate-400">
        Press “New Automation” to set the first one up.</span></div>`;
    return;
  }

  $('list').innerHTML = autos.map(a => {
    const t = typeOf(a.work_type);
    const pic = a.assignee_name || (a.to_seat_no
      ? `${handlerLabel(a.to_module)} ${a.to_seat_no}`
      : null);
    return `
      <div class="card ${a.active ? '' : 'off'}">
        <div class="au">
          <div class="au-ico">${esc(t.icon || '🔁')}</div>

          <div class="min-w-0">
            <div class="au-what">${esc(t.label || a.work_type)}
              <span class="pill ${a.active ? 'pi-on' : 'pi-off'}">${a.active ? 'On' : 'Paused'}</span></div>
            <div class="au-where">${esc(a.nursery_name)} ·
              ${a.plot_name ? 'Plot ' + esc(a.plot_name) : 'every plot'}</div>
          </div>

          <div class="min-w-0">
            <span class="cap">Repeat</span>
            <span class="val">${esc(everyText(a))}</span>
            <span class="val-soft">Next ${esc(fmtDate(a.next_run_on))}</span>
          </div>

          <div class="min-w-0">
            <span class="cap">Goes to</span>
            <span class="val">${esc(labelOf(a.to_module) || '— unrouted —')}</span>
            <span class="val-soft">${pic ? esc(pic) : 'anyone in that system'}</span>
          </div>

          <div class="au-act">
            <button class="act" data-act="toggle" data-id="${a.id}"
                    title="${a.active ? 'Pause' : 'Turn on'}">${a.active ? '&#x23F8;' : '&#x25B6;'}</button>
            <button class="act" data-act="edit" data-id="${a.id}" title="Edit">&#x270E;</button>
            <button class="act act-del" data-act="del" data-id="${a.id}" title="Delete">&#x2715;</button>
          </div>
        </div>
      </div>`;
  }).join('');

  $('list').querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', () => {
      const a = autos.find(x => String(x.id) === b.dataset.id);
      if (!a) return;
      if (b.dataset.act === 'edit')   return openDrawer(a);
      if (b.dataset.act === 'toggle') return setActive(a, !a.active);
      if (b.dataset.act === 'del')    return remove(a);
    }));
}

/* ── The drawer ────────────────────────────────────────────────── */

function fillNurseries() {
  const names = [...new Set(plots.map(p => p.nursery_name).filter(Boolean))].sort();
  $('a-nursery').innerHTML = '<option value="">— choose a nursery —</option>' +
    names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
}

/* Plot names run B1, B2 … B10, so they sort numerically — the same
   comparison every other picker in the portal uses. */
function fillPlots() {
  const nursery = $('a-nursery').value;
  const mine = [...new Set(plots.filter(p => p.plot_name && (!nursery || p.nursery_name === nursery))
                                .map(p => p.plot_name))]
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  $('a-plot').innerHTML = '<option value="">Every plot in this nursery</option>' +
    mine.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
}

function fillPics() {
  const staff = handlersIn($('a-dest').value);
  const keep = $('a-pic').value;
  $('a-pic').innerHTML = staff.length
    ? `<option value="">Auto — #${staff[0].seat_no || 1} (${esc(staff[0].full_name || staff[0].email)})</option>` +
      staff.map(h => `<option value="${esc(h.user_id)}">#${h.seat_no || '—'} ${
        esc(h.full_name || h.email)}</option>`).join('')
    : '<option value="">Nobody is tagged to that system</option>';
  if (staff.some(h => h.user_id === keep)) $('a-pic').value = keep;

  const who = pickedPic();
  $('a-who-note').textContent = who
    ? `Every case this raises lands in ${who.full_name || who.email}'s to-do list.`
    : 'Nobody is tagged to that system yet, so these cases will sit unassigned.';
}

function pickedPic() {
  const staff = handlersIn($('a-dest').value);
  if (!staff.length) return null;
  return staff.find(h => h.user_id === $('a-pic').value) || staff[0];
}

/* "On" means a weekday when it repeats weekly and a date when it repeats
   monthly, so the picker changes with it rather than asking for a number
   and hoping. Capped at the 28th: every month has one. */
function fillDays() {
  const weekly = $('a-repeat').value === 'weekly';
  const keep = Number($('a-day').value);
  $('a-day').innerHTML = weekly
    ? DOW.map((d, i) => `<option value="${i}">${d}</option>`).join('')
    : Array.from({ length: 28 }, (_, i) =>
        `<option value="${i + 1}">${ORD(i + 1)}</option>`).join('');
  const max = weekly ? 6 : 28;
  const min = weekly ? 0 : 1;
  $('a-day').value = String(Math.min(Math.max(keep || min, min), max));
  sayNext();
}

function sayNext() {
  const weekly = $('a-repeat').value === 'weekly';
  const day = Number($('a-day').value);
  $('a-next-note').textContent =
    (weekly ? `Raised every ${DOW[day]}` : `Raised on the ${ORD(day)} of each month`) +
    `, due ${$('a-due').value || 7} days later.`;
}

function fillTypes() {
  $('a-type').innerHTML = types.map(t =>
    `<option value="${esc(t.key)}">${esc(t.icon || '')} ${esc(t.label)}</option>`).join('');
  sayType();
}

function sayType() {
  const t = typeOf($('a-type').value);
  $('a-type-note').textContent = t.audit_href
    ? `Each case opens ${t.label} in the Auditor Portal, on that plot.`
    : 'This work type has no Auditor Portal page to link to.';
}

function openDrawer(a) {
  editingId = a ? a.id : null;
  $('a-heading').textContent = a ? 'Edit Automation' : 'New Automation';
  $('a-save').textContent = a ? 'Save Changes' : 'Save Automation';
  $('scrim').classList.remove('hidden');

  $('a-type').value = a ? a.work_type : (types[0] || {}).key || '';
  sayType();

  fillNurseries();
  $('a-nursery').value = a ? a.nursery_name : '';
  fillPlots();
  $('a-plot').value = a && a.plot_name ? a.plot_name : '';

  $('a-dest').innerHTML = modules.map(m =>
    `<option value="${esc(m.key)}">${esc(m.label)}${m.sees_all_cases ? '  (HQ)' : ''}</option>`).join('');
  if (a && a.to_module) $('a-dest').value = a.to_module;
  $('a-pic').value = '';
  fillPics();
  if (a && a.assignee_id && [...$('a-pic').options].some(o => o.value === a.assignee_id)) {
    $('a-pic').value = a.assignee_id;
    fillPics();
  }

  $('a-repeat').value = a ? a.repeat_every : 'monthly';
  $('a-day').value = a ? String(a.on_day) : '';
  fillDays();
  $('a-priority').value = a ? a.priority : 'normal';
  $('a-due').value = a ? a.due_days : 7;
  $('a-note').value = a ? (a.note || '') : '';
  sayNext();
}

function closeDrawer() { $('scrim').classList.add('hidden'); }

/* ── Writing ───────────────────────────────────────────────────── */

async function save() {
  if (!$('a-nursery').value) { toast('Choose which nursery.', false); $('a-nursery').focus(); return; }

  const btn = $('a-save');
  btn.disabled = true;
  const pic = pickedPic();

  const row = {
    work_type:     $('a-type').value,
    nursery_name:  $('a-nursery').value,
    plot_name:     $('a-plot').value || null,
    to_module:     $('a-dest').value || null,
    to_seat_no:    pic ? (pic.seat_no || null) : null,
    assignee_id:   pic ? pic.user_id : null,
    assignee_name: pic ? (pic.full_name || pic.email) : null,
    repeat_every:  $('a-repeat').value,
    on_day:        Number($('a-day').value),
    priority:      $('a-priority').value,
    due_days:      Math.min(Math.max(Number($('a-due').value) || 7, 1), 90),
    note:          $('a-note').value.trim() || null,
    updated_at:    new Date().toISOString(),
    updated_by:    me.name
  };

  const { error } = editingId
    ? await _supabase.from('nelos_automations').update(row).eq('id', editingId)
    // A new one is due straight away: setting it up is saying it should
    // have been running, so the first round goes out rather than waiting
    // for a date that may be three weeks off.
    : await _supabase.from('nelos_automations')
        .insert([Object.assign({}, row, { created_by: me.name, active: true })]);

  btn.disabled = false;
  if (error) { toast('Could not save — ' + error.message, false); return; }

  toast(editingId ? 'Automation saved.' : 'Automation set up — it runs on the next load.');
  closeDrawer();
  await load();
}

async function setActive(a, on) {
  const { error } = await _supabase.from('nelos_automations')
    .update({ active: on, updated_at: new Date().toISOString(), updated_by: me.name })
    .eq('id', a.id);
  if (error) { toast('Could not change it — ' + error.message, false); return; }
  toast(on ? 'Running again.' : 'Paused — it raises nothing until it is turned back on.');
  await load();
}

async function remove(a) {
  const t = typeOf(a.work_type);
  if (!confirm(`Delete this automation — ${t.label || a.work_type} at ${a.nursery_name}?\n\n` +
               'Cases it has already raised stay where they are. Nothing new will be raised.')) return;
  const { error } = await _supabase.from('nelos_automations').delete().eq('id', a.id);
  if (error) { toast('Could not delete it — ' + error.message, false); return; }
  toast('Automation deleted.');
  await load();
}

/* ── Wiring ────────────────────────────────────────────────────── */

// Parked with the section above — see render().
if ($('new-btn')) $('new-btn').addEventListener('click', () => openDrawer(null));
$('a-close').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeDrawer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('a-type').addEventListener('change', sayType);
$('a-nursery').addEventListener('change', fillPlots);
$('a-dest').addEventListener('change', fillPics);
$('a-pic').addEventListener('change', fillPics);
$('a-repeat').addEventListener('change', fillDays);
$('a-day').addEventListener('change', sayNext);
$('a-due').addEventListener('input', sayNext);
$('a-save').addEventListener('click', save);

/* ── Loading ───────────────────────────────────────────────────── */

/* ── Cases a system opens by itself ─────────────────────────────────
   A condition is a nelos_categories row carrying auto_condition — plain
   words for when the module raises it without being asked. The words are
   the module code's and are read here, never set: changing them here would
   change the label, not the behaviour, which is the worst kind of setting.

   Where the case goes IS set here, and it is set where routing already
   lives — the nelos_routes row for that (system, work). So this page and
   the Case Routing tab on User Setting are two views of one table rather
   than two tables that can disagree, and nelos_route_case() picks up either
   without knowing which screen wrote it. */

let conds = [];   // nelos_categories rows with auto_condition set
let routes = [];  // nelos_routes rows

const routeFor = (mod, work) =>
  routes.find(r => r.source_module === mod && r.category === work) || null;

/* The people who could be the PIC: those pinned to the system the case is
   being sent to, by name. Same rule as the raise form — the pin decides who
   is in the list, the name decides the order. */
const picsFor = (mod) => handlers
  .filter(h => h.primary_module === mod)
  .map(h => ({ id: h.user_id, name: h.full_name || h.email || 'Unnamed' }))
  .sort((a, b) => a.name.localeCompare(b.name));

function renderConds() {
  if (!hasConds) {
    $('conds').innerHTML = `<div class="cond-sys"><div class="cond-empty">
      Run <strong>shared/migration_nelos_auto_conditions.sql</strong> in Supabase to
      list and re-point the cases each system opens on its own.</div></div>`;
    return;
  }

  /* Every system gets a card, including the ones with nothing — an absent
     section reads as "not loaded", a section saying "none yet" reads as an
     answer. */
  $('conds').innerHTML = modules.map(m => {
    const mine = conds.filter(c => c.module_key === m.key);
    const rows = mine.length
      ? `<div class="cond-head"><span>Condition</span><span>Open case action</span></div>` +
        mine.map(c => {
          const r = routeFor(m.key, c.name);
          const to = r?.to_module || m.key;
          const pics = picsFor(to);
          return `
          <div class="cond-row" data-mod="${esc(m.key)}" data-work="${esc(c.name)}">
            <div class="cond-work">${esc(c.name)}</div>
            <div class="cond-act">
              <select data-to>
                ${modules.map(x => `<option value="${esc(x.key)}"${x.key === to ? ' selected' : ''}
                  >${esc(x.handler_label || x.label)}</option>`).join('')}
              </select>
              <select data-pic>
                <option value="">Anyone in that system</option>
                ${pics.map(pp => `<option value="${esc(pp.id)}"${
                    r && r.to_user_id === pp.id ? ' selected' : ''}>${esc(pp.name)}</option>`).join('')}
              </select>
            </div>
          </div>`;
        }).join('')
      : `<div class="cond-empty">Nothing here opens a case on its own yet.</div>`;

    /* A "+" per system rather than one for the page: a condition belongs
       to the system that raises it, and the corner of that system's card is
       where you would reach for it. Writing one is not built yet — see
       addCond() — so it says so rather than opening something empty. */
    return `<div class="cond-sys">
      <div class="cond-sys-h">${esc(m.handler_label || m.label)}
        <button class="cond-add" data-add="${esc(m.key)}" title="Add a condition to ${esc(m.handler_label || m.label)}"
                aria-label="Add a condition to ${esc(m.handler_label || m.label)}">+</button></div>
      ${rows}</div>`;
  }).join('');

  $('conds').querySelectorAll('[data-add]').forEach(b =>
    b.addEventListener('click', () => addCond(b.dataset.add)));

  $('conds').querySelectorAll('.cond-row').forEach(row => {
    row.querySelectorAll('select').forEach(sel =>
      sel.addEventListener('change', () => saveCond(row, sel.hasAttribute('data-to'))));
  });
}

/* Adding a condition is not a row on a screen: the WHEN lives in the
   module that raises it, so a new one is a line of that module's code plus
   a line here. Until that flow exists this says what it would take, rather
   than opening a form whose Save could not mean anything. */
function addCond(modKey) {
  toast(`Adding a condition to ${labelOf(modKey)} is not built yet — ` +
        `the module has to raise it before this page can point it.`, false);
}

/* One rule, written where routing lives. Changing the system clears the PIC
   in the same breath: a person pinned to Auditor is not a PIC for a case
   that now goes to Stock, and leaving them there would send it to somebody
   who cannot see it. */
async function saveCond(row, systemChanged) {
  const mod  = row.dataset.mod;
  const work = row.dataset.work;
  const toSel  = row.querySelector('[data-to]');
  const picSel = row.querySelector('[data-pic]');
  if (systemChanged) picSel.value = '';

  const toModule = toSel.value;
  const picId    = picSel.value || null;
  const picName  = picId ? picSel.options[picSel.selectedIndex].text : null;

  const existing = routeFor(mod, work);
  const patch = {
    source_module: mod,
    category:      work,
    to_module:     toModule,
    to_user_id:    picId,
    to_user_name:  picName,
    updated_at:    new Date().toISOString(),
    updated_by:    me.name
  };

  const { error } = existing
    ? await _supabase.from('nelos_routes').update(patch).eq('id', existing.id)
    : await _supabase.from('nelos_routes').insert([patch]);

  if (error) { toast('Could not save — ' + error.message, false); await load(); return; }
  toast(`${work} now opens for ${labelOf(toModule)}${picName ? ' · ' + picName : ''}.`);
  await load();
}

async function load() {
  const [tRes, aRes, mRes, hRes, pRes, cRes, rRes] = await Promise.all([
    _supabase.from('nelos_work_types').select('*').eq('active', true).order('sort_order')
      .then(r => r, e => ({ error: e })),
    _supabase.from('nelos_automations').select('*').order('id')
      .then(r => r, e => ({ error: e })),
    _supabase.from('nelos_modules').select('*').eq('active', true).order('sort_order')
      .then(r => r, () => ({ data: [] })),
    _supabase.from('nelos_handlers').select('user_id,full_name,email,primary_module,seat_no')
      .then(r => r, () => ({ data: [] })),
    _supabase.from('shared_plots').select('plot_name,nursery_name')
      .then(r => r, () => ({ data: [] })),
    /* auto_condition and the PIC columns arrive with
       migration_nelos_auto_conditions.sql. On a database that has not run it
       these come back as errors and the section says so, rather than the
       page failing to load. */
    _supabase.from('nelos_categories')
      .select('name,module_key,auto_condition,sort_order')
      .eq('active', true).not('auto_condition', 'is', null).order('sort_order')
      .then(r => r, e => ({ error: e })),
    _supabase.from('nelos_routes').select('id,source_module,category,to_module,to_user_id,to_user_name')
      .then(r => r, e => ({ error: e }))
  ]);

  if (tRes.error || aRes.error) {
    $('list').innerHTML = `<div class="empty">
      Automation is not set up in this database yet.<br>
      <span class="text-[11px] font-semibold text-slate-400">
        Run <strong>shared/migration_nelos_automation.sql</strong> in Supabase.</span></div>`;
    return;
  }

  types    = tRes.data || [];
  autos    = aRes.data || [];
  modules  = mRes.data || [];
  handlers = hRes.data || [];
  plots    = pRes.data || [];
  hasConds = !cRes.error && !rRes.error;
  conds    = cRes.data || [];
  routes   = rRes.data || [];
  fillTypes();
  render();
  renderConds();
}

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }

    // A standing instruction raises work for other people, so it is a
    // setting — the same gate User Setting uses.
    if (!(MJMAccess.isAdminOf('nelos') || MJMAccess.canManageUsers())) {
      alert('Only a Nelos admin can open Automation Cases.');
      window.location.href = 'nelos_dashboard.html';
      return;
    }

    const u = MJMAccess.user();
    me = { name: u.full_name || u.email || '' };
    MJMNelos.init(_supabase, { root: '../' });

    await load();
    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
  } catch (e) {
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>
</body>
