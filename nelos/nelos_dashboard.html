<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELOS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ENL%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_nelos.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#faf5ff; margin:0; }
  .hidden { display:none !important; }

  .tool-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px;
              background:white; border:1.5px solid #ddd6fe; color:#6d28d9; font-weight:900; font-size:11px;
              letter-spacing:.08em; text-transform:uppercase; text-decoration:none; transition:all .15s;
              box-shadow:0 3px 10px rgba(124,58,237,.10); cursor:pointer; }
  .tool-btn:hover { background:#ede9fe; transform:translateY(-1px); }
  .tool-btn-primary { background:#7c3aed; color:#fff; border-color:#7c3aed; }
  .tool-btn-primary:hover { background:#6d28d9; }
  .tool-btn-access { background:#fff1f2; color:#9f1239; border-color:#fecdd3; }
  .tool-btn-access:hover { background:#ffe4e6; }

  .toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .f-chk { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800;
           color:#475569; background:#fff; border:1.5px solid #e2e8f0; border-radius:9px;
           padding:6px 11px; cursor:pointer; }
  .f-chk input { width:14px; height:14px; accent-color:#7c3aed; }

  /* ── The case list, as one box ──────────────────────────────── */
  /* A bordered box with its own heading, so the list is obviously a list
     even on a day when nothing is in it. */
  .list-box { background:#fff; border:1.5px solid #ddd6fe; border-radius:16px; overflow:hidden;
              box-shadow:0 5px 20px rgba(124,58,237,.07); }
  .list-head { display:flex; align-items:center; gap:11px; padding:15px 18px;
               border-bottom:1.5px solid #ede9fe; background:#faf5ff; }
  .list-title { font-size:15px; font-weight:900; color:#4c1d95; letter-spacing:.01em; }
  .list-n { margin-left:auto; font-size:10px; font-weight:900; letter-spacing:.07em;
            text-transform:uppercase; color:#8b5cf6; background:#ede9fe;
            padding:3px 10px; border-radius:999px; }

  /* Four columns, the same grid for the header strip and every row. */
  .th, .tr { display:grid; grid-template-columns:112px 168px 1fr 118px; gap:14px; }
  .th { padding:10px 18px; background:#fdfcff; border-bottom:1.5px solid #ede9fe; }
  .th span { font-size:9.5px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; color:#a78bfa; }
  .tr { padding:14px 18px; border-bottom:1px dashed #ede9fe; align-items:start; }
  .tr:last-child { border-bottom:none; }
  .tr:hover { background:#fdfcff; }
  .tr.is-overdue { background:#fffbfb; }

  .td-stack { display:flex; flex-direction:column; gap:4px; align-items:flex-start; min-width:0; }
  .st-word { font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
             padding:4px 10px; border-radius:7px; }
  .st-pending { background:#fef3c7; color:#a16207; }
  .st-solved  { background:#dcfce7; color:#15803d; }
  .st-exact { font-size:9.5px; font-weight:800; color:#94a3b8; letter-spacing:.05em; text-transform:uppercase; }
  .sys-line { font-size:12.5px; font-weight:800; color:#4c1d95; }
  .pic-line { font-size:11.5px; font-weight:700; color:#64748b; }
  .pic-none { font-style:italic; color:#b45309; }

  .td-case { display:flex; gap:11px; min-width:0; }
  .thumb { width:58px; height:58px; border-radius:9px; object-fit:cover; flex-shrink:0;
           border:1.5px solid #ede9fe; background:#f8fafc; }
  .case-no { font-size:10px; font-weight:900; letter-spacing:.06em; color:#7c3aed; }
  .case-title { font-size:14px; font-weight:800; color:#1e293b; margin-top:2px; line-height:1.35; }
  .case-desc { font-size:11.5px; font-weight:600; color:#64748b; margin-top:3px; line-height:1.5;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .case-meta { font-size:10.5px; font-weight:600; color:#94a3b8; margin-top:5px;
               display:flex; flex-wrap:wrap; gap:3px 10px; }

  .pill { font-size:9px; font-weight:900; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:6px; }
  .pi-urgent { background:#fee2e2; color:#b91c1c; } .pi-high { background:#ffedd5; color:#c2410c; }
  .pi-normal { background:#e0f2fe; color:#0369a1; } .pi-low  { background:#f1f5f9; color:#64748b; }
  .src { background:#f5f3ff; color:#6d28d9; }
  .overdue { font-size:10px; font-weight:900; color:#b91c1c; }

  /* ── Row actions ────────────────────────────────────────────── */
  /* Which of these appear is decided by the person's rights, read once from
     nelos_my_rights() — see migration_nelos_case_tools.sql. */
  .td-act { display:flex; flex-direction:column; gap:5px; }
  .act { display:inline-flex; align-items:center; justify-content:center; gap:5px; width:100%;
         padding:6px 8px; border-radius:8px; border:1.5px solid #e9e3fb; background:#fff; cursor:pointer;
         font-size:9.5px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#6d28d9;
         text-decoration:none; white-space:nowrap; }
  .act:hover { background:#f5f3ff; border-color:#c4b5fd; }
  .act-solve  { color:#15803d; border-color:#bbf7d0; } .act-solve:hover  { background:#f0fdf4; border-color:#86efac; }
  .act-del    { color:#b91c1c; border-color:#fecaca; } .act-del:hover    { background:#fef2f2; border-color:#fca5a5; }
  .act:disabled { opacity:.5; cursor:wait; }

  .empty { text-align:center; padding:52px 16px; color:#a5b4c4; font-weight:700; font-size:13px; }

  /* ── Page tabs, under the list ──────────────────────────────── */
  .tabs { display:flex; gap:7px; flex-wrap:wrap; margin-top:16px; }
  .tab { padding:9px 17px; border-radius:999px; border:1.5px solid #ddd6fe; background:#fff; color:#6d28d9;
         font-size:10.5px; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
         text-decoration:none; cursor:pointer; }
  .tab:hover { background:#f5f3ff; }
  .tab.on { background:#7c3aed; color:#fff; border-color:#7c3aed; }

  /* Stacked on a phone: the column headings mean nothing once the columns
     are gone, so they go with them. */
  @media (max-width:820px) {
    .th { display:none; }
    .tr { grid-template-columns:1fr; gap:9px; padding:15px 16px; }
    .td-act { flex-direction:row; flex-wrap:wrap; }
    .act { width:auto; flex:1; min-width:88px; }
  }

  /* ── Filters ────────────────────────────────────────────────── */
  .f-sel { font-size:11px; font-weight:700; color:#475569; background:#fff; border:1.5px solid #e2e8f0;
           border-radius:9px; padding:7px 11px; outline:none; }
  .f-sel:focus { border-color:#a78bfa; box-shadow:0 0 0 3px rgba(167,139,250,.18); }

  /* ── New-case drawer ────────────────────────────────────────── */
  .scrim { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:60; display:flex;
           align-items:flex-end; justify-content:center; }
  @media (min-width:768px) { .scrim { align-items:center; } }
  .sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh;
           overflow-y:auto; padding:22px; box-shadow:0 -10px 40px rgba(0,0,0,.25); }
  @media (min-width:768px) { .sheet { border-radius:20px; } }
  .lbl { font-size:9.5px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; color:#94a3b8;
         display:block; margin-bottom:5px; }
  .inp { width:100%; font-size:13.5px; font-weight:600; color:#1e293b; background:#f8fafc;
         border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 12px; outline:none; box-sizing:border-box; }
  .inp:focus { border-color:#a78bfa; background:#fff; box-shadow:0 0 0 3px rgba(167,139,250,.18); }
  textarea.inp { min-height:88px; resize:vertical; }
  .save-btn { width:100%; padding:13px; border-radius:12px; background:#7c3aed; color:#fff; border:none;
              font-size:12px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; cursor:pointer; }
  .save-btn:hover { background:#6d28d9; }
  .save-btn:disabled { opacity:.55; cursor:not-allowed; }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:80;
           padding:11px 20px; border-radius:11px; font-size:12px; font-weight:800; color:#fff;
           box-shadow:0 8px 26px rgba(0,0,0,.25); }
</style>
</head>
<body>

<!-- Standardised MJM Nursery AI ribbon — see shared/shared_ribbon.js -->
<div id="mjm-ribbon" data-brand="MJM Nursery AI System" data-center="NELOS" data-sub="Nursery Case Log" data-logo="off"></div>
<script src="../shared/shared_ribbon.js"></script>


<div id="loading" class="max-w-[980px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[980px] mx-auto px-4 md:px-6 py-7 hidden">

  <!-- Raise a Case is the one thing done from here often, so it leads on
       the right where the eye ends up, on a row of its own. -->
  <div class="toolbar">
    <button class="tool-btn tool-btn-primary" id="new-case-btn" style="margin-left:auto">➕ Raise a Case</button>
  </div>

  <!-- One list, filtered. Overdue is a filter rather than a separate block:
       an overdue case is a pending case somebody is late on, not a
       different kind of thing. -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <select id="f-status" class="f-sel">
      <option value="pending">Pending to solve</option>
      <option value="open">Open</option>
      <option value="in_progress">In Progress</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
      <option value="">Any status</option>
    </select>
    <select id="f-source" class="f-sel"><option value="">Any system</option></select>
    <select id="f-priority" class="f-sel">
      <option value="">Any priority</option>
      <option value="urgent">Urgent</option><option value="high">High</option>
      <option value="normal">Normal</option><option value="low">Low</option>
    </select>
    <select id="f-mine" class="f-sel">
      <option value="">Anyone</option>
      <option value="mine">Assigned to me</option>
      <option value="unassigned">Unassigned</option>
    </select>
    <label class="f-chk"><input type="checkbox" id="f-overdue"> Overdue only</label>
    <input id="f-q" class="f-sel flex-1 min-w-[150px]" placeholder="Search title, batch, plot…">
  </div>

  <div class="list-box">
    <div class="list-head">
      <span class="list-title">🗂️ Nursery Cases</span>
      <span class="list-n" id="count">—</span>
    </div>
    <div class="th">
      <span>Status</span>
      <span>System &amp; PIC</span>
      <span>Case Details</span>
      <span>Actions</span>
    </div>
    <div id="list"></div>
  </div>

  <!-- The page's own tabs sit under the list: the cases are the page, and
       the setting is the other place to go from it. -->
  <div class="tabs">
    <span class="tab on">🗂️ Nursery Cases</span>
    <a class="tab hidden" id="user-setting-btn" href="nelos_user_setting.html">⚙️ User Setting</a>
  </div>

</div>

<!-- ── New case drawer ─────────────────────────────────────────── -->
<div id="new-scrim" class="scrim hidden">
  <div class="sheet">
    <div class="flex items-center justify-between mb-4">
      <span class="font-black text-slate-800 uppercase tracking-widest text-xs" id="c-heading">Raise a Case</span>
      <button id="new-close" class="text-slate-400 hover:text-slate-700 text-2xl leading-none font-bold">&times;</button>
    </div>

    <div class="mb-3"><label class="lbl" for="c-title">Title *</label>
      <input id="c-title" class="inp" placeholder="What is wrong, in one line" maxlength="300"></div>

    <div class="grid grid-cols-2 gap-3 mb-3">
      <div><label class="lbl" for="c-category">Category</label><select id="c-category" class="inp"></select></div>
      <div><label class="lbl" for="c-priority">Priority</label>
        <select id="c-priority" class="inp">
          <option value="low">Low</option><option value="normal" selected>Normal</option>
          <option value="high">High</option><option value="urgent">Urgent</option>
        </select></div>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-3">
      <div><label class="lbl" for="c-nursery">Nursery</label><input id="c-nursery" class="inp" placeholder="optional"></div>
      <div><label class="lbl" for="c-plot">Plot</label><input id="c-plot" class="inp" placeholder="optional"></div>
      <div><label class="lbl" for="c-batch">Batch</label><input id="c-batch" class="inp" placeholder="optional"></div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-3">
      <div><label class="lbl" for="c-assignee">Assign to</label><select id="c-assignee" class="inp"></select></div>
      <div><label class="lbl" for="c-due">Due date</label><input id="c-due" type="date" class="inp"></div>
    </div>

    <div class="mb-3"><label class="lbl" for="c-desc">Detail</label>
      <textarea id="c-desc" class="inp" placeholder="What happened, what needs doing, anything the assignee needs to know."></textarea></div>

    <!-- One photo. A case is usually about a thing somebody is standing in
         front of, and a picture of it saves a paragraph. -->
    <div class="mb-3"><label class="lbl" for="c-photo">Photo</label>
      <input id="c-photo" type="file" accept="image/*" class="inp" style="padding:8px 10px;font-size:12px;">
      <div id="c-photo-now" class="hidden" style="margin-top:7px;display:flex;align-items:center;gap:9px;">
        <img id="c-photo-thumb" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1.5px solid #ede9fe;">
        <button type="button" id="c-photo-drop"
                style="font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#b91c1c;background:none;border:none;cursor:pointer;">
          Remove photo</button>
      </div>
    </div>

    <div class="mb-4" id="c-source-wrap"><label class="lbl" for="c-source">Raised from</label>
      <!-- Filled from nelos_modules, so the linked modules on the User
           Setting page and the ones you can raise against stay the same
           list. Falls back to Nelos alone if that table is unreachable. -->
      <select id="c-source" class="inp">
        <option value="nelos">Nelos</option>
      </select></div>

    <button id="c-save" class="save-btn">Create Case</button>
  </div>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = id => document.getElementById(id);
const esc = MJMNelos.esc;

let allCases = [];      // everything we are allowed to see, loaded once
let categories = [];
let me = { id: null, name: null };

/* What this person may press. Read once from nelos_my_rights(). The
   fallback is what everybody could do before that function existed, so a
   database that has not run migration_nelos_case_tools.sql still works —
   with Edit and Delete simply absent, which is what they were. */
let rights = { is_admin: false, may_solve: true, may_edit: false, may_delete: false };

let editingId = null;   // case being edited, or null when raising a new one
let photoUrl  = null;   // the photo on the case in the drawer, once uploaded

const todayISO = () => new Date().toISOString().slice(0, 10);
const isPending = c => c.status === 'open' || c.status === 'in_progress';
const isOverdue = c => isPending(c) && c.due_date && c.due_date < todayISO();

function toast(msg, ok) {
  const t = document.createElement('div');
  t.id = 'toast';
  t.style.background = ok === false ? '#dc2626' : '#16a34a';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ── Rendering ─────────────────────────────────────────────────── */

function fmtDate(d) {
  return d ? new Date(d + 'T00:00:00').toLocaleDateString('en-MY', { day:'numeric', month:'short', year:'numeric' }) : '';
}

/* Which system has to deal with it — where it was routed to, falling back
   to where it was raised. */
const queueOf = c => c.assigned_module || c.source_module;

/* One row of the list. Four columns: how it stands, who has to deal with
   it, what it is about, and what can be done to it from here. */
function rowHtml(c) {
  const subject = [
    c.batch_name && 'Batch ' + c.batch_name,
    c.plot_name, c.nursery_name
  ].filter(Boolean).join(' · ');

  const pending = isPending(c);
  const due = c.due_date
    ? (isOverdue(c) ? `<div class="overdue">⏰ Overdue — was due ${esc(fmtDate(c.due_date))}</div>`
                    : `<span>📅 Due ${esc(fmtDate(c.due_date))}</span>`)
    : '';

  const queue = queueOf(c);
  const raisedIn = MJMNelos.SOURCE_LABEL[c.source_module] || c.source_module || '';
  const queueIn  = MJMNelos.SOURCE_LABEL[queue] || queue || '';

  return `
    <div class="tr ${isOverdue(c) ? 'is-overdue' : ''}" data-case="${esc(c.id)}">

      <div class="td-stack">
        <span class="st-word ${pending ? 'st-pending' : 'st-solved'}">${pending ? 'Pending' : 'Solved'}</span>
        <span class="st-exact">${esc(MJMNelos.STATUS_LABEL[c.status] || c.status)}</span>
        <span class="pill pi-${esc(c.priority || 'normal')}">${esc(MJMNelos.PRIORITY_LABEL[c.priority] || c.priority || '')}</span>
      </div>

      <div class="td-stack">
        <span class="sys-line">${esc(queueIn)}</span>
        ${queue !== c.source_module ? `<span class="st-exact">raised in ${esc(raisedIn)}</span>` : ''}
        <span class="pic-line">${c.assignee_name
          ? '👤 ' + esc(c.assignee_name)
          : '<span class="pic-none">👤 no PIC yet</span>'}</span>
      </div>

      <div class="td-case">
        ${c.photo_url ? `<img class="thumb" src="${esc(c.photo_url)}" alt="" loading="lazy">` : ''}
        <div class="min-w-0">
          <span class="case-no">${esc(c.case_no || '')}</span>
          <div class="case-title">${esc(c.title)}</div>
          ${c.description ? `<div class="case-desc">${esc(c.description)}</div>` : ''}
          <div class="case-meta">
            ${c.category ? `<span>🏷️ ${esc(c.category)}</span>` : ''}
            ${subject ? `<span>📍 ${esc(subject)}</span>` : ''}
            <span>🕑 ${esc(new Date(c.created_at).toLocaleDateString('en-MY', { day:'numeric', month:'short' }))}</span>
            ${due}
          </div>
        </div>
      </div>

      <div class="td-act">
        <a class="act" href="nelos_case.html?id=${encodeURIComponent(c.id)}">👁 View</a>
        ${rights.may_edit  ? `<button class="act act-edit"  data-act="edit"  data-id="${esc(c.id)}">✏️ Edit</button>` : ''}
        ${rights.may_solve && pending
                           ? `<button class="act act-solve" data-act="solve" data-id="${esc(c.id)}">✅ Solve</button>` : ''}
        ${rights.may_delete ? `<button class="act act-del" data-act="del"   data-id="${esc(c.id)}">🗑 Delete</button>` : ''}
      </div>

    </div>`;
}

function visibleCases() {
  const status   = $('f-status').value;
  const source   = $('f-source').value;
  const priority = $('f-priority').value;
  const who      = $('f-mine').value;
  const q        = $('f-q').value.trim().toLowerCase();

  return allCases.filter(c => {
    if ($('f-overdue').checked && !isOverdue(c)) return false;

    if (status === 'pending') { if (!isPending(c)) return false; }
    else if (status && c.status !== status) return false;

    if (source && c.source_module !== source) return false;
    if (priority && c.priority !== priority) return false;
    if (who === 'mine' && c.assignee_id !== me.id) return false;
    if (who === 'unassigned' && c.assignee_id) return false;

    if (q) {
      const hay = [c.title, c.case_no, c.category, c.batch_name, c.plot_name,
                   c.nursery_name, c.assignee_name, c.description]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  // Overdue first, then the rest — one list, worst at the top, rather than
  // an overdue block sitting apart from the queue it belongs to.
  const rows = visibleCases().sort((a, b) => (isOverdue(b) ? 1 : 0) - (isOverdue(a) ? 1 : 0));

  const overdue = rows.filter(isOverdue).length;
  $('count').textContent = rows.length
    ? `${rows.length} case${rows.length === 1 ? '' : 's'}${overdue ? ` · ${overdue} overdue` : ''}`
    : 'none';

  $('list').innerHTML = rows.length
    ? rows.map(rowHtml).join('')
    : `<div class="empty">No cases match this filter.<br>
         <span class="text-[11px] font-semibold text-slate-400">
           ${allCases.length ? 'Try widening it, or clear the search box.' : 'Nothing has been raised yet — press “Raise a Case”.'}
         </span></div>`;

  $('list').querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', () => {
      const c = allCases.find(x => String(x.id) === b.dataset.id);
      if (!c) return;
      if (b.dataset.act === 'edit')  return openEdit(c);
      if (b.dataset.act === 'solve') return solveCase(c, b);
      if (b.dataset.act === 'del')   return deleteCase(c, b);
    }));
}

/* ── Solve and delete ──────────────────────────────────────────── */

/* Marking a case solved asks what was done. The answer is the resolution —
   a closed case with no account of how is a case nobody can learn from. */
async function solveCase(c, btn) {
  const what = prompt(`Solve ${c.case_no || 'this case'} — what was done?`, '');
  if (what === null) return;                       // Cancel
  if (!what.trim()) { toast('Say what was done, in a line.', false); return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await _supabase.from('nelos_cases').update({
    status: 'resolved',
    resolution: what.trim(),
    resolved_by: me.name,
    resolved_at: new Date().toISOString(),
    updated_by: me.name,
    updated_at: new Date().toISOString()
  }).eq('id', c.id);

  if (error) {
    btn.disabled = false; btn.textContent = '✅ Solve';
    toast('Could not solve it — ' + error.message, false);
    return;
  }
  toast(`${c.case_no || 'Case'} solved.`);
  await loadCases();
}

/* Deleting is the one action that loses something, so it names the case
   and says the word rather than asking "are you sure?" about nothing. */
async function deleteCase(c, btn) {
  if (!confirm(`Delete ${c.case_no || 'this case'} — “${c.title}” — for good?\n\n` +
               'This cannot be undone. To retire a case and keep the record, solve it instead.')) return;

  btn.disabled = true; btn.textContent = 'Deleting…';
  const { error } = await _supabase.from('nelos_cases').delete().eq('id', c.id);
  if (error) {
    btn.disabled = false; btn.textContent = '🗑 Delete';
    toast('Could not delete it — ' + error.message, false);
    return;
  }
  toast(`${c.case_no || 'Case'} deleted.`);
  await loadCases();
  loadSourceFilter();
}

/* ── Loading ───────────────────────────────────────────────────── */

/* Edit, Solve and Delete are per-person rights set on the User Setting
   page. A database without migration_nelos_case_tools.sql has no such
   function; there the fallback below applies, which is what everybody could
   do before — solve yes, delete no — plus admin, read from the portal. */
async function loadRights() {
  const { data, error } = await _supabase.rpc('nelos_my_rights').then(r => r, e => ({ error: e }));
  const row = data && data[0];
  if (error || !row) {
    const admin = MJMAccess.isAdminOf('nelos');
    rights = { is_admin: admin, may_solve: true, may_edit: admin, may_delete: admin };
    return;
  }
  rights = row;
}

async function loadCases() {
  const { data, error } = await _supabase.from('nelos_cases').select('*')
    .order('created_at', { ascending: false })
    .limit(1000);
  if (error) {
    $('list').innerHTML = `<div class="empty">Could not load cases — ${esc(error.message)}
      <br><span class="text-[11px] font-semibold text-slate-400">
        If Nelos is new, run <strong>shared/migration_nelos.sql</strong> in Supabase first.</span></div>`;
    return;
  }
  // Worst priority first inside each status, since priority is a word in
  // the database and cannot be ordered there.
  const sorted = (data || []).sort((a, b) =>
    (MJMNelos.PRIORITY_RANK[a.priority] ?? 9) - (MJMNelos.PRIORITY_RANK[b.priority] ?? 9));
  // Narrow to the modules and categories this person is set up for on the
  // User Setting page. Someone in no block at all still sees everything.
  allCases = await MJMNelos.applyScope(sorted);
  render();
}

async function loadCategories() {
  const { data } = await _supabase.from('nelos_categories').select('*')
    .eq('active', true).order('sort_order').then(r => r, () => ({ data: [] }));
  categories = data || [];
  fillCategories($('c-source').value);
}

/* A case title belongs to one system, so the picker offers only the titles
   of whichever system the case is being raised in. Older databases have no
   module_key on a category; there, every title is offered, which is how it
   behaved before migration_nelos_category_system.sql. */
function fillCategories(sourceKey) {
  const scoped = categories.some(c => c.module_key)
    ? categories.filter(c => c.module_key === sourceKey)
    : categories;
  const keep = $('c-category').value;
  $('c-category').innerHTML = '<option value="">— none —</option>' +
    scoped.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  if (scoped.some(c => c.name === keep)) $('c-category').value = keep;
}

async function loadAssignees() {
  // nelos_assignable_users() — a SECURITY DEFINER function, because normal
  // users may not select from shared_profiles (see migration_nelos.sql).
  const { data } = await _supabase.rpc('nelos_assignable_users').then(r => r, () => ({ data: [] }));
  const users = data || [];
  $('c-assignee').innerHTML = '<option value="">— unassigned —</option>' +
    users.map(u => `<option value="${esc(u.id)}">${esc(u.full_name || u.email)}</option>`).join('');
}

/* The linked modules, for the "Raised from" picker. Nelos itself is always
   an option — a case need not come from another module. */
async function loadModules() {
  // Only sections that may raise a case are offered. A section switched off
  // on the User Setting page stops appearing here rather than raising cases
  // that route nowhere.
  const { data } = await _supabase.from('nelos_modules').select('key,label')
    .eq('active', true).eq('can_create', true).order('sort_order')
    .then(r => r, () => ({ data: [] }));
  const mods = data || [];
  if (!mods.length) return;
  $('c-source').innerHTML =
    mods.map(m => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join('') +
    '<option value="nelos">Nelos (no module)</option>';
  $('c-source').value = 'nelos';
}

function loadSourceFilter() {
  const seen = [...new Set(allCases.map(c => c.source_module).filter(Boolean))];
  $('f-source').innerHTML = '<option value="">Any module</option>' +
    seen.map(s => `<option value="${esc(s)}">${esc(MJMNelos.SOURCE_LABEL[s] || s)}</option>`).join('');
}

/* ── New case ──────────────────────────────────────────────────── */

function clearDrawer() {
  ['c-title','c-desc','c-nursery','c-plot','c-batch','c-due'].forEach(id => $(id).value = '');
  $('c-priority').value = 'normal';
  $('c-category').value = '';
  $('c-assignee').value = '';
  $('c-photo').value = '';
  setPhoto(null);
}

/* Shows (or clears) the photo currently attached to whatever is in the
   drawer. photoUrl is what Save will write. */
function setPhoto(url) {
  photoUrl = url || null;
  $('c-photo-now').classList.toggle('hidden', !photoUrl);
  if (photoUrl) $('c-photo-thumb').src = photoUrl;
}

function openNew(prefill) {
  editingId = null;
  clearDrawer();
  $('c-heading').textContent = 'Raise a Case';
  $('c-save').textContent = 'Create Case';
  $('c-source-wrap').classList.remove('hidden');
  $('new-scrim').classList.remove('hidden');
  if (prefill) {
    if (prefill.source) { $('c-source').value = prefill.source; fillCategories(prefill.source); }
    if (prefill.batch)  $('c-batch').value  = prefill.batch;
    if (prefill.plot)   $('c-plot').value   = prefill.plot;
    if (prefill.nursery) $('c-nursery').value = prefill.nursery;
    if (prefill.title)  $('c-title').value  = prefill.title;
  }
  setTimeout(() => $('c-title').focus(), 60);
}

/* The same drawer, filled in. "Raised from" is hidden while editing: where
   a case came from is a fact about it, and changing it would re-route a
   case somebody is already working on. */
function openEdit(c) {
  editingId = c.id;
  clearDrawer();
  $('c-heading').textContent = 'Edit ' + (c.case_no || 'Case');
  $('c-save').textContent = 'Save Changes';
  $('c-source-wrap').classList.add('hidden');

  $('c-source').value = c.source_module || 'nelos';
  fillCategories(c.source_module || 'nelos');

  $('c-title').value   = c.title || '';
  $('c-desc').value    = c.description || '';
  $('c-priority').value = c.priority || 'normal';
  $('c-nursery').value = c.nursery_name || '';
  $('c-plot').value    = c.plot_name || '';
  $('c-batch').value   = c.batch_name || '';
  $('c-due').value     = c.due_date || '';
  if (c.category) $('c-category').value = c.category;
  if (c.assignee_id) $('c-assignee').value = c.assignee_id;
  setPhoto(c.photo_url);

  $('new-scrim').classList.remove('hidden');
  setTimeout(() => $('c-title').focus(), 60);
}

function closeNew() { $('new-scrim').classList.add('hidden'); }

/* Uploads whatever is in the file box and returns its public URL, or
   undefined if nothing was chosen. Throws with a readable message so the
   Save handler can show it and leave the drawer open. */
async function uploadPhoto() {
  const file = $('c-photo').files && $('c-photo').files[0];
  if (!file) return undefined;
  if (file.size > 8 * 1024 * 1024) throw new Error('That photo is over 8 MB — take a smaller one.');

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${new Date().toISOString().slice(0, 10)}/${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await _supabase.storage.from('nelos-photos')
    .upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw new Error('Photo upload failed — ' + error.message);

  return _supabase.storage.from('nelos-photos').getPublicUrl(path).data.publicUrl;
}

/* Choosing a category fills in its house defaults — the priority it is
   usually raised at, and the due date it is usually given. Both stay
   editable; this only saves typing. */
$('c-source').addEventListener('change', () => fillCategories($('c-source').value));

$('c-category').addEventListener('change', () => {
  const cat = categories.find(c => c.name === $('c-category').value);
  if (!cat) return;
  if (cat.default_priority) $('c-priority').value = cat.default_priority;
  if (cat.default_days != null && !$('c-due').value) {
    const d = new Date();
    d.setDate(d.getDate() + Number(cat.default_days));
    $('c-due').value = d.toISOString().slice(0, 10);
  }
});

$('c-photo').addEventListener('change', () => {
  const f = $('c-photo').files && $('c-photo').files[0];
  // Show the chosen file straight away, before it is uploaded, so the
  // drawer confirms what was picked rather than waiting for Save.
  setPhoto(f ? URL.createObjectURL(f) : photoUrl);
});
$('c-photo-drop').addEventListener('click', () => { $('c-photo').value = ''; setPhoto(null); });

$('c-save').addEventListener('click', async () => {
  const title = $('c-title').value.trim();
  if (!title) { toast('A case needs a title.', false); $('c-title').focus(); return; }

  const btn = $('c-save');
  const wording = editingId ? 'Save Changes' : 'Create Case';
  btn.disabled = true; btn.textContent = editingId ? 'Saving…' : 'Creating…';

  let uploaded;
  try {
    uploaded = await uploadPhoto();
  } catch (e) {
    btn.disabled = false; btn.textContent = wording;
    toast(e.message, false);
    return;
  }

  if (editingId) {
    const sel = $('c-assignee');
    const row = {
      title,
      description:   $('c-desc').value.trim() || null,
      category:      $('c-category').value || null,
      priority:      $('c-priority').value,
      nursery_name:  $('c-nursery').value.trim() || null,
      plot_name:     $('c-plot').value.trim() || null,
      batch_name:    $('c-batch').value.trim() || null,
      assignee_id:   sel.value || null,
      assignee_name: sel.value ? sel.options[sel.selectedIndex].text : null,
      due_date:      $('c-due').value || null,
      updated_by:    me.name,
      updated_at:    new Date().toISOString()
    };
    // A photo is only written when it changed: uploaded means a new one,
    // photoUrl === null after Remove means clear it, and neither means
    // leave whatever is there — including on a database with no such column.
    if (uploaded) row.photo_url = uploaded;
    else if (photoUrl === null) row.photo_url = null;

    const { error } = await _supabase.from('nelos_cases').update(row).eq('id', editingId);
    btn.disabled = false; btn.textContent = wording;
    if (error) { toast('Could not save — ' + error.message, false); return; }

    toast('Case saved.');
    closeNew();
    await loadCases();
    return;
  }

  const sel = $('c-assignee');
  const { data, error } = await MJMNelos.raise({
    photoUrl:    uploaded || null,
    title,
    description: $('c-desc').value.trim() || null,
    category:    $('c-category').value || null,
    priority:    $('c-priority').value,
    source:      $('c-source').value,
    nursery:     $('c-nursery').value.trim() || null,
    plot:        $('c-plot').value.trim() || null,
    batch:       $('c-batch').value.trim() || null,
    assigneeId:  sel.value || null,
    assigneeName: sel.value ? sel.options[sel.selectedIndex].text : null,
    dueDate:     $('c-due').value || null
  });

  btn.disabled = false; btn.textContent = wording;
  if (error) { toast('Could not create the case — ' + error.message, false); return; }

  toast('Case ' + (data.case_no || '') + ' created.');
  closeNew();
  clearDrawer();
  await loadCases();
  loadSourceFilter();
});

/* ── Wiring ────────────────────────────────────────────────────── */

$('new-case-btn').addEventListener('click', () => openNew());
$('new-close').addEventListener('click', closeNew);
$('new-scrim').addEventListener('click', e => { if (e.target === $('new-scrim')) closeNew(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNew(); });

['f-status', 'f-source', 'f-priority', 'f-mine', 'f-overdue'].forEach(id =>
  $(id).addEventListener('change', render));
$('f-q').addEventListener('input', render);

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('nelos')) {
      alert('You do not have access to Nelos.');
      window.location.href = '../index.html';
      return;
    }
    const u = MJMAccess.user();
    me = { id: u.id, name: u.full_name || u.email || '' };
    MJMNelos.init(_supabase, { root: '../' });

    // User Setting decides who sees which module's cases. Only a Nelos
    // admin (or a portal admin who manages users) may open it.
    if (MJMAccess.isAdminOf('nelos') || MJMAccess.canManageUsers()) {
      $('user-setting-btn').classList.remove('hidden');
    }

    // What this person may press, before the first render draws buttons.
    await loadRights();

    await Promise.all([loadCases(), loadCategories(), loadAssignees(), loadModules()]);
    loadSourceFilter();

    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');

    // Deep link from another module's To-Do widget:
    //   nelos_dashboard.html?new=1&source=operation&batch=264
    const qs = new URLSearchParams(location.search);
    if (qs.get('new')) {
      openNew({
        source:  qs.get('source'), batch: qs.get('batch'),
        plot:    qs.get('plot'),   nursery: qs.get('nursery'),
        title:   qs.get('title')
      });
    }
  } catch (e) {
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>
