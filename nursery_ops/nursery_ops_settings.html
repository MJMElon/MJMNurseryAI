<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Work Types — Nursery Operation Manage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d9488%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ENO%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#f0fdfa; margin:0; }
  .card { background:white; border:1px solid #ccfbf1; border-radius:20px; box-shadow:0 4px 16px rgba(13,148,136,.08); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:12px; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; border:none; cursor:pointer; transition:all .15s; }
  .btn-teal  { background:linear-gradient(135deg,#14b8a6,#0d9488); color:white; box-shadow:0 6px 14px -4px rgba(13,148,136,.4); }
  .btn-teal:hover { transform:translateY(-1px); }
  .btn-ghost { background:white; color:#475569; border:1.5px solid #e2e8f0; }
  .btn-ghost:hover { background:#f8fafc; }
  .btn-danger { background:white; color:#be123c; border:1.5px solid #fecdd3; }
  .btn-danger:hover { background:#fff1f2; }
  .btn-mini { padding:6px 9px; border-radius:9px; font-size:12px; }
  .inp { width:100%; background:white; border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 12px; font-size:15px; font-weight:600; outline:none; }
  .inp:focus { border-color:#14b8a6; box-shadow:0 0 0 3px rgba(20,184,166,.15); }

  /* One-page table: # · Job · Motion Study · Unit · Remark · actions */
  .wt-grid { display:grid; grid-template-columns:32px 40px minmax(200px,1.1fr) 120px 160px minmax(180px,1fr) 176px; gap:12px; align-items:center; }
  .wt-head { padding:0 18px 8px; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:#94a3b8; }
  .wt-row { padding:14px 18px; border:1px solid #e2e8f0; border-radius:16px; background:white; }
  .wt-row.editing { border-color:#5eead4; box-shadow:0 0 0 3px rgba(20,184,166,.12); }
  .wt-row.dragging { opacity:.55; border-style:dashed; border-color:#14b8a6; background:#f0fdfa; }
  .wt-num { width:38px; height:38px; border-radius:10px; background:#f0fdfa; border:1.5px solid #99f6e4; color:#0f766e; font-weight:900; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .wt-handle { cursor:grab; touch-action:none; user-select:none; color:#cbd5e1; font-size:19px; line-height:1; padding:6px 4px; border-radius:8px; }
  .wt-handle:hover { color:#0d9488; background:#f0fdfa; }
  .wt-val { font-weight:900; color:#0f172a; font-size:18px; }
  .wt-unit { font-weight:700; color:#475569; font-size:15px; }
  .wt-remark { font-weight:600; color:#64748b; font-size:14px; }
</style>
</head>
<body>

<div id="mjm-ribbon" data-brand="MJM Nursery AI System" data-center="PALMS"
     data-sub="Plot Age Logging &amp; Manage System" data-logo="off"></div>
<script src="../shared/shared_ribbon.js"></script>

<div id="loading" class="max-w-[1000px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Loading…</div>

<div id="main" class="max-w-[1000px] mx-auto px-4 md:px-6 py-8 hidden">

  <!-- Not a PALMS page. These are the MAINTENANCE work types — P&D,
       Manuring, Weeding, Interrow — read by the monthly schedule and by
       Life of Plot's work rows. It briefly wore the PALMS tab strip, which
       put Maintenance's list behind a PALMS door and left PALMS's own
       setting (the stage list) with no door at all. PALMS Settings is
       nursery_ops_palms_stages.html. -->
  <div class="mb-5">
    <a class="btn btn-ghost" href="nursery_ops_dashboard.html">← Back to Module</a>
  </div>

  <div class="space-y-6">


  <div class="card p-5 md:p-7">
    <div class="flex items-center justify-between gap-3 mb-2">
      <h2 class="font-black text-slate-800 uppercase tracking-widest text-base">⏱️ Motion Study — Work Types</h2>
      <button id="add-wt-btn" class="btn btn-teal shrink-0">+ Add Work Type</button>
    </div>
    <div class="overflow-x-auto -mx-2 px-2">
      <div class="min-w-[880px]">
        <div class="wt-grid wt-head mt-4">
          <div></div><div>#</div><div>Job</div><div>Motion Study</div><div>Unit</div><div>Remark</div><div class="text-right pr-1">&nbsp;</div>
        </div>
        <div id="wt-list" class="space-y-3"></div>
      </div>
    </div>
    <p class="text-[11px] text-slate-400 mt-4">
      Removing a work type does <strong>not</strong> delete history — past schedule and plot records keep the work's name.
    </p>
  </div>

</div>
</div>

<div id="toast" class="fixed bottom-6 right-6 hidden z-[80] px-5 py-3 rounded-xl font-bold text-sm shadow-lg"></div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
let workTypes = [];
let isAdmin = false;
let editingId = null;          // id being edited, 'new' for the add row, or null

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showToast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'fixed bottom-6 right-6 z-[80] px-5 py-3 rounded-xl font-bold text-sm shadow-lg ' +
    (kind === 'err' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200');
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2600);
}

// ── Rendering ────────────────────────────────────────────────
function displayRow(t, i) {
  return `
    <div class="wt-row wt-grid" data-id="${t.id}">
      <div class="wt-handle" data-drag title="Drag to reorder">⠿</div>
      <div class="wt-num">${i + 1}</div>
      <div class="font-black text-slate-800 text-[16px] truncate">${esc(t.name)}</div>
      <div class="wt-val">${t.std_days != null ? t.std_days : '—'}</div>
      <div class="wt-unit">${esc(t.unit || (t.std_days != null ? 'days / plot' : '—'))}</div>
      <div class="wt-remark truncate" title="${esc(t.remark || '')}">${t.remark ? esc(t.remark) : '—'}</div>
      <div class="flex gap-1.5 justify-end">
        <button class="btn btn-ghost btn-mini" data-edit="${t.id}">Edit</button>
        <button class="btn btn-danger btn-mini" data-del="${t.id}" title="Remove work type">✕</button>
      </div>
    </div>`;
}

function editRow(t, i) {
  const isNew = t == null;
  return `
    <div class="wt-row wt-grid editing" data-id="${isNew ? 'new' : t.id}">
      <div class="wt-handle" style="opacity:.25; cursor:default">⠿</div>
      <div class="wt-num">${i + 1}</div>
      <div><input id="e-name" class="inp" placeholder="e.g. Polybag Filling" value="${isNew ? '' : esc(t.name)}"></div>
      <div><input id="e-days" type="number" min="0" step="0.5" class="inp" placeholder="e.g. 3" value="${!isNew && t.std_days != null ? t.std_days : ''}"></div>
      <div><input id="e-unit" class="inp" placeholder="days / plot" value="${isNew ? '' : esc(t.unit || '')}"></div>
      <div><input id="e-remark" class="inp" placeholder="Optional note" value="${isNew ? '' : esc(t.remark || '')}"></div>
      <div class="flex gap-1.5 justify-end">
        <button class="btn btn-teal btn-mini" data-save>Save</button>
        <button class="btn btn-ghost btn-mini" data-cancel>Cancel</button>
      </div>
    </div>`;
}

function render() {
  const rows = workTypes.map((t, i) => editingId != null && String(editingId) === String(t.id) ? editRow(t, i) : displayRow(t, i));
  if (editingId === 'new') rows.push(editRow(null, workTypes.length));
  $('wt-list').innerHTML = rows.length ? rows.join('')
    : '<div class="text-center text-slate-400 text-sm py-10">No work types yet — add the first one.</div>';
  const name = document.getElementById('e-name');
  if (name && editingId === 'new') name.focus();
}

async function loadData() {
  const { data, error } = await _supabase
    .from('nops_work_types').select('*')
    .order('sort_order').order('name');
  if (error) { showToast('Load failed: ' + error.message, 'err'); return; }
  workTypes = data || [];
  render();
}

// ── Inline save / delete ─────────────────────────────────────
async function saveEditing() {
  const name = $('e-name').value.trim();
  if (!name) { showToast('Job name is required.', 'err'); return; }
  const payload = {
    name,
    std_days: $('e-days').value === '' ? null : Number($('e-days').value),
    unit: $('e-unit').value.trim() || null,
    remark: $('e-remark').value.trim() || null
  };
  let error;
  if (editingId === 'new') {
    payload.sort_order = workTypes.length ? Math.max(...workTypes.map(t => t.sort_order || 0)) + 1 : 1;
    ({ error } = await _supabase.from('nops_work_types').insert([payload]));
  } else {
    ({ error } = await _supabase.from('nops_work_types').update(payload).eq('id', editingId));
  }
  if (error) {
    showToast(error.code === '23505' ? 'A work type with this name already exists.' : 'Save failed: ' + error.message, 'err');
    return;
  }
  showToast('Work type saved.');
  editingId = null;
  loadData();
}

async function deleteWorkType(id) {
  const t = workTypes.find(x => String(x.id) === String(id));
  if (!t) return;
  if (!confirm(`Remove work type "${t.name}"?\n\nPast schedule and plot history keep the name — only the reusable work type (and its motion-study standard) is removed.`)) return;
  const { error } = await _supabase.from('nops_work_types').delete().eq('id', id);
  if (error) { showToast('Remove failed: ' + error.message, 'err'); return; }
  showToast('Work type removed.');
  if (String(editingId) === String(id)) editingId = null;
  loadData();
}

// ── Drag to reorder ──────────────────────────────────────────
let drag = null;

function rowAfterPointer(y) {
  const rows = [...$('wt-list').querySelectorAll('.wt-row:not(.dragging)')];
  return rows.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; }) || null;
}

document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h || editingId != null) return;
  const row = h.closest('.wt-row');
  if (!row) return;
  drag = { row };
  row.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});

document.addEventListener('pointermove', e => {
  if (!drag) return;
  const after = rowAfterPointer(e.clientY);
  const list = $('wt-list');
  if (after) { if (after !== drag.row) list.insertBefore(drag.row, after); }
  else list.appendChild(drag.row);
});

async function endDrag() {
  if (!drag) return;
  drag.row.classList.remove('dragging');
  drag = null;
  const ids = [...$('wt-list').querySelectorAll('.wt-row')].map(r => r.dataset.id);
  workTypes.sort((a, b) => ids.indexOf(String(a.id)) - ids.indexOf(String(b.id)));
  render(); // renumber immediately
  const updates = workTypes
    .map((t, idx) => t.sort_order === idx + 1 ? null
      : _supabase.from('nops_work_types').update({ sort_order: idx + 1 }).eq('id', t.id))
    .filter(Boolean);
  if (!updates.length) return;
  const results = await Promise.all(updates);
  if (results.some(r => r && r.error)) { showToast('Reorder failed — reloading.', 'err'); loadData(); return; }
  workTypes.forEach((t, idx) => { t.sort_order = idx + 1; });
  showToast('Order saved.');
}

document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// ── Events ───────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.closest('[data-save]')) { saveEditing(); return; }
  if (e.target.closest('[data-cancel]')) { editingId = null; render(); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { editingId = ed.dataset.edit; render(); return; }
  const dl = e.target.closest('[data-del]');
  if (dl) { deleteWorkType(dl.dataset.del); return; }
});
$('add-wt-btn').addEventListener('click', () => {
  editingId = 'new';
  render();
  const row = $('wt-list').querySelector('.wt-row.editing');
  if (row) row.scrollIntoView({ block: 'nearest' });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editingId != null) { editingId = null; render(); }
  if (e.key === 'Enter' && editingId != null && e.target.closest('.wt-row.editing')) saveEditing();
});

// ── Bootstrap ────────────────────────────────────────────────
(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('nursery_ops')) {
      alert('You do not have access to Nursery Operation Manage.');
      window.location.href = '../index.html';
      return;
    }
    isAdmin = MJMAccess.isAdminOf('nursery_ops');
    await loadData();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  } catch (e) {
    if (e && e.message === 'NO_OPS_ACCESS') return;
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
