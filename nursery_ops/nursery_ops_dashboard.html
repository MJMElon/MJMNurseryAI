<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursery Operation Manage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d9488%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ENO%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_nelos.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#f0fdfa; margin:0; }

  /* Square tiles, laid out on a grid that fits as many as the width allows
     and never fewer than two, so the set still reads as a set on a phone. */
  .tool-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); }
  .tool-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
              aspect-ratio:1/1; padding:12px; border-radius:18px; text-align:center;
              background:white; border:1.5px solid #99f6e4; color:#0f766e; font-weight:900; font-size:11px;
              letter-spacing:.08em; text-transform:uppercase; text-decoration:none;
              transition:transform .12s, background .15s, box-shadow .15s;
              box-shadow:0 3px 10px rgba(13,148,136,.10); touch-action:none; user-select:none; }
  .tool-btn .tl { line-height:1.25; }
  .tool-btn:hover { background:#ccfbf1; transform:translateY(-2px); }
  /* The one being carried follows the pointer and is lifted off the grid;
     the gap it left stays open so the drop target is obvious. */
  .tool-btn.dragging { opacity:.9; box-shadow:0 18px 40px -10px rgba(13,148,136,.45);
                       transform:scale(1.04); z-index:30; position:relative; }
  .tool-btn.ghost { opacity:.25; }
  .tool-btn-access { background:#fff1f2; color:#9f1239; border-color:#fecdd3; }
  .tool-btn-access:hover { background:#ffe4e6; }
  .hidden { display:none !important; }

  /* ── Chalkboard ─────────────────────────────────────────── */
  .board-frame { background:linear-gradient(135deg,#a9743f,#8b5e34 40%,#75491f); border-radius:22px; padding:12px;
                 box-shadow:0 18px 44px -12px rgba(60,40,10,.45); }
  .board { position:relative; background:
             radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.045), transparent 55%),
             radial-gradient(ellipse at 75% 80%, rgba(255,255,255,.035), transparent 50%),
             linear-gradient(160deg,#2e4b3f,#243d33 55%,#1f352c);
           border-radius:14px; padding:22px 20px 26px; min-height:420px;
           box-shadow:inset 0 0 46px rgba(0,0,0,.45); color:#f2ead8; }
  .chalk { font-family:'Caveat', cursive; }
  .board-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .board-title { font-family:'Caveat', cursive; font-size:clamp(28px,4.5vw,40px); font-weight:700; color:#fdfaf2;
                 text-align:center; letter-spacing:1px; text-shadow:0 0 6px rgba(255,255,255,.18); }
  .board-sub { text-align:center; font-family:'Caveat', cursive; font-size:18px; color:rgba(242,234,216,.55); margin-top:-6px; }
  .nav-btn { width:44px; height:44px; border-radius:50%; border:2px dashed rgba(255,255,255,.35); background:transparent;
             color:#fdfaf2; font-size:22px; font-weight:900; cursor:pointer; flex-shrink:0; transition:all .15s;
             font-family:'Caveat', cursive; line-height:1; }
  .nav-btn:hover { background:rgba(255,255,255,.10); border-style:solid; }

  .chalk-line { display:flex; align-items:baseline; gap:12px; padding:9px 4px; border-bottom:1px dashed rgba(255,255,255,.14); }
  .chalk-line:last-child { border-bottom:none; }
  .chalk-date { font-family:'Caveat', cursive; font-size:21px; font-weight:700; color:#ffd97a; min-width:64px; text-align:right; flex-shrink:0; }
  .chalk-work { font-family:'Caveat', cursive; font-size:23px; font-weight:600; color:#fdfaf2; }
  .chalk-meta { font-family:'Caveat', cursive; font-size:19px; color:rgba(242,234,216,.75); }
  .chalk-status { font-family:'Caveat', cursive; font-size:18px; margin-left:auto; flex-shrink:0; white-space:nowrap; }
  .st-planned     { color:rgba(242,234,216,.65); }
  .st-in_progress { color:#ffd97a; }
  .st-done        { color:#8ff0b4; }
  .st-cancelled   { color:rgba(242,234,216,.4); }
  .line-done .chalk-work { color:#bfe9cd; }
  .line-cancelled .chalk-work, .line-cancelled .chalk-meta { text-decoration:line-through; opacity:.55; }

  .board-empty { text-align:center; font-family:'Caveat', cursive; font-size:26px; color:rgba(242,234,216,.55); padding:70px 10px; }

  .chalk-tray { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px;
                border-top:2px solid rgba(255,255,255,.12); }
  .edit-chalk { display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:12px;
                background:#fdfaf2; color:#243d33; font-weight:900; font-size:11px; letter-spacing:.08em;
                text-transform:uppercase; text-decoration:none; border:none; cursor:pointer;
                box-shadow:0 5px 14px rgba(0,0,0,.3); transition:all .15s; }
  .edit-chalk:hover { transform:translateY(-1px); background:white; }
  .last-update { font-family:'Caveat', cursive; font-size:18px; color:rgba(242,234,216,.7); }
</style>
</head>
<body>

<!-- Standardised MJM Nursery AI ribbon — see shared/shared_ribbon.js -->
<div id="mjm-ribbon" data-brand="MJM Nursery AI System" data-center="Nursery Operation Manage"
     data-center-scale="0.7" data-logo="off"></div>
<script src="../shared/shared_ribbon.js"></script>

<!-- The module names itself in the ribbon now, the way the Nelos pages do,
     so the strip that used to repeat it under the bar has gone. -->

<div id="loading" class="max-w-[980px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[980px] mx-auto px-4 md:px-6 py-8 hidden">

  <!-- Nelos To-Do: cases raised against nursery operations that are still
       open. shared_nelos.js removes the strip if Nelos is unreachable or
       nothing is pending, so the chalkboard below is never pushed down for
       an empty widget. -->
  <div id="nelos-todo" class="mb-6"></div>

  <!-- Live chalkboard: the month's work schedule -->
  <div class="board-frame">
    <div class="board">
      <div class="board-head">
        <button id="prev-month" class="nav-btn" title="Previous month's schedule">‹</button>
        <div class="flex-1">
          <div id="board-title" class="board-title">—</div>
          <div class="board-sub">Nursery Work Schedule</div>
        </div>
        <button id="next-month" class="nav-btn" title="Next month — set the following month's schedule">›</button>
      </div>

      <div id="board-lines" class="mt-4"></div>

      <div class="chalk-tray">
        <span id="last-update" class="last-update">&nbsp;</span>
        <a id="edit-btn" class="edit-chalk" href="nursery_ops_monthly.html">✏️ Edit Schedule</a>
      </div>
    </div>
  </div>


  <!-- The tools, under the board. Squares rather than pills: they are the
       ways out of this page and they are read as a set, so they want equal
       weight and a shape you can aim at on a laptop trackpad.

       Drag one to reorder them. Which tool matters most differs by who is
       looking — the seeds team and the maintenance team open different
       things first — and the order is kept per browser rather than per
       account, because it is a convenience, not a setting worth a column in
       the database. -->
  <div id="tools" class="tool-grid mt-7">
    <a draggable="false" class="tool-btn" data-page="seeds"       href="nursery_ops_seeds.html"><span class="tl">Seeds Management</span></a>
    <a draggable="false" class="tool-btn" data-page="maintenance" href="nursery_ops_maintenance.html"><span class="tl">Work Maintenance &amp; Schedule</span></a>
    <!-- One way into PALMS. Life of Plot, the motion study and its settings
         are all readings of the same plot log, so they live behind this tile
         rather than as four separate ones that gave no hint they belonged
         together. The PALMS pages carry their own tab strip. -->
    <a draggable="false" class="tool-btn" data-page="palms_board"  href="nursery_ops_palms_board.html"><span class="tl">PALMS</span></a>
    <!-- Shown only to users who may change other people's access. It carries
         a data-page like the rest so it drags and is remembered with them;
         being hidden is about the right to open it, not about where it sits. -->
    <a draggable="false" class="tool-btn tool-btn-access hidden" data-page="user_access" id="user-access-btn" href="nursery_ops_user_access.html"><span class="tl">User Access</span></a>
  </div>

  <p class="text-[11px] text-slate-400 text-center mt-8">
    Module access is granted per user on the main portal's <a href="../user_access.html" class="text-teal-700 font-bold underline underline-offset-2">User Access</a>.
  </p>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
let boardMonth = '';   // 'YYYY-MM' currently on the board

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthLabel(m) {
  const [y, mo] = m.split('-').map(Number);
  return `${MONTHS[mo - 1]} ${y}`;
}
function shiftMonth(m, delta) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
const fmtDay = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-MY', { day:'numeric', month:'short' }) : '';

function lineHtml(w) {
  const statusTxt = {
    planned:     '· planned',
    in_progress: '✎ in progress…',
    done:        `✓ done${w.done_by ? ' — ' + esc(w.done_by) : ''}`,
    cancelled:   '✗ cancelled'
  }[w.status] || w.status;
  return `
    <div class="chalk-line line-${w.status}">
      <span class="chalk-date">${fmtDay(w.planned_start) || '·'}</span>
      <span>
        <span class="chalk-work">${esc(w.work_type)}</span>
        <span class="chalk-meta"> — ${esc(w.plot_name)}${w.nursery_name ? ' (' + esc(w.nursery_name) + ')' : ''}${w.planned_days != null ? ' · ' + w.planned_days + 'd' : ''}</span>
      </span>
      <span class="chalk-status st-${w.status}">${statusTxt}</span>
    </div>`;
}

async function loadBoard() {
  $('board-title').textContent = monthLabel(boardMonth);
  $('edit-btn').href = 'nursery_ops_monthly.html?month=' + boardMonth;
  $('board-lines').innerHTML = '<div class="board-empty">loading…</div>';
  const { data, error } = await _supabase
    .from('nops_plot_works').select('*')
    .eq('month', boardMonth)
    .order('planned_start', { ascending: true, nullsFirst: false })
    .order('created_at', { ascending: true });
  if (error) {
    $('board-lines').innerHTML = `<div class="board-empty">could not load the board — ${esc(error.message)}</div>`;
    $('last-update').innerHTML = '&nbsp;';
    return;
  }
  const works = data || [];
  $('board-lines').innerHTML = works.length
    ? works.map(lineHtml).join('')
    : '<div class="board-empty">nothing on the board for this month yet —<br>press “Edit Schedule” to set it ✏️</div>';

  // "Last update by …" — latest touch across the month's rows.
  let latest = null;
  works.forEach(w => {
    const ts = w.updated_at || w.created_at;
    if (ts && (!latest || ts > latest.ts)) latest = { ts, by: w.updated_by || w.created_by || null };
  });
  $('last-update').innerHTML = latest
    ? `Last update by <strong>${esc(latest.by || 'unknown')}</strong> · ${new Date(latest.ts).toLocaleString('en-MY', { day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' })}`
    : '&nbsp;';
}

/* ── Reordering the tools ──────────────────────────────────────────
   Pointer events rather than HTML5 drag-and-drop: the native API does not
   fire on touch at all, and this page is opened on a tablet in the office as
   often as on a laptop.

   A drag only starts after the pointer has moved a few pixels, so a plain
   tap still follows the link. While dragging, the tile under the pointer
   swaps places with the one being carried, which is enough for a handful of
   tiles and avoids measuring the whole grid on every move.

   The order lives in this browser. Which tool matters most differs by who is
   looking, and a preference this small is not worth a column in the
   database — or the round trip to read it before the page can draw. */
const TOOL_ORDER_KEY = 'nops_tool_order';

function toolsEl() { return document.getElementById('tools'); }

function applySavedToolOrder() {
  const box = toolsEl();
  if (!box) return;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(TOOL_ORDER_KEY) || 'null'); } catch (_) { saved = null; }
  if (!Array.isArray(saved)) return;
  // Anything saved but no longer on the page is skipped. Anything on the
  // page but NOT in the saved list — a tool added since the order was
  // stored — goes to the end: appending the saved ones moves each past it,
  // so left alone it would drift to the FRONT, which is the opposite of
  // "new things go last" and put User Access first for everybody holding an
  // order from before it could be dragged. Collected before the reordering,
  // while the markup order is still intact.
  const inSaved = {};
  saved.forEach((page) => { inSaved[page] = true; });
  const extras = [...box.querySelectorAll('.tool-btn[data-page]')]
    .filter((el) => !inSaved[el.dataset.page]);

  saved.forEach((page) => {
    const el = box.querySelector(`.tool-btn[data-page="${CSS.escape(page)}"]`);
    if (el) box.appendChild(el);
  });
  extras.forEach((el) => box.appendChild(el));
}

function saveToolOrder() {
  const box = toolsEl();
  if (!box) return;
  const order = [...box.querySelectorAll('.tool-btn[data-page]')].map((el) => el.dataset.page);
  try { localStorage.setItem(TOOL_ORDER_KEY, JSON.stringify(order)); } catch (_) { /* private mode */ }
}

function initToolDrag() {
  const box = toolsEl();
  if (!box) return;
  let held = null, startX = 0, startY = 0, moved = false;

  /* A tile is a link, and a link is draggable by default: the browser starts
     its own link-drag on pointerdown and the pointermove stream never
     arrives, so the tiles simply would not reorder. draggable="false" on the
     markup and this belt-and-braces both say no. */
  box.addEventListener('dragstart', (e) => e.preventDefault());

  box.addEventListener('pointerdown', (e) => {
    const tile = e.target.closest('.tool-btn');
    if (!tile || e.button > 0) return;
    held = tile; startX = e.clientX; startY = e.clientY; moved = false;
    tile.setPointerCapture(e.pointerId);
  });

  box.addEventListener('pointermove', (e) => {
    if (!held) return;
    if (!moved) {
      // 6px of slop: below it this is a tap on a link, not a drag.
      if (Math.hypot(e.clientX - startX, e.clientY - startY) < 6) return;
      moved = true;
      held.classList.add('dragging');
    }
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const target = over && over.closest('.tool-btn');
    if (target && target !== held && target.parentElement === box) {
      // Insert before or after depending on which way we came at it, so a
      // tile dragged rightwards does not jump back past its neighbour.
      const rect = target.getBoundingClientRect();
      const after = e.clientX > rect.left + rect.width / 2;
      box.insertBefore(held, after ? target.nextSibling : target);
    }
  });

  const drop = () => {
    if (!held) return;
    const wasDrag = moved;
    held.classList.remove('dragging');
    held = null; moved = false;
    if (wasDrag) { saveToolOrder(); box.dataset.justDragged = '1'; }
  };
  box.addEventListener('pointerup', drop);
  box.addEventListener('pointercancel', drop);
  /* A drag that ends on a tile must not also open it. Capture, so this runs
     before the anchor's own default, and the flag is cleared as it is read —
     it is only ever true for the one click that follows a drag. */
  box.addEventListener('click', (e) => {
    if (box.dataset.justDragged === '1') {
      box.dataset.justDragged = '0';
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
}

$('prev-month').addEventListener('click', () => { boardMonth = shiftMonth(boardMonth, -1); loadBoard(); });
$('next-month').addEventListener('click', () => { boardMonth = shiftMonth(boardMonth,  1); loadBoard(); });

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('nursery_ops')) {
      alert('You do not have access to Nursery Operation Manage.');
      window.location.href = '../index.html';
      return;
    }
    const u = MJMAccess.user();
    // The ribbon greets the user by name, so nothing to fill here now.
    // Per-page access, set on this module's own User Access. A page the user
    // may not open should not be offered to them.
    // Fails OPEN if shared_access.js is an older cached copy without these
    // helpers: a stale script must not hide the module from people entitled
    // to it. Wrapped so one missing helper cannot bounce the whole page.
    try {
      const may = (page, act) => typeof MJMAccess.canDo !== 'function' ||
                                 MJMAccess.canDo('nursery_ops', page, act || 'view');
      document.querySelectorAll('.tool-btn[data-page]').forEach(a => {
        if (!may(a.dataset.page)) a.style.display = 'none';
      });
      if (!may('schedule', 'edit_schedule')) {
        const eb = document.getElementById('edit-btn');
        if (eb) eb.style.display = 'none';
      }
      if (MJMAccess.canManageUsers()) document.getElementById('user-access-btn').classList.remove('hidden');
    } catch (_) { /* keep the dashboard usable */ }

    // Pending Nelos cases for this module. Only for people who hold Nelos;
    // hideIfEmpty so a clear board shows nothing at all rather than an
    // "all clear" strip above the chalkboard.
    if (MJMAccess.canAccess('nelos')) {
      MJMNelos.init(_supabase, { root: '../' });
      MJMNelos.mountTodo('#nelos-todo', {
        module: 'nursery_ops',
        title:  'Nelos — Cases For This Module',
        hideIfEmpty: true
      });
    }
    const now = new Date();
    boardMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    await loadBoard();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    applySavedToolOrder();
    initToolDrag();
  } catch (e) {
    if (e && e.message === 'NO_OPS_ACCESS') return;
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
