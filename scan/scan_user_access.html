<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting — 555 FC Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%238b5cf6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2713%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EFC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#faf5ff; margin:0; }
  .card { background:white; border:1px solid #ede9fe; border-radius:20px; box-shadow:0 4px 16px rgba(139,92,246,.08); }

  /* 1fr auto 1fr, so the title is centred on the PAGE rather than in
     whatever space the back button leaves — the button can be any width and
     the title does not move. Laid out here and not only by Tailwind classes:
     the CDN is a third-party script, and until it lands these stack instead
     of sitting side by side. */
  .title-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
               gap:12px; margin-bottom:22px; }
  .page-title { justify-self:center; margin:0; font-size:19px; font-weight:900; color:#1e293b;
                letter-spacing:.08em; text-transform:uppercase; text-align:center; }
  .back-btn { justify-self:start; display:inline-flex; align-items:center; gap:8px;
              padding:9px 16px; border-radius:999px;
              background:white; border:1.5px solid #ede9fe; color:#6d28d9; text-decoration:none;
              font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
              line-height:1; transition:all .15s; }
  .back-btn:hover { background:#f5f3ff; border-color:#ddd6fe; }
  /* Narrow: stack rather than squeeze a long label and a title into one row. */
  @media (max-width:700px) {
    .title-row { grid-template-columns:1fr; justify-items:center; gap:10px; }
    .back-btn { justify-self:center; }
  }

  .u-row { padding:16px 20px; border-bottom:1px solid #f5f3ff; }
  .u-row:last-child { border-bottom:none; }
  .avatar { width:40px; height:40px; border-radius:12px; background:#ede9fe; color:#6d28d9;
            display:grid; place-items:center; font-weight:900; font-size:13px; flex-shrink:0; }
  .btn { padding:9px 16px; border-radius:12px; font-size:11px; font-weight:900; letter-spacing:.08em;
         text-transform:uppercase; cursor:pointer; border:1.5px solid transparent; }
  .btn-edit { background:#f5f3ff; color:#6d28d9; border-color:#ddd6fe; }
  .btn-edit:hover { background:#ede9fe; }
  /* Open rows close with an ✕ rather than the word: the panel below is the
     thing being read, and a labelled button there competes with it. */
  .btn-x { width:38px; height:38px; padding:0; display:grid; place-items:center;
           border-radius:999px; font-size:15px; letter-spacing:0; }
  .btn-save { background:#7c3aed; color:white; }
  .btn-save:hover { background:#6d28d9; }
  .btn-save:disabled { opacity:.55; cursor:default; }
  .btn-ghost { background:white; color:#64748b; border-color:#e2e8f0; }

  /* The expanded panel. Inline under the name, not a drawer over the page —
     you are setting up one person while looking at the list of people. */
  .panel { border-top:1px dashed #ddd6fe; margin-top:14px; padding-top:14px; }
  .page-block { border:1.5px solid #f1f5f9; border-radius:16px; padding:13px 15px; }
  .page-block.on { border-color:#ddd6fe; background:#faf5ff; }
  .chk { width:18px; height:18px; accent-color:#7c3aed; cursor:pointer; flex-shrink:0; }
  .nur { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
         border:1.5px solid #e2e8f0; background:white; font-size:12px; font-weight:700; color:#334155;
         cursor:pointer; }
  .nur.sel { border-color:#a78bfa; background:#f5f3ff; color:#5b21b6; }
  /* The parts of the record form, nested under Record work. Indented to line
     up under its label rather than under its box, with a rule down the side:
     six ticks in one flat column read as six unrelated things, and the five
     under Record work are not — switching Record work off takes all five with
     it. */
  .act-kids { margin:8px 0 2px 28px; padding-left:12px; border-left:2px solid #ede9fe;
              display:flex; flex-direction:column; gap:8px; }

  /* One of the five doors. A heavier box than the pages inside it, so the
     hierarchy is visible at a glance rather than being a matter of reading
     every label: five doors, and the FC Portal has rooms. */
  .area-block { border:1.5px solid #e2e8f0; border-radius:18px; padding:15px 17px; }
  .area-block.on { border-color:#c4b5fd; background:#faf5ff; }
  .area-pages { margin-top:14px; padding-top:13px; border-top:1px dashed #ddd6fe; }
  /* The pages sit on white inside a tinted door, or two shades of the same
     violet have to be told apart. */
  .area-block.on .page-block { background:white; }
  .nur input { accent-color:#7c3aed; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="mjm-ribbon" data-logo="off" data-brand="" data-center=" "></div>
<script src="../shared/shared_ribbon.js"></script>
<!-- Manage, not Setting: the bar names the portal you are in, and it does
     not change as you move around inside it. The page names itself below. -->
<script src="../shared/shared_fc_brand.js" data-portal="Worker Portal" data-sub="Manage"></script>

<div id="loading" class="max-w-[940px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="forbidden" class="max-w-[940px] mx-auto px-6 py-16 hidden">
  <div class="card p-10 text-center">
    <div class="text-4xl mb-3">🔒</div>
    <h2 class="text-lg font-black text-slate-800 uppercase tracking-widest">Access Denied</h2>
    <p class="text-xs text-slate-500 mt-2">Only users with <strong>Manage Users</strong> permission can open this page.</p>
    <a href="scan_setting.html" class="inline-block mt-6 text-[10px] font-bold text-violet-700 uppercase tracking-widest bg-violet-50 border border-violet-200 rounded-full px-4 py-2 no-underline">Back</a>
  </div>
</div>

<div id="main" class="max-w-[940px] mx-auto px-4 md:px-6 py-7 hidden">

  <div class="title-row">
    <!-- Says where it goes, because the ribbon's own [← Portal] goes somewhere
         else entirely — out of the FC Portal to the module selection. Two bare
         arrows would have been a coin toss. -->
    <a class="back-btn" href="scan_setting.html">&#8592; Back to Setting</a>
    <h1 class="page-title">User Setting</h1>
    <span aria-hidden="true"></span>
  </div>


  <div class="card overflow-hidden">
    <div class="px-5 py-3.5 border-b border-violet-50 flex items-center justify-between gap-3">
      <span class="text-[11px] font-black text-slate-500 uppercase tracking-widest">Users</span>
      <input id="q" placeholder="Search name or email…"
             class="text-[13px] font-semibold px-3.5 py-2 rounded-xl border border-slate-200 outline-none focus:border-violet-400 w-[240px] max-w-[55%]">
    </div>
    <div id="list"></div>
    <div id="empty" class="hidden px-6 py-12 text-center text-[12px] font-bold text-slate-400">
      Nobody has the 555 FC Portal yet — open it for somebody on the main User Access first.
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-bold px-5 py-3 rounded-xl shadow-xl hidden"></div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                             .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* The five things a person opens in the portal. `key` is what canScan() reads
   on the phone (permissions.scan_actions.<key>.view) and what the nursery list
   is filed under (permissions.scan_nurseries.<key>).

   Labels are Title Case throughout — every word capitalised bar the ones
   inside brackets that are not, and DO stays an abbreviation. Five settings
   in a column read as a set or as five unrelated things, and the difference
   is entirely whether they are written the same way. */
const PAGES = [
  { key:'barcode',     label:'Scan Barcode Counter' },
  { key:'do',          label:'Issue Collection DO' },
  { key:'maintenance', label:'Maintenance',
    /* What the page is actually made of, one switch at a time.

       Maintenance is two jobs with a form between them — reading the office's
       plan for the month, and recording a morning's work against it — and the
       record form is five separate things, not all of which every nursery
       wants keyed. So each is its own tick, and Record work carries its five
       nested under it.

       THE SAME LIST, WITH THE SAME KEYS AND THE SAME DEFAULTS, is offered in
       the 555 Worker Portal's own Settings screen — see
       src/modules/maintenance/functions.js in the Barcode_Counter repository.
       Change one, change the other, or the two portals stop agreeing about
       what a tick means.

       `dflt` is what an ABSENT answer means, and it matters. Everything is on
       by default so this screen takes nothing away from anybody: a Field
       Conductor saved before these switches existed has no `batches` entry at
       all, and reading that as off would empty his record form on the morning
       of the deploy. GPS is the exception — it asks the phone for a location
       and stores it against a person's name, which is not a thing to switch
       on for the whole estate because a new version shipped.

       Left without a `dflt`: record, verify and export, the three that were
       here first. They keep the older rule — an absent answer on a page that
       HAS been configured is a no — because changing what they mean would
       change access already saved. */
    actions:[
      { key:'schedule', label:'Schedule maintenance work', dflt:true,
        desc:'This week’s outstanding plots and the month’s plan. Switched off, work can still be recorded — the plan simply is not on the phone' },
      { key:'record', label:'Record work',
        desc:'Key in a job from the work sheet — what a Field Conductor does himself',
        children:[
          { key:'batches', label:'Batch selection', dflt:true,
            desc:'Tick which batches standing in the plot were worked on; the quantity is their sum' },
          { key:'workers', label:'Worker selection', dflt:true,
            desc:'Credit the job to the workers who did it — a broken phone, a PIN that will not take' },
          { key:'gps', label:'GPS track record', dflt:false,
            desc:'Walk the plot on a satellite map and keep the line walked. Will not start until the phone’s fix is better than 30 m, and the phone asks the person’s permission the first time' },
          { key:'photos', label:'Upload photo', dflt:true,
            desc:'Up to three pictures of the work done' },
          { key:'remark', label:'Remark', dflt:true,
            desc:'A line of free text on the record' }
        ] },
      { key:'verify', label:'Verify work done',
        desc:'Sign off a record a worker made, so the office can see it was checked' },
      { key:'export', label:'Download the month',
        desc:'Take the nursery\u2019s records away as a spreadsheet' }
    ] },
  { key:'palms',       label:'PALMS (Plot Status Update)' },
  { key:'culling',     label:'Culling Calculator' },
];

/* The five places a person can be sent, and the nursery each is confined to.
 *
 * The scan module used to be one thing you either had or did not, with the FC
 * Portal's five pages hanging directly off it. It is really five doors, and
 * they are not the same job — the back office, the two phone apps, the worker
 * register and this screen.
 *
 * Stored as permissions.scan_areas.<key>.view, with the nursery list under
 * scan_area_nurseries.<key>. Read by MJMAccess.canScanArea() in
 * shared/shared_access.js, which is also where the fallback lives: an absent
 * answer means nobody has been asked about this person yet, and the rule that
 * governed the door before this screen existed answers instead. Nobody loses
 * anything on the day this ships.
 *
 * The FC Portal carries its five pages inside it. Nothing else does — a
 * nursery and a tick is the whole of what the others need.
 */
const AREAS = [
  { key:'manage',  label:'Worker Portal Manage',
    desc:'The back office on this site — the two portal doors, Worker System and Setting. Without it, opening this site sends them straight to whichever portal they hold below' },
  { key:'fc',      label:'555 FC Portal',
    desc:'The Field Conductor’s phone app at scan.mjmnursery.com, signed in with this e-mail account',
    pages: PAGES },
  { key:'worker',  label:'555 Worker Portal',
    desc:'The worker’s phone app, entered with the PIN on their row of the payroll register' },
  { key:'workers', label:'Worker System',
    desc:'The register of workers — who is on the books, their section and their PIN' },
  { key:'setting', label:'Setting',
    desc:'This screen. Who may open what, for everybody' },
];

let profiles = [];        // everyone who holds the scan module
let nurseries = [];       // distinct nursery names from shared_plots
let openUid = null;       // the row expanded right now
let draft = null;         // that row's permissions, being edited

const initials = (p) => (String(p.full_name || p.email || '?').trim().split(/\s+/)
  .map((s) => s[0]).slice(0, 2).join('') || '?').toUpperCase();

function flash(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.classList.add('hidden'), 2600);
}

/* ---- reading a person's current state ----
   Both fall back the same way the phone does, so what is shown here is what
   the Field Conductor actually gets. */

// canScan fails OPEN on a page nobody has configured: somebody who has never
// been through this screen keeps the access they had, rather than losing it.
function pageOn(perms, key) {
  const acts = (perms.scan_actions || {})[key];
  return acts ? !!acts.view : true;
}

/* Exactly what canScan() on the phone concludes, and it has to be exactly
   that or this screen lies.
 
   A page nobody has configured fails OPEN there — somebody who has never been
   through this screen keeps the access they had. So the ticks must show ON
   for that person, because that is what they actually have. Showing them off
   and then saving would quietly take away the Record Work button from every
   Field Conductor whose access was opened only to grant them the new Verify
   tick, which is a trap laid for whoever opens this screen next.
 
   Once a page HAS been configured, an absent action is off.

   …unless the action names its own default. The switches added under
   Maintenance did not exist when most of these rows were saved, so an absent
   answer there is not a decision anybody made — it is a question nobody was
   asked. `dflt` is what to do about that, and it is the same answer the phone
   gives (Barcode_Counter src/modules/maintenance/functions.js). Actions
   without one are the three that were here first and keep the older rule
   exactly, because changing what they mean would change saved access. */
function actionOn(perms, page, action, dflt) {
  const acts = (perms.scan_actions || {})[page];
  if (!acts) return dflt === undefined ? true : !!dflt;
  const v = acts[action];
  if (v === undefined) return dflt === undefined ? false : !!dflt;
  return !!v;
}

/* Every tick on a page — the ones nested under Record work as well — as one
   flat list. Seeding and saving do not care about the nesting; only the
   drawing does. */
function flatActions(pg) {
  return (pg.actions || []).reduce(
    (all, ac) => all.concat([ac], ac.children || []), []);
}

/* Is this door open to them?
 *
 * Has to conclude exactly what MJMAccess.canScanArea() concludes, or this
 * screen lies about what it is showing. An absent answer is not "no" — it is
 * "nobody has been asked", and the rule that governed the door before this
 * screen existed answers instead. Kept as its own copy rather than calling
 * MJMAccess: that reads the SIGNED-IN user's permissions, and this screen is
 * looking at somebody else's. */
function areaOn(perms, key) {
  const entry = (perms.scan_areas || {})[key];
  if (entry && entry.view !== undefined) return !!entry.view;

  const mods = perms.modules || {};
  /* Only the three levels shared_access.js will accept. Anything else is
     dropped by its normalize() and reads as no module at all, so a row saying
     "Admin" with a capital A has no scan module as far as every office page
     is concerned — and this screen must say the same rather than showing a
     tick for access that is not really there. */
  const raw = String((mods.scan == null ? '' : mods.scan));
  const lvl = ['admin', 'normal', 'none'].indexOf(raw) === -1 ? 'none' : raw;
  switch (key) {
    case 'manage':  return lvl === 'admin' || !!perms.manage_users;
    case 'fc':      return !!lvl && lvl !== 'none';
    case 'worker':  return false;
    case 'workers': {
      if (perms.manage_users) return true;
      const np = String(mods.npayroll || '').toLowerCase();
      if (!np || np === 'none') return false;
      const acts = (perms.npayroll_actions || {}).workers;
      return acts ? !!acts.view : true;
    }
    case 'setting': return !!perms.manage_users;
    default:        return false;
  }
}

/** null means every nursery. */
function areaNurseries(perms, key) {
  const per = perms.scan_area_nurseries || {};
  return Array.isArray(per[key]) ? per[key] : null;
}

/* A page's nurseries, inside the FC Portal.
 *
 * ABSENT MEANS "the same as the portal", not "all". That is the hierarchy the
 * five sections are for: the FC Portal says which nurseries this person works
 * in, and a page may narrow it further but never widen it.
 *
 * Backwards compatible on purpose. Nobody has an area list yet, so an absent
 * page list falls through to an absent area list, which means every nursery —
 * exactly what it meant before this existed. The legacy single list still
 * answers ahead of that for anyone never re-saved.
 */
function pageNurseries(perms, key) {
  const per = perms.scan_nurseries || {};
  if (Array.isArray(per[key])) return per[key];
  const area = areaNurseries(perms, 'fc');
  if (area) return area;
  if (Array.isArray(perms.plot_status_nurseries)) return perms.plot_status_nurseries;
  return null;
}

/** True when the page has no list of its own and is simply following the portal. */
function pageFollowsPortal(perms, key) {
  return !Array.isArray((perms.scan_nurseries || {})[key]);
}

/* ---- the list ---- */
function rowHtml(p) {
  const open = openUid === p.id;
  return `
    <div class="u-row" data-uid="${esc(p.id)}">
      <div class="flex items-center gap-3.5">
        <div class="avatar">${esc(initials(p))}</div>
        <div class="flex-1 min-w-0">
          <div class="font-black text-slate-800 text-[14px] truncate">${esc(p.full_name || '(no name)')}</div>
          <div class="text-[11.5px] text-slate-400 truncate">${esc(p.email || '—')}</div>
        </div>
        <button class="btn btn-edit ${open ? 'btn-x' : ''}" data-edit="${esc(p.id)}"
                ${open ? 'title="Close" aria-label="Close"' : ''}>${open ? '&#10005;' : 'Edit Access'}</button>
      </div>
      ${open ? panelHtml() : ''}
    </div>`;
}

function panelHtml() {
  return '<div class="panel space-y-2.5">' +
    AREAS.map(areaBlockHtml).join('') +
    `<div class="flex items-center justify-end gap-2 pt-1">
       <button class="btn btn-ghost" data-cancel="1">Cancel</button>
       <button class="btn btn-save" id="save-btn">Save</button>
     </div>` +
    '</div>';
}

/* One of the five doors: a tick, the nurseries it is confined to, and — for
   the FC Portal alone — the pages inside it. */
function areaBlockHtml(area) {
  const on = areaOn(draft, area.key);
  const list = areaNurseries(draft, area.key);
  const all = list === null;
  const chosen = new Set(all ? [] : list);
  return `
    <div class="area-block ${on ? 'on' : ''}">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" class="chk mt-0.5" data-area="${area.key}" ${on ? 'checked' : ''}>
        <span class="min-w-0">
          <span class="block text-[14px] font-black text-slate-800">${esc(area.label)}</span>
          <span class="block text-[11px] text-slate-400 leading-snug">${esc(area.desc || '')}</span>
        </span>
      </label>

      <div class="mt-2.5 ${on ? '' : 'hidden'}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nurseries</div>
        <div class="flex flex-wrap gap-2">
          <label class="nur ${all ? 'sel' : ''}">
            <input type="checkbox" data-anall="${area.key}" ${all ? 'checked' : ''}> All
          </label>
          ${nurseries.map((n) => `
            <label class="nur ${!all && chosen.has(n) ? 'sel' : ''}">
              <input type="checkbox" data-narea="${area.key}" data-nname="${esc(n)}"
                     ${!all && chosen.has(n) ? 'checked' : ''}>
              ${esc(n)}
            </label>`).join('')}
        </div>
      </div>

      ${(area.pages && area.pages.length) ? `
        <div class="area-pages ${on ? '' : 'hidden'}">
          <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
            What they may open in it
          </div>
          <div class="space-y-2.5">${area.pages.map(pageBlockHtml).join('')}</div>
        </div>` : ''}
    </div>`;
}

/* One tick, and whatever is nested under it. Recursive so Record work's five
   are drawn by the same code as Record work itself — one row, one rule about
   what a row looks like. Children are drawn but hidden while the parent is
   off, rather than left out: switching Record work back on should put back
   the answers that were there, not an empty space. */
function actionRowHtml(pg, ac) {
  const on = actionOn(draft, pg.key, ac.key, ac.dflt);
  return `
    <label class="flex items-start gap-2.5 cursor-pointer">
      <input type="checkbox" class="chk mt-0.5" data-act="${pg.key}" data-actkey="${ac.key}"
             ${on ? 'checked' : ''}>
      <span class="min-w-0">
        <span class="block text-[12.5px] font-black text-slate-700">${esc(ac.label)}</span>
        <span class="block text-[11px] text-slate-400 leading-snug">${esc(ac.desc || '')}</span>
      </span>
    </label>
    ${(ac.children && ac.children.length) ? `
      <div class="act-kids ${on ? '' : 'hidden'}">
        ${ac.children.map((k) => actionRowHtml(pg, k)).join('')}
      </div>` : ''}`;
}

function pageBlockHtml(pg) {
  const on = pageOn(draft, pg.key);
  const follows = pageFollowsPortal(draft, pg.key);
  const chosen = new Set(follows ? [] : pageNurseries(draft, pg.key) || []);
  // Only what the portal itself holds — a page cannot reach past it.
  const offer = areaNurseries(draft, 'fc') || nurseries;
  return `
    <div class="page-block ${on ? 'on' : ''}">
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" class="chk" data-page="${pg.key}" ${on ? 'checked' : ''}>
        <span class="block text-[13px] font-black text-slate-800 min-w-0">${esc(pg.label)}</span>
      </label>

      ${(pg.actions && pg.actions.length) ? `
      <div class="mt-2.5 ${on ? '' : 'hidden'}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">What they may do</div>
        <div class="space-y-2">
          ${pg.actions.map((ac) => actionRowHtml(pg, ac)).join('')}
        </div>
      </div>` : ''}

      ${/* A page may narrow the portal's nurseries but never widen them, so
            only the portal's own are offered here. Following the portal is
            the normal state and the first chip; picking nurseries makes this
            page an exception to it. */''}
      <div class="mt-2.5 ${on ? '' : 'hidden'}" data-nur-for="${pg.key}">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nurseries</div>
        <div class="flex flex-wrap gap-2">
          <label class="nur ${follows ? 'sel' : ''}">
            <input type="checkbox" data-nsame="${pg.key}" ${follows ? 'checked' : ''}> Same as portal
          </label>
          ${offer.map((n) => `
            <label class="nur ${!follows && chosen.has(n) ? 'sel' : ''}">
              <input type="checkbox" data-npage="${pg.key}" data-nname="${esc(n)}"
                     ${!follows && chosen.has(n) ? 'checked' : ''}>
              ${esc(n)}
            </label>`).join('')}
        </div>
      </div>
    </div>`;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = profiles.filter((p) => !q
    || String(p.full_name || '').toLowerCase().includes(q)
    || String(p.email || '').toLowerCase().includes(q));
  $('empty').classList.toggle('hidden', shown.length > 0);
  $('list').innerHTML = shown.map(rowHtml).join('');
}

/* ---- editing ---- */
function openRow(uid) {
  const p = profiles.find((x) => x.id === uid);
  if (!p) return;
  // A copy: nothing reaches the person's row until Save.
  draft = JSON.parse(JSON.stringify(p.permissions || {}));
  draft.scan_actions = draft.scan_actions || {};
  draft.scan_nurseries = draft.scan_nurseries || {};
  draft.scan_areas = draft.scan_areas || {};
  draft.scan_area_nurseries = draft.scan_area_nurseries || {};

  /* The five doors, settled the same way and for the same reason as the pages
     below: areaOn() falls back to whatever governed each door before this
     screen existed, so what is drawn is what this person actually holds — and
     saving must record that rather than turning an unasked question into a no.
     Somebody who could open Worker System yesterday must still be able to
     after an admin opens their row and presses Save without touching it. */
  AREAS.forEach((a) => {
    const entry = draft.scan_areas[a.key];
    draft.scan_areas[a.key] = { ...(entry || {}), view: areaOn(draft, a.key) };
  });

  /* Settle what the panel SHOWS into the draft the moment the row is opened,
     so Save records what the admin was looking at.

     canScan fails open, so a page nobody has configured renders ticked. It
     used to be saved as false: opening somebody's row and pressing Save with
     no changes at all silently took away every page they had. Writing the
     displayed value in first is what makes the panel honest. */
  PAGES.forEach((pg) => {
    const acts = draft.scan_actions[pg.key];
    /* Seed from what this person effectively has, not from an empty object:
       actionOn() reads an unconfigured page as every action on, so the ticks
       start where their access already is and saving changes only what was
       actually touched. */
    const seeded = { ...(acts || {}), view: acts ? !!acts.view : true };
    /* Seed the OLD actions — record, verify, export — because canScan reads a
       page all-or-nothing: once an entry exists, anything not named in it is
       off, so leaving them out of a saved row takes them away.

       The newer switches, the ones carrying a `dflt`, are deliberately NOT
       seeded. They have their own per-key default in the app, so an absent one
       means "nobody has decided about this person" — and that is exactly what
       System Setting's company-wide switch acts on. Writing today's default in
       here would turn every person the admin merely LOOKED at into somebody
       with an explicit answer, and the company switch would then reach fewer
       people every time this screen was opened. An explicit value is written
       the moment somebody actually ticks one. */
    flatActions(pg).forEach((ac) => {
      if (ac.dflt !== undefined) return;
      if (seeded[ac.key] === undefined) seeded[ac.key] = actionOn(draft, pg.key, ac.key, ac.dflt);
    });
    draft.scan_actions[pg.key] = seeded;
  });

  /* Settle the pre-per-page list, and drop it.

     It used to be copied onto all five pages. Its home is the FC Portal now:
     that is what it always meant — the nurseries this person works in — and
     one list on the portal with the pages following it says so, where five
     identical copies said it five times and drifted apart the first time
     anybody edited one.

     It has to be settled somewhere, not merely read: "All" means removing the
     entry, and while the old list survived it would answer in its place and
     the tick would come straight back off. The panel has to be reading only
     what the panel writes. */
  if (Array.isArray(draft.plot_status_nurseries)) {
    if (!Array.isArray(draft.scan_area_nurseries.fc)) {
      draft.scan_area_nurseries.fc = draft.plot_status_nurseries.slice();
    }
    delete draft.plot_status_nurseries;
  }

  openUid = uid;
  render();
}
function closeRow() { openUid = null; draft = null; render(); }

document.addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]');
  if (edit) { const uid = edit.dataset.edit; return uid === openUid ? closeRow() : openRow(uid); }
  if (e.target.closest('[data-cancel]')) return closeRow();
  if (e.target.id === 'save-btn') return save();
});

document.addEventListener('change', (e) => {
  if (!draft) return;
  const t = e.target;

  if (t.dataset.area) {
    draft.scan_areas = draft.scan_areas || {};
    const entry = draft.scan_areas[t.dataset.area] || {};
    entry.view = t.checked;
    draft.scan_areas[t.dataset.area] = entry;
    return render();
  }
  if (t.dataset.anall) {
    // "All" is the ABSENCE of a list, so a nursery added next month is
    // included without anybody re-ticking every person.
    const key = t.dataset.anall;
    draft.scan_area_nurseries = draft.scan_area_nurseries || {};
    if (t.checked) delete draft.scan_area_nurseries[key];
    else draft.scan_area_nurseries[key] = nurseries.slice();
    return render();
  }
  if (t.dataset.narea) {
    const key = t.dataset.narea;
    draft.scan_area_nurseries = draft.scan_area_nurseries || {};
    /* Coming out of "All" by picking one: that nursery becomes the whole
       selection there and then, rather than making somebody untick All (which
       selects everything) and then untick the rest. */
    if (!Array.isArray(draft.scan_area_nurseries[key])) {
      draft.scan_area_nurseries[key] = [t.dataset.nname];
    } else {
      draft.scan_area_nurseries[key] = [...document.querySelectorAll('[data-narea="' + key + '"]')]
        .filter((cb) => cb.checked).map((cb) => cb.dataset.nname);
    }
    /* A page cannot reach past the portal it is in. Narrowing the portal
       therefore narrows every page inside it, here and now — leaving a page
       naming a nursery the portal no longer holds would be a setting that
       reads one way and behaves another. */
    if (key === 'fc') {
      const held = new Set(draft.scan_area_nurseries[key] || []);
      PAGES.forEach((pg) => {
        const list = draft.scan_nurseries[pg.key];
        if (!Array.isArray(list)) return;
        const kept = list.filter((n) => held.has(n));
        if (kept.length) draft.scan_nurseries[pg.key] = kept;
        else delete draft.scan_nurseries[pg.key];   // back to following the portal
      });
    }
    return render();
  }
  if (t.dataset.nsame) {
    // Following the portal IS the absence of a page list.
    delete draft.scan_nurseries[t.dataset.nsame];
    return render();
  }

  if (t.dataset.page) {
    const acts = draft.scan_actions[t.dataset.page] || {};
    acts.view = t.checked;
    draft.scan_actions[t.dataset.page] = acts;
    return render();
  }
  if (t.dataset.act) {
    const acts = draft.scan_actions[t.dataset.act] || {};
    acts[t.dataset.actkey] = t.checked;
    draft.scan_actions[t.dataset.act] = acts;
    return render();
  }
  if (t.dataset.npage) {
    const key = t.dataset.npage;

    /* Coming off "Same as portal" by picking a nursery: that nursery becomes
       the whole selection there and then, rather than making somebody first
       untick the follow and then untick the ones they do not want. Under the
       follow every box renders unticked, so that click is always a tick. */
    if (!Array.isArray(draft.scan_nurseries[key])) {
      draft.scan_nurseries[key] = [t.dataset.nname];
      return render();
    }

    const picked = [...document.querySelectorAll('[data-npage="' + key + '"]')]
      .filter((cb) => cb.checked).map((cb) => cb.dataset.nname);
    // Unticking the last one is not "no nurseries at all" — an empty list
    // would leave the page open and every plot hidden, which reads as broken.
    // It means they have stopped making this page an exception.
    if (picked.length) draft.scan_nurseries[key] = picked;
    else delete draft.scan_nurseries[key];
    return render();
  }
  if (t.id === 'q') render();
});
$('q').addEventListener('input', render);

async function save() {
  const p = profiles.find((x) => x.id === openUid);
  if (!p || !draft) return;

  /* Nobody may close their own Setting door. It is the only way back in, and
     an admin who unticks it on their own row has to be let back in by hand
     from the database. The worker portal refuses the same thing for the same
     reason — see worker_set_portal in shared/create_worker_portal.sql. */
  const me = MJMAccess.user();
  if (me && me.id === p.id && !((draft.scan_areas || {}).setting || {}).view) {
    flash('You cannot switch Setting off for yourself — it is the way back in.');
    return;
  }

  const btn = $('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  /* Every page is already explicitly recorded — openRow() writes the
     displayed value in, including the ones that were only ticked because
     canScan fails open. So the draft is the truth and nothing is re-derived
     here; deriving it again is exactly how the false-for-everything bug got
     in. */
  const next = { ...(p.permissions || {}), ...draft };
  /* The single pre-per-page list is dropped once this person has been saved
     here: it is only a fallback for anyone who has NOT been, and leaving it
     behind would keep answering for pages set to All. */
  delete next.plot_status_nurseries;

  const { error } = await _supabase.from('shared_profiles')
    .update({ permissions: next }).eq('id', p.id);

  btn.disabled = false; btn.textContent = 'Save';
  if (error) { flash('Could not save: ' + error.message); return; }
  p.permissions = next;
  closeRow();
  flash('Saved for ' + (p.full_name || p.email || 'user'));
}

/* ---- boot ---- */
(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    $('loading').classList.add('hidden');
    /* Setting is its own tick now, falling back to Manage Users for anybody
       nobody has set one for. Kept as canScanArea rather than canManageUsers
       so this screen answers to the same rule it writes — an admin who takes
       Setting away from themselves loses it, which is honest, and the row
       above refuses to be the one that does it. */
    if (!MJMAccess.canScanArea('setting')) { $('forbidden').classList.remove('hidden'); return; }

    const [plots, people] = await Promise.all([
      _supabase.from('shared_plots').select('nursery_name'),
      _supabase.from('shared_profiles').select('id, email, full_name, permissions')
        .order('full_name', { ascending: true }),
    ]);

    nurseries = [...new Set(((plots && plots.data) || []).map((r) => r.nursery_name).filter(Boolean))].sort();
    // Only people the main User Access has opened the module for. Setting up
    // pages for somebody who cannot open the portal is a setting with no
    // effect, and a list of every account to scroll past.
    profiles = (((people && people.data) || [])).filter((p) => {
      const lvl = ((p.permissions || {}).modules || {}).scan;
      return lvl && String(lvl).toLowerCase() !== 'none';
    });

    render();
    $('main').classList.remove('hidden');
  } catch (e) {
    console.warn(e);
    $('loading').classList.add('hidden');
    $('forbidden').classList.remove('hidden');
  }
})();
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     Nelos is a tool that follows the person, not a feature of one module:
     anyone who holds it gets the circle on every page they can reach, and
     the dock itself decides — no session or no Nelos and it never draws.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
