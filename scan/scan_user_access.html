<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Access — FC Scan Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
/* The FC Scan Portal is served from scan.mjmnursery.com, a separate site from
   this one, so its pages are listed here as they are told to us rather than
   read from the code. Send the rest and they drop into `pages` below. */
MJMModuleAccess.init({
  module: 'scan',
  title:  'FC Scan Portal',
  moduleLabel: 'Scan',
  icon:   '🔖',
  accent: 'violet',
  back:   { href: '../index.html', label: 'Module Selection' },
  // The portal itself opens in a new tab: it is a different site, so going
  // "back" to it would otherwise mean leaving this one behind.
  portal: { href: 'https://scan.mjmnursery.com', label: 'Back to Portal' },
  note:   `This page manages users who were <strong>opened for this module</strong> on the main portal's User Access.
           For each of them, tick which of the five modules they can open and exactly what they can do
           inside each — and whether they can <strong>change other users' roles</strong>.
           <br><br>
           <span class="inline-block bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-2 text-[12px]">
             <strong>Nurseries</strong> are set separately, below the modules. Switch <em>All nurseries</em>
             off for someone and tick only the ones they should see — that one setting governs
             <strong>Plot Status</strong>, <strong>Maintenance</strong> and <strong>PALMS</strong> together,
             so a BNN-only Field Conductor sees BNN on every screen.
             <br><br>
             A module with nothing ticked here stays open, so nobody loses access by never having been
             set up. To take the whole Scan Portal away from someone, set their <strong>Scan</strong>
             module to <em>None</em> on the main portal's User Access.
           </span>`,
  pages: [
    { key:'barcode', label:'Scan Barcode Counter', desc:'Counting seedlings by scanning barcodes' },
    { key:'do', label:'Issue Collection DO', desc:'Raising and managing collection delivery orders' },
    { key:'plot_status', label:'Plot Status', desc:'Daily plot stage reporting',
      actions:[
        { key:'report', label:'Report a plot stage', desc:'Submit today\u2019s stage for a plot' }
      ]},
    { key:'maintenance', label:'Maintenance', desc:'Maintenance work recorded through the Scan Portal',
      actions:[
        { key:'record', label:'Record maintenance work', desc:'Scan and submit a maintenance record' },
        { key:'edit',   label:'Edit & delete records',   desc:'Change or remove a maintenance record already submitted' },
        { key:'export', label:'Download records',        desc:'Export the maintenance records' }
      ]},
    { key:'palms', label:'PALMS', desc:'Plot Activity Log Monitoring System',
      actions:[
        { key:'settings', label:'Open Settings', desc:'The cog in the bar \u2014 sets up PALMS for everyone, not just this user' }
      ]}
  ],
  scopes: [
    {
      key:      'plot_status_nurseries',
      label:    'Nurseries',
      desc:     'Which nurseries this person sees in Plot Status, Maintenance and PALMS',
      allLabel: 'All nurseries',
      emptyText:'No nurseries found in shared_plots yet.',
      // Read from the plots themselves, so a nursery added later shows up here
      // without anyone editing this file.
      options: async (supa) => {
        const { data, error } = await supa
          .from('shared_plots')
          .select('nursery_name')
          .not('nursery_name', 'is', null);
        if (error) throw error;
        return [...new Set((data || []).map(r => r.nursery_name).filter(Boolean))].sort();
      }
    }
  ]
});
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
