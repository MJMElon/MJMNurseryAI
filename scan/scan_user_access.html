<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Access — FC Scan Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
/* The FC Scan Portal is served from scan.mjmnursery.com, a separate site
   from this one, so its page list could not be read from here. The single
   entry below is what is certain — the portal itself, open or closed. Send
   the portal's page names and the functions on each and they drop straight
   into `pages` below; everything else on this screen already works. */
MJMModuleAccess.init({
  module: 'scan',
  title:  'FC Scan Portal',
  moduleLabel: 'Scan',
  icon:   '🔖',
  accent: 'violet',
  back:   { href: '../index.html', label: 'Module Selection' },
  note:   `This page manages users who were <strong>opened for this module</strong> on the main portal's User Access.
           <br><br>
           <span class="inline-block bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-2 text-[12px]">
             ⚠️ The Scan Portal runs on <strong>scan.mjmnursery.com</strong>, a separate site, so only the portal itself is
             listed below so far. Tell us its pages and the functions on each and they will appear here like the other modules.
           </span>`,
  pages: [
    { key:'portal', label:'FC Scan Portal', desc:'Scanning and the records it produces',
      actions:[] }
  ]
});
</script>
</body>
</html>
