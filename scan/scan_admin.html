<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>555 FC Portal — Manage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%238b5cf6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2713%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EFC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#faf5ff; margin:0; }
  .card { background:white; border:1px solid #ede9fe; border-radius:20px; box-shadow:0 4px 16px rgba(139,92,246,.08); }

  /* The way through to the phone app. Deliberately the biggest thing on the
     page: for most people this page is a doorway, not a destination. */
  .portal-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
                padding:18px 22px; border-radius:18px; text-decoration:none;
                background:linear-gradient(135deg,#8b5cf6,#6d28d9); color:white;
                font-weight:900; font-size:14px; letter-spacing:.1em; text-transform:uppercase;
                box-shadow:0 10px 26px -6px rgba(109,40,217,.5); transition:all .15s; }
  .portal-btn:hover { transform:translateY(-1px); box-shadow:0 14px 30px -6px rgba(109,40,217,.55); }
  /* Sized here, not only by a Tailwind class: the CDN is a third-party
     script, and a page whose icons are 300px until it lands is a broken page.
     Same reason the auditor's portal button pins its own. */
  .portal-btn svg { fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .portal-btn .pb-phone { width:20px; height:20px; flex-shrink:0; }
  .portal-btn .pb-out   { width:15px; height:15px; opacity:.85; flex-shrink:0; }

  /* A square tile rather than a wide row: there is one of these, and a row
     stretched across the page reads as a list with an item missing. */
  .tool { width:132px; height:132px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:10px; border-radius:22px;
          background:white; border:1.5px solid #ede9fe; text-decoration:none; transition:all .15s; }
  .tool:hover { border-color:#c4b5fd; transform:translateY(-2px); box-shadow:0 10px 24px -6px rgba(139,92,246,.28); }
  .tool-ico { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:24px; }
  .tool-name { font-size:12px; font-weight:900; color:#1e293b; text-transform:uppercase; letter-spacing:.1em; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- Standardised MJM Nursery AI ribbon — see shared/shared_ribbon.js.
     data-logo="off" drops the [AI] square; the wordmark beside it is then
     replaced below with the portal's own three-line mark. Only this page does
     that: every other module keeps the standard ribbon. -->
<div id="mjm-ribbon" data-logo="off" data-brand="" data-center=" "></div>
<script src="../shared/shared_ribbon.js"></script>
<script src="../shared/shared_fc_brand.js" data-sub="Manage"></script>

<div id="loading" class="max-w-[860px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[860px] mx-auto px-4 md:px-6 py-7 hidden">

  <!-- The way in to the field app itself. -->
  <a class="portal-btn" id="portal-link" href="https://scan.mjmnursery.com" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" class="pb-phone"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 5.5h3"/><circle cx="12" cy="18" r="1"/></svg>
    <span>Visit 555 FC Portal</span>
    <svg viewBox="0 0 24 24" class="pb-out"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
  </a>

  <div class="mt-6">
    <a class="tool" id="tool-access" href="scan_user_access.html">
      <span class="tool-ico bg-violet-100">⚙️</span>
      <span class="tool-name">Setting</span>
    </a>
  </div>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = (id) => document.getElementById(id);

/* The phone app is a different site, so a fresh URL each time — the portal is
   a PWA and a cached shell that names chunks which no longer exist is how it
   comes up broken after a deploy. Same trick the module card uses. */
$('portal-link').addEventListener('click', (e) => {
  e.currentTarget.href = 'https://scan.mjmnursery.com/?cb=' + Date.now();
});

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('scan')) {
      alert('You do not have access to the 555 FC Portal.');
      window.location.href = '../index.html';
      return;
    }

    /* This is the back office, not the field. Anyone who is not an admin of
       the module is sent where they were going anyway — the phone app — rather
       than being shown a page of settings they cannot use. The module card on
       the hub already routes them past it; this is for a typed URL or an old
       bookmark. */
    if (!MJMAccess.isAdminOf('scan')) {
      window.location.replace('https://scan.mjmnursery.com/?cb=' + Date.now());
      return;
    }

    // The signed-in name is the ribbon's own #welcome-text; this page had a
    // second copy in the header bar that has gone with it.
    // User Access writes other people's permissions, which the database policy
    // only lets a user-manager do — so it is not offered to anyone else.
    if (!MJMAccess.canManageUsers()) $('tool-access').classList.add('hidden');

    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
  } catch (e) {
    if (e && e.message === 'NO_OPS_ACCESS') return;
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>
</body>
</html>
