<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#241f1c" />
  <title>555 Auditor Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2712%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3E555%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════════════════
       THE 555 EXERCISE BOOK — COVER

       The real thing: a soft coloured cover, the red 555 logotype printed
       across the top, a lot of empty cover, and "Name……………" ruled near the
       foot. Signing in is filling that line in.

       One design for both portals. Only the cover colour changes — pink
       for the Auditor Portal, blue for the FC Scan Portal — the way the
       books themselves come in a pile of colours.
       ══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* the only line that differs between the two portals */
      --cover:    #e8a9bd;
      --cover-2:  #dc97ad;
      --cover-3:  #cf8ba3;

      --ink:      #23303f;   /* what you write with */
      --quiet:    rgba(35,48,63,.62);  /* both lines on the cover */
      /* The logotype and every button on this page are MJM's dark green,
         not the printer's red the books themselves are stamped with. */
      --green:    #1f7a45;
      --green-2:  #155c33;
      --green-3:  #0f4a29;
      --green-4:  #0b3d21;
      --hand:     'Caveat', 'Bradley Hand', 'Segoe Script', 'Comic Sans MS', cursive;
    }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: #241f1c;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 34%, #3a322b 0%, #221d19 62%, #14100e 100%);
      z-index: 0;
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 26px 16px 20px;
    }

    /* ── the book, with the inside pages showing past the cover ── */
    .book {
      position: relative;
      width: 100%; max-width: 400px;
      animation: bookIn .5s ease both;
    }
    /* cream, yellow and green sheets stacked a little proud of the cover */
    .edges { position: absolute; inset: 0; }
    .edges i {
      position: absolute; top: 7px; bottom: 5px;
      border-radius: 0 3px 3px 0;
      box-shadow: 2px 2px 5px rgba(0,0,0,.35);
    }
    .edges i:nth-child(1) { right: -13px; width: 15px; background: #d7dfb8; }
    .edges i:nth-child(2) { right:  -9px; width: 13px; background: #f2ea9e; top: 12px; bottom: 10px; }
    .edges i:nth-child(3) { right:  -5px; width: 11px; background: #fdf9e6; top: 17px; bottom: 15px; }

    .cover {
      position: relative;
      background:
        /* the paper is never evenly printed */
        radial-gradient(ellipse at 32% 62%, rgba(255,255,255,.18), transparent 46%),
        radial-gradient(ellipse at 78% 18%, rgba(0,0,0,.05), transparent 52%),
        repeating-linear-gradient(101deg, rgba(255,255,255,.045) 0 2px, transparent 2px 6px),
        linear-gradient(160deg, var(--cover) 0%, var(--cover-2) 78%, var(--cover-3) 100%);
      border-radius: 3px 6px 6px 3px;
      padding: 30px 26px 26px;
      box-shadow:
        0 26px 60px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(255,255,255,.16),
        inset 3px 0 0 rgba(0,0,0,.10);
      transform: rotate(-.4deg);
    }
    /* the fold, and the staple that holds it */
    .cover::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 9px;
      background: linear-gradient(90deg, rgba(0,0,0,.16), transparent);
      border-radius: 3px 0 0 3px;
    }
    /* the thumbed-over smudge every one of these books picks up */
    .smudge {
      position: absolute; left: 26%; top: 56%;
      width: 46%; height: 15%;
      background: radial-gradient(ellipse, rgba(90,60,50,.13), transparent 68%);
      transform: rotate(-7deg);
      pointer-events: none;
    }

    /* ── the 555 logotype ── */
    .logo-wrap { text-align: center; margin-bottom: 4px; }
    .logo555 {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 900;
      font-size: 74px; line-height: .9;
      letter-spacing: -.02em;
      font-style: italic;
      color: var(--green);
      -webkit-text-stroke: 1.5px #f4fbf6;
      paint-order: stroke fill;
      text-shadow:
        1px 1px 0 var(--green-2), 2px 2px 0 var(--green-2),
        3px 3px 0 var(--green-2), 4px 4px 0 var(--green-2),
        5px 5px 0 var(--green-3), 6px 6px 0 var(--green-3),
        7px 7px 0 var(--green-4), 8px 8px 0 var(--green-4),
        10px 12px 16px rgba(6,42,22,.4);
      /* The glyph box is centred, but the shadow only falls down-RIGHT and
         shadows take up no layout, so the INK lands right of centre.
         Measured off a render: at 0 the centre of mass sits 8.4px right,
         and 1px of translate moves it 1px. -7px puts centre of mass and
         bounding box either side of zero. */
      transform: translateX(-7px) rotate(-1.2deg);
    }
    .portal-name {
      margin-top: 12px;
      text-align: center;
      font-size: 12px; font-weight: 900;
      letter-spacing: .34em; text-transform: uppercase;
      color: var(--quiet);
    }
    .portal-sub {
      margin-top: 5px;
      text-align: center;
      font-size: 9.5px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--quiet);
    }

    /* The cover asks for your name on a ruled line; a phone in a nursery
       asks for a box big enough to hit with a thumb. Boxes win — drawn
       freehand, so they still belong on the cover. */
    .lines { margin-top: 34px; }

    .row { position: relative; margin-bottom: 13px; }
    .write {
      display: block; width: 100%; height: 54px;
      padding: 0 15px;
      /* room for the eye, when there is one */
      padding-right: 44px;
      background: rgba(255,255,255,.6);
      border: 1.5px solid rgba(35,48,63,.32);
      border-radius: 10px 7px 12px 6px / 7px 12px 6px 10px;
      font-family: var(--hand);
      font-size: 23px; color: var(--ink);
      outline: none; -webkit-appearance: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .write::placeholder {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
      color: rgba(35,48,63,.42);
    }
    .write:focus {
      background: rgba(255,255,255,.82);
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(31,122,69,.16);
    }
    /* the label is inside the box now, so the tag beside it is retired */
    .row-tag { display: none; }

    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; padding: 4px; cursor: pointer;
    }
    .pw-toggle svg {
      width: 17px; height: 17px;
      stroke: rgba(70,40,45,.45); fill: none; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
      transition: stroke .15s;
    }
    .pw-toggle:hover svg { stroke: var(--ink); }

    /* ── marked in red pen ── */
    .error-msg {
      display: none;
      font-family: var(--hand);
      font-size: 19px; line-height: 1.15;
      color: #8f1120;
      padding: 2px 2px 4px;
      border-bottom: 2px solid rgba(143,17,32,.45);
      margin: 0 0 14px;
      animation: shake .35s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ── the button, printed on the cover like the logo ── */
    .btn-login {
      width: 100%; height: 50px;
      margin-top: 22px;
      background: var(--green-2);
      color: #f2fbf5;
      border: 2px solid rgba(9,58,32,.9);
      border-radius: 10px 7px 12px 6px / 7px 12px 6px 10px;
      box-shadow: 3px 3px 0 rgba(7,45,25,.35);
      transform: rotate(-.5deg);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 900;
      letter-spacing: .2em; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: transform .12s, box-shadow .12s, background .15s;
    }
    .btn-login:hover { background: var(--green); }
    .btn-login:active { transform: rotate(-.5deg) translate(3px,3px); box-shadow: 0 0 0; }
    .btn-login svg {
      width: 16px; height: 16px;
      stroke: #fff3f4; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .btn-login.loading { pointer-events: none; opacity: .85; }
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text,
    .btn-login.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── pencilled at the foot of the cover ── */
    .auth-links {
      display: flex; justify-content: space-between;
      align-items: baseline;
      margin-top: 16px;
    }
    .auth-link {
      font-family: var(--hand);
      font-size: 18px;
      color: var(--ink);
      background: none; border: none;
      border-bottom: 1.5px dashed rgba(35,48,63,.4);
      padding: 0 1px; cursor: pointer;
    }
    .auth-link:hover { color: var(--print); border-bottom-color: rgba(156,28,44,.6); }


    .demo-hint { display: none; }

    /* ── a sheet pulled out of the book (modals) ── */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(20,15,10,.72);
      z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-bg.show { opacity: 1; pointer-events: all; }
    .modal-sheet {
      width: 100%; max-width: 440px;
      background: #fffdf3;
      color: var(--ink);
      border-top: 6px solid var(--green-2);
      border-radius: 14px 14px 0 0;
      padding: 22px 22px 34px;
      transform: translateY(22px);
      transition: transform .25s;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-bg.show .modal-sheet { transform: translateY(0); }
    .modal-title {
      font-family: var(--hand);
      font-size: 27px; color: var(--ink); margin-bottom: 2px;
    }
    .modal-sub {
      font-size: 11.5px; color: #78807f;
      margin-bottom: 18px; line-height: 1.5;
    }
    .modal-field {
      border-bottom: 2px dotted rgba(80,35,45,.35);
      margin-bottom: 14px; padding-bottom: 2px;
    }
    .modal-label {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px; font-weight: 700;
      color: var(--print);
      text-transform: lowercase;
    }
    .modal-label::first-letter { text-transform: uppercase; }
    .modal-input {
      width: 100%; height: 34px;
      border: 0; background: transparent; outline: none;
      font-family: var(--hand);
      font-size: 22px; color: var(--ink);
      border-radius: 0; -webkit-appearance: none;
    }
    .modal-input::placeholder {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; color: #bdb7a6;
    }
    .modal-btn {
      width: 100%; height: 48px; margin-top: 10px;
      background: var(--green-2); color: #f2fbf5;
      border: 2px solid rgba(9,58,32,.9);
      border-radius: 10px 7px 12px 6px / 7px 12px 6px 10px;
      box-shadow: 3px 3px 0 rgba(7,45,25,.3);
      transform: rotate(-.5deg);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 900;
      letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer;
    }
    .modal-btn:hover { background: var(--green); }
    .modal-btn.loading { opacity: .6; pointer-events: none; }
    .modal-cancel {
      width: 100%; height: 40px; margin-top: 10px;
      background: none; border: none;
      font-family: var(--hand);
      font-size: 18px; color: #78807f;
      cursor: pointer;
    }
    .modal-cancel:hover { color: var(--ink); }
    .modal-error, .modal-success {
      display: none;
      font-family: var(--hand);
      font-size: 18px; line-height: 1.2;
      padding: 3px 2px 5px; margin-bottom: 10px;
      border-bottom: 2px solid;
    }
    .modal-error   { color: #8f1120; border-bottom-color: rgba(143,17,32,.45); }
    .modal-success { color: #1a4d1a; border-bottom-color: rgba(26,77,26,.4); }
    .modal-error.show, .modal-success.show { display: block; }


    @keyframes bookIn {
      from { opacity: 0; transform: translateY(16px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      .cover { padding: 26px 20px 22px; }
      .logo555 { font-size: 64px; }
      .portal-name { letter-spacing: .26em; font-size: 11px; }
    }
    @media (min-height: 800px) {
      .lines { margin-top: 48px; }
      .cover { padding-top: 40px; padding-bottom: 32px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- ══ The 555 exercise book, cover up ══ -->
  <div class="book">

    <!-- the inside pages, showing past the cover -->
    <div class="edges" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="cover">
      <div class="smudge" aria-hidden="true"></div>

      <div class="logo-wrap">
        <div class="logo555">555</div>
      </div>
      <div class="portal-name">Auditor Portal</div>
      <div class="portal-sub" data-t="login_sub">Sign in to the 555 Auditor Portal</div>

      <div class="lines">

        <div class="error-msg" id="error-msg">
          Incorrect username or password. Please try again.
        </div>

        <div class="row">
          <span class="row-tag" data-t="email_label">Email</span>
          <input
            class="write"
            id="email"
            placeholder="Email Address"
            type="email"
            autocomplete="email"
            autocapitalize="none"
            onkeydown="if(event.key==='Enter') document.getElementById('password').focus()"
          />
        </div>

        <div class="row">
          <span class="row-tag" data-t="password_label">Password</span>
          <input
            class="write"
            id="password"
            placeholder="Password"
            type="password"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') doLogin()"
          />
          <button class="pw-toggle" type="button" onclick="togglePw()" title="Show / hide password">
            <svg id="pw-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button class="btn-login" id="btn-login" onclick="doLogin()">
          <div class="spinner"></div>
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span class="btn-text" data-t="login_btn">Sign In</span>
        </button>

        <div class="auth-links">
          <button class="auth-link" onclick="showForgotPassword()" data-t="forgot_password">Forgot Password?</button>
          <button class="auth-link" onclick="showSignUp()" data-t="sign_up">Sign Up</button>
        </div>

      </div>

    </div>
  </div>

  <!-- FORGOT PASSWORD -->
  <div class="modal-bg" id="forgot-modal" onclick="if(event.target===this)hideForgotPassword()">
    <div class="modal-sheet">
      <div class="modal-title" data-t="forgot_title">Reset Password</div>
      <div class="modal-sub" data-t="forgot_sub">Enter your email and we will send you a reset link.</div>
      <div class="modal-error" id="forgot-error"></div>
      <div class="modal-success" id="forgot-success"></div>
      <div class="modal-field">
        <label class="modal-label" data-t="email_label">Email</label>
        <input class="modal-input" id="forgot-email" type="email" placeholder="Email Address" autocomplete="email"/>
      </div>
      <button class="modal-btn" id="forgot-btn" onclick="doForgotPassword()" data-t="send_reset">Send Reset Link</button>
      <button class="modal-cancel" onclick="hideForgotPassword()" data-t="cancel">Cancel</button>
    </div>
  </div>

  <!-- SIGN UP -->
  <div class="modal-bg" id="signup-modal" onclick="if(event.target===this)hideSignUp()">
    <div class="modal-sheet">
      <div class="modal-title" data-t="signup_title">Create Account</div>
      <div class="modal-sub" data-t="signup_sub">Register to access the 555 Auditor Portal.</div>
      <div class="modal-error" id="signup-error"></div>
      <div class="modal-success" id="signup-success"></div>
      <div class="modal-field">
        <label class="modal-label" data-t="full_name_label">Full Name</label>
        <input class="modal-input" id="signup-name" type="text" autocomplete="name"/>
      </div>
      <div class="modal-field">
        <label class="modal-label" data-t="email_label">Email</label>
        <input class="modal-input" id="signup-email" type="email" autocomplete="email"/>
      </div>
      <div class="modal-field">
        <label class="modal-label" data-t="password_label">Password</label>
        <input class="modal-input" id="signup-password" type="password" autocomplete="new-password"/>
      </div>
      <button class="modal-btn" id="signup-btn" onclick="doSignUp()" data-t="sign_up_btn">Create Account</button>
      <button class="modal-cancel" onclick="hideSignUp()" data-t="cancel">Cancel</button>
    </div>
  </div>


</div>

<script src="audit_lang.js?v=20260824e"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPA_URL = 'https://kibqjztozokohqmhqqqf.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
  const _supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  /* Where a sign-in lands. Admins get the back end (report + user access,
     with the way through to the audit portal); everyone else goes straight
     to the auditor view. Kept here rather than imported because this page
     deliberately does not load audit_supabase.js. */
  function auditLanding(){
    try{
      const u = JSON.parse(localStorage.getItem('mjm_user') || '{}');
      const mod = u.permissions && u.permissions.modules && u.permissions.modules.audit;
      const role = (u.audit_role || u.role || '').toLowerCase();
      if (mod === 'admin' || role === 'admin' || role === 'administrator')
        return 'audit_admin.html';
    }catch(e){}
    return 'audit_home.html';
  }

  // Already logged in — go straight in (works offline too)
  if (localStorage.getItem('mjm_user')) {
    window.location.href = auditLanding();
  }

  // Show offline banner
  function updateOfflineBar(){
    let bar = document.getElementById('offline-bar');
    if(!navigator.onLine){
      if(!bar){
        bar = document.createElement('div');
        bar.id = 'offline-bar';
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px;z-index:9999;letter-spacing:.3px';
        bar.textContent = '📴 Offline — login requires internet connection';
        document.body.appendChild(bar);
      }
    } else {
      if(bar) bar.remove();
    }
  }
  window.addEventListener('load', updateOfflineBar);
  window.addEventListener('online', updateOfflineBar);
  window.addEventListener('offline', updateOfflineBar);

  function togglePw() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('pw-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }

  async function doLogin() {
    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('error-msg');
    const btn      = document.getElementById('btn-login');

    errEl.classList.remove('show');

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.classList.add('show');
      return;
    }

    btn.classList.add('loading');

    // OFFLINE LOGIN — use cached credentials
    if (!navigator.onLine) {
      const cached = localStorage.getItem('mjm_cached_creds');
      if (cached) {
        try {
          const creds = JSON.parse(cached);
          if (creds.email === email && creds.password === password) {
            /* Restore the cached user. Without this the redirect landed on a
               page whose guard found no mjm_user and sent it straight back
               here — offline login looked like it did nothing. */
            const cachedUser = localStorage.getItem('mjm_cached_user');
            if (!cachedUser) {
              btn.classList.remove('loading');
              errEl.textContent = '📴 Offline — no cached profile. Sign in online once first.';
              errEl.classList.add('show');
              return;
            }
            localStorage.setItem('mjm_user', cachedUser);
            window.location.href = auditLanding();
            return;
          }
        } catch(e) {}
      }
      btn.classList.remove('loading');
      errEl.textContent = '📴 Offline — wrong email/password. Must login online at least once first.';
      errEl.classList.add('show');
      return;
    }

    try {
      // ONLINE LOGIN — Supabase Auth
      const { data, error } = await _supa.auth.signInWithPassword({ email, password });
      if (error) throw error;

      const userId = data.user.id;

      // Fetch profile. The table is shared_profiles — `profiles` was renamed
      // by migration_rename_and_new_tables.sql and no longer exists, so this
      // lookup used to fail silently and everyone logged in as their email
      // prefix with the role "Auditor".
      //
      // select('*') rather than a column list: shared_profiles gained columns
      // over time and naming one that is missing fails the whole row, which is
      // the same silent fallback all over again. RLS limits this to the
      // caller's own row.
      const { data: profile } = await _supa
        .from('shared_profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      const name = profile?.full_name || email.split('@')[0];
      const role = profile?.role || 'Auditor';

      const auditRole = profile?.audit_role || null;
      // permissions travels with the session so the audit pages can tell an
      // admin from an auditor while offline, the same way the portal does.
      const userObj = { id: userId, name, role, audit_role: auditRole, email,
                        phone: profile?.phone || '',
                        user_type: profile?.user_type || null,
                        permissions: profile?.permissions || null };

      // Save session + cache credentials for offline login. The user object
      // is cached alongside them because signing out clears mjm_user, and
      // the offline path below has nothing to sign anyone back in with
      // otherwise.
      localStorage.setItem('mjm_user', JSON.stringify(userObj));
      localStorage.setItem('mjm_cached_user', JSON.stringify(userObj));
      localStorage.setItem('mjm_cached_creds', JSON.stringify({ email, password }));

      window.location.href = auditLanding();

    } catch (e) {
      btn.classList.remove('loading');
      const msg = e.message || '';
      if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) {
        errEl.textContent = 'Incorrect email or password. Please try again.';
      } else if (msg.includes('Email not confirmed')) {
        errEl.textContent = 'Please verify your email before logging in.';
      } else {
        errEl.textContent = 'Login failed. Please check your connection and try again.';
      }
      errEl.classList.add('show');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  /* ── FORGOT PASSWORD ── */
  function showForgotPassword(){
    document.getElementById('forgot-modal').classList.add('show');
    document.getElementById('forgot-email').value = document.getElementById('email').value || '';
    document.getElementById('forgot-error').classList.remove('show');
    document.getElementById('forgot-success').classList.remove('show');
  }
  function hideForgotPassword(){
    document.getElementById('forgot-modal').classList.remove('show');
  }
  async function doForgotPassword(){
    const email = document.getElementById('forgot-email').value.trim();
    const errEl = document.getElementById('forgot-error');
    const okEl  = document.getElementById('forgot-success');
    const btn   = document.getElementById('forgot-btn');
    errEl.classList.remove('show');
    okEl.classList.remove('show');
    if(!email){ errEl.textContent = t('err_email_required'); errEl.classList.add('show'); return; }
    btn.classList.add('loading');
    btn.textContent = t('sending');
    try{
      const { error } = await _supa.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/index.html'
      });
      if(error) throw error;
      okEl.textContent = t('reset_sent');
      okEl.classList.add('show');
      btn.textContent = t('send_reset');
      btn.classList.remove('loading');
    }catch(e){
      errEl.textContent = e.message || t('reset_failed');
      errEl.classList.add('show');
      btn.textContent = t('send_reset');
      btn.classList.remove('loading');
    }
  }

  /* ── SIGN UP ── */
  function showSignUp(){
    document.getElementById('signup-modal').classList.add('show');
    document.getElementById('signup-email').value = document.getElementById('email').value || '';
    document.getElementById('signup-error').classList.remove('show');
    document.getElementById('signup-success').classList.remove('show');
  }
  function hideSignUp(){
    document.getElementById('signup-modal').classList.remove('show');
  }
  async function doSignUp(){
    const name     = document.getElementById('signup-name').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const errEl    = document.getElementById('signup-error');
    const okEl     = document.getElementById('signup-success');
    const btn      = document.getElementById('signup-btn');
    errEl.classList.remove('show');
    okEl.classList.remove('show');
    if(!name)    { errEl.textContent = t('err_name_required');     errEl.classList.add('show'); return; }
    if(!email)   { errEl.textContent = t('err_email_required');    errEl.classList.add('show'); return; }
    if(!password){ errEl.textContent = t('err_password_required'); errEl.classList.add('show'); return; }
    if(password.length < 6){ errEl.textContent = t('err_password_short'); errEl.classList.add('show'); return; }
    btn.classList.add('loading');
    btn.textContent = t('creating');
    try{
      const { data, error } = await _supa.auth.signUp({ email, password });
      if(error) throw error;
      // Save full_name to shared_profiles (`profiles` was renamed away).
      // The on_auth_user_created trigger already wrote id/email/full_name;
      // this only adds the role, and its error is deliberately ignored — with
      // email confirmation on there is no session yet, so it runs as anon and
      // RLS may refuse it. The account itself is already created either way.
      if(data.user){
        await _supa.from('shared_profiles').upsert({
          id:        data.user.id,
          email:     email,
          full_name: name,
          role:      'Auditor'
        });
      }
      okEl.textContent = t('signup_success');
      okEl.classList.add('show');
      btn.textContent = t('sign_up_btn');
      btn.classList.remove('loading');
    }catch(e){
      errEl.textContent = e.message || t('signup_failed');
      errEl.classList.add('show');
      btn.textContent = t('sign_up_btn');
      btn.classList.remove('loading');
    }
  }

</script>
