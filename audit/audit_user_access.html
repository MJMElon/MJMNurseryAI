<body>
<script>
/* ══════════════════════════════════════════════════════════════════════
   NURSERY AUDIT — SETTINGS

   The module files two things under one door: who may do what (the User
   Access screen every module shares), and the settings that belong to the
   installation itself rather than to a person.

   The file keeps its old name so every link, bookmark and the service
   worker's cache list still find it; only what it is called on screen
   changed.
   ══════════════════════════════════════════════════════════════════════ */
MJMModuleAccess.init({
  module: 'audit',
  title:  'Nursery Audit',
  moduleLabel: 'Audit',
  icon:   '📋',
  accent: 'orange',
  // What the module calls this screen now that it holds more than one thing.
  pageLabel:   'Settings',
  barLabel:    'Module Settings',
  accessLabel: 'User Access',
  tabs: [
    { key: 'system', label: 'System Setting',
      html: AuditSystemSetting.html, mount: AuditSystemSetting.mount }
  ],
  /* Where an auditor lands when they sign in. Most people work one
     nursery, and the chooser was a screen they answered the same way
     every morning. Left unset it still asks. */
  userFields: [
    { key: 'audit_landing',
      label: 'Lands on after sign-in',
      help: 'Send this auditor straight to one portal instead of the nursery chooser. '
          + 'They can still switch nursery from the bar at the top once they are in.',
      options: [
        { value: '',   label: 'Ask each time (the nursery chooser)' },
        { value: 'PN', label: 'Pre Nursery portal' },
        { value: 'MN', label: 'Main Nursery portal' }
      ] }
  ],
  // The back end is where this is opened from, and what "Main Page" names.
  back:   { href: 'audit_admin.html', label: 'Back to Main Page' },
  pages: [
    { key:'plot_audit', label:'Plot Condition Audit', desc:'Pest, animal and disease infestation, and leaf condition',
      actions:[
        { key:'record', label:'Record a new audit',        desc:'Walk a plot and submit its condition audit' },
        { key:'edit',   label:'Edit & delete past audits', desc:'Change or remove an audit already submitted' }
      ]},
    { key:'height', label:'Seedling Height Audit', desc:'Three sampled heights per plot, with photo evidence',
      actions:[
        { key:'record', label:'Record a new audit',        desc:'Measure and submit heights for a plot' },
        { key:'edit',   label:'Edit & delete past audits', desc:'Change or remove a height audit already submitted' }
      ]},
    { key:'papan', label:'Papan Tanda Audit', desc:'Height, accuracy and visibility of every papan tanda',
      actions:[
        { key:'record', label:'Record a new audit',        desc:'Audit the papan tanda on a plot' },
        { key:'edit',   label:'Edit & delete past audits', desc:'Change or remove a papan tanda audit' }
      ]},
    { key:'maintenance', label:'Maintenance Audit', desc:'Verify completed manuring, weeding, racun and interrow work',
      actions:[
        { key:'record', label:'Record a new audit',        desc:'Check work on site and submit the audit' },
        { key:'edit',   label:'Edit & delete past audits', desc:'Change or remove a maintenance audit' },
        { key:'verify', label:'Verify audit results',      desc:'Sign off another auditor\u2019s findings',
          adminOnly:true, highlight:true, chip:'Verify Audits' }
      ]},
    { key:'report', label:'Audit Report', desc:'The monthly roll-up of every audit',
      actions:[
        { key:'export', label:'Download the report', desc:'Export the monthly audit report' }
      ]}
  ]
});
</script>

</body>
</html>
