<style>
  body { background:#f8f4ec; margin:0; font-family:'Outfit', system-ui, sans-serif; color:#1a150d; }
  .bg-pattern { position:fixed; inset:0; background-image:radial-gradient(#e8dcc8 1px, transparent 1px); background-size:24px 24px; z-index:-2; opacity:.5; }
  .glass-panel { background-color:rgba(253, 250, 244, .95); backdrop-filter:blur(24px); border:1px solid #fff; box-shadow:0 25px 50px -12px rgba(61, 38, 16, .08); border-left:12px solid #6aa83c; }

  .input-style { border:1.5px solid #e8dcc8; background:#fff; padding:10px 12px; border-radius:12px; outline:none; width:100%; font-weight:600; font-size:13px; color:#1a150d; }
  .input-style:focus { border-color:#c07820; box-shadow:0 0 0 4px rgba(192, 120, 32, .15); }
  .label-style { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.15em; color:#8a7a68; margin-left:4px; margin-bottom:6px; display:block; }
  .btn-earth { background:linear-gradient(135deg, #6aa83c, #4a7a2e); color:white; font-weight:900; padding:12px 24px; border-radius:12px; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; box-shadow:0 8px 20px -4px rgba(74, 122, 46, .5); border:none; font-size:12px; }
  .btn-earth:hover { transform:translateY(-2px); }

  .stat-card { background:#fff; border:1px solid #e8dcc8; border-radius:1.5rem; padding:24px; }
  .stat-num  { font-size:2.5rem; font-weight:900; color:#3d2610; line-height:1; }
  .stat-label { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.18em; color:#8a7a68; margin-bottom:8px; }

  table.report-table { width:100%; border-collapse:separate; border-spacing:0; }
  .report-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#8a7a68; padding:12px 14px; border-bottom:2px solid #e8dcc8; background:#fdfaf4; white-space:nowrap; }
  .report-table td { font-size:13px; font-weight:600; color:#1a150d; padding:14px; border-bottom:1px solid #f3efe6; }
  .report-table tr:hover td { background:#fdfaf4; }
  /* Numeric cells across every report use tabular-nums so digits align
     column-for-column and rows read as a clean matrix. */
  .report-table td, .report-table th { font-variant-numeric: tabular-nums; }
  /* The movement reports carry a dozen narrow figure columns. Centring the
     heading over its figures keeps each column reading as one block, and a
     long heading — "Transplanted from PN" — wraps onto a second line instead
     of stretching its column wide enough to hold it on one. */
  .movement-table th { text-align:center; white-space:normal; line-height:1.3; max-width:96px; }
  .movement-table td { text-align:center; }
  .movement-table th:first-child, .movement-table td:first-child { text-align:left; max-width:none; }
  /* Seedling Sales grid: 14 columns (Year, 12 months, Total). Fix the
     layout so every month gets the same width regardless of value, and
     the year column stays narrow so it doesn't dominate the row. */
  .sales-table { table-layout: fixed; }
  .sales-table col.c-year  { width: 7%;  }
  .sales-table col.c-month { width: 6.5%; }
  .sales-table col.c-total { width: 9%;  }
  .sales-table th,
  .sales-table td { padding: 10px 8px; }
  .funnel-bar { height:14px; background:#f3efe6; border-radius:999px; overflow:hidden; display:flex; box-shadow:inset 0 1px 2px rgba(0,0,0,.05); }
  .funnel-seg { height:100%; transition:width .5s ease-out; }
  .seg-seeds   { background:#c07820; }
  .seg-planted { background:#6aa83c; }
  .seg-trans   { background:#3a7ab4; }
  .seg-cull    { background:#a83020; }

  /* Nursery multi-select chips */
  .nursery-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; background:#fff; border:1.5px solid #e8dcc8; cursor:pointer; font-size:11px; font-weight:700; color:#3d2610; user-select:none; }
  .nursery-chip:has(input:checked) { background:#e8f5da; border-color:#6aa83c; }
  .nursery-chip input { accent-color:#4a7a2e; }

  @media print {
    body { background:white; }
    .no-print, .glass-panel, header { box-shadow:none !important; border:none !important; }
    .no-print { display:none !important; }
    .stat-card, table { box-shadow:none !important; }
  }
</style>

<body class="min-h-screen p-4 md:p-8">

      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Back to Main Page
    </button>
    <h1 class="text-2xl md:text-3xl font-black uppercase tracking-widest text-[#3d2610]">📊 Operation Reports</h1>
    <button onclick="window.print()" class="no-print text-[10px] font-black text-white uppercase tracking-widest bg-[#3d2610] hover:bg-[#1a150d] px-5 py-3 rounded-xl shadow">Print / Export</button>
  </div>

  <!-- space-y so the filter panel, the loading line and the report itself are

  <div id="report-area" class="space-y-6">

    <div class="glass-panel p-6 rounded-[2rem] no-print">

        <div class="md:col-span-2 f-range">

            <button type="button" id="f-mode-table" class="flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest bg-[#3d2610] text-white">Table</button>
            <button type="button" id="f-mode-chart" class="flex-1 px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-[#3d2610]">Chart</button>
          </div>

    <!-- Loading state -->

    <!-- Report container -->

  </div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);

const STAGE_TYPES = {
  seeds:   ['Seeds_Received'],
  planted: ['Planted'],
  trans:   ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'],
  cull1:   ['1st_Culling'],
  cull2:   ['2nd_Culling'],
  cull3:   ['3rd_Culling']
};

function fmtNum(n)   { return (n || 0).toLocaleString(); }
function fmtPct(n)   { return (Math.max(0, Math.min(999, n || 0))).toFixed(2) + '%'; }
function fmtDate(d)  { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' }); }

function defaultRange() {
  const to = new Date();
  const from = new Date(); from.setMonth(from.getMonth() - 12);
  return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
}

async function loadBreeds() {
  const { data } = await _supabase.from('shared_breeds').select('name').order('name');
  const sel = document.getElementById('f-breed');
  (data || []).forEach(b => {
    const o = document.createElement('option');
    o.value = b.name; o.textContent = b.name;
    sel.appendChild(o);
  });
}

/**
 * Batch Production Summary
 *
 * Per batch, aggregate quantity_change by transaction_type group:
 *   seeds_in          = SUM(Seeds_Received)
 *   damaged           = ABS(SUM(Damaged_Seeds))   // not in funnel; shown for context
 *   planted           = SUM(Planted)
 *   transplanted      = SUM(Transplanted | _Premium | _DoubleTone)
 *   cull_1/2/3        = ABS(SUM(1st/2nd/3rd_Culling))
 *
 * Final alive  = transplanted − cull_1 − cull_2 − cull_3   (post-transplant losses only)
 * Survival %   = final alive / seeds_in × 100
 */
async function runBatchProduction() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const from  = document.getElementById('f-from').value;
  const to    = document.getElementById('f-to').value;
  const breed = document.getElementById('f-breed').value;

  // Fetch all batches in range — anchor date is Seeds_Received transaction_date.
  // plot_name joins us to nursery (main-nursery drilldowns need it).
  const [logsRes, batchesRes, plotsRes] = await Promise.all([
    // Paged — a single request stops at 1000 rows, which quietly dropped the
    // older batches out of the funnel entirely.
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      // breed_name comes off the log too — bulk-imported batches don't
      // have an operation_batches mirror row, so we can't rely on that
      // table alone to name the source.
      .select('batch_name, transaction_type, quantity_change, transaction_date, created_at, remark, plot_name, breed_name')
      // Only the funnel's types — the aggregation loop ignores everything
      // else anyway, and pulling the full table (photo rows, calibration,
      // audit notes…) was hammering the database on every report open.
      .in('transaction_type', ['Seeds_Received', 'Damaged_Seeds', 'Planted',
          'Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone',
          '1st_Culling', '2nd_Culling', '3rd_Culling'])
      .order('id', { ascending: true })),
    _supabase.from('operation_batches').select('name, breed_name, created_at'),
    _supabase.from('shared_plots').select('plot_name, nursery_name')
  ]);

  const { data: logs, error: logErr } = logsRes;
  if (logErr) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load logs: ${logErr.message}</div>`;
    return;
  }

  const batches = batchesRes.data || [];
  const meta = {};
  batches.forEach(b => { meta[b.name] = b; });

  // Nursery lookup — Pre-Nursery holding trays map to a virtual "Pre-Nursery"
  // slot; main-nursery plots resolve via shared_plots.nursery_name; anything
  // missing lands in "Unassigned" so it's still visible in the drilldown.
  const plotToNursery = {};
  (plotsRes.data || []).forEach(p => {
    if (p.plot_name) plotToNursery[p.plot_name] = p.nursery_name || 'Unassigned';
  });
  const nurseryOf = (plot) => {
    if (!plot) return 'Unassigned';
    if (PRE_NURSERY_PLOTS.includes(plot)) return 'Pre-Nursery';
    return plotToNursery[plot] || 'Unassigned';
  };

  // Group logs by batch. Also track per-batch damaged qty (for the seeds
  // drilldown) and raw records per stage (for the transplant / cull
  // drilldowns).
  const byBatch = {};
  (logs || []).forEach(l => {
    const b = l.batch_name; if (!b) return;
    if (!byBatch[b]) byBatch[b] = {
      batch_name: b,
      seeds: 0, planted: 0, trans: 0, cull1: 0, cull2: 0, cull3: 0,
      damaged: 0,
      seeds_date: null,
      log_breed: null,               // captured from any log with breed_name
      seedsLogs: [], transLogs: [], cull1Logs: [], cull2Logs: [], cull3Logs: []
    };
    const row = byBatch[b];
    if (!row.log_breed && l.breed_name) row.log_breed = l.breed_name;
    const qty = Number(l.quantity_change || 0);
    const t = l.transaction_type;
    if (STAGE_TYPES.seeds.includes(t))   { row.seeds   += qty; row.seeds_date = row.seeds_date || l.transaction_date || l.created_at; row.seedsLogs.push(l); }
    else if (t === 'Damaged_Seeds')      { row.damaged += Math.abs(qty); }
    else if (STAGE_TYPES.planted.includes(t)) row.planted += qty;
    else if (STAGE_TYPES.trans.includes(t))   { row.trans += qty; row.transLogs.push(l); }
    else if (STAGE_TYPES.cull1.includes(t))   { row.cull1 += Math.abs(qty); row.cull1Logs.push(l); }
    else if (STAGE_TYPES.cull2.includes(t))   { row.cull2 += Math.abs(qty); row.cull2Logs.push(l); }
    else if (STAGE_TYPES.cull3.includes(t))   { row.cull3 += Math.abs(qty); row.cull3Logs.push(l); }
  });

  // Filter by date range (on Seeds_Received date) and breed.
  const fromTs = from ? new Date(from).getTime() : -Infinity;
  const toTs   = to   ? new Date(to).getTime() + 86400000 : Infinity;

  let rows = Object.values(byBatch).map(r => {
    const m = meta[r.batch_name] || {};
    // Prefer the breed captured on the actual log rows — bulk-imported
    // batches don't have an operation_batches row to consult, but every
    // Seeds_Received log has breed_name filled in.
    r.breed_name = r.log_breed || m.breed_name || '—';
    r.batch_created_at = m.created_at || r.seeds_date;
    const finalAlive = Math.max(0, r.trans - r.cull1 - r.cull2 - r.cull3);
    const survival   = r.seeds > 0 ? (finalAlive / r.seeds) * 100 : 0;
    r.final_alive = finalAlive;
    r.survival_pct = survival;
    return r;
  });

  rows = rows.filter(r => {
    if (breed && r.breed_name !== breed) return false;
    const anchor = r.seeds_date ? new Date(r.seeds_date).getTime()
                : (r.batch_created_at ? new Date(r.batch_created_at).getTime() : NaN);
    if (isNaN(anchor)) return true; // keep batches with no anchor date so users see them
    return anchor >= fromTs && anchor <= toTs;
  });

  rows.sort((a, b) => {
    const da = a.seeds_date ? new Date(a.seeds_date).getTime() : 0;
    const db = b.seeds_date ? new Date(b.seeds_date).getTime() : 0;
    return db - da;
  });

  // ── Aggregate summary ──
  const summary = rows.reduce((s, r) => ({
    batches:    s.batches + 1,
    seeds:      s.seeds   + r.seeds,
    planted:    s.planted + r.planted,
    trans:      s.trans   + r.trans,
    cull:       s.cull    + r.cull1 + r.cull2 + r.cull3,
    final:      s.final   + r.final_alive
  }), { batches: 0, seeds: 0, planted: 0, trans: 0, cull: 0, final: 0 });

  const overallSurvival = summary.seeds > 0 ? (summary.final / summary.seeds) * 100 : 0;

  // Stash drilldown data on window for the click-through modal below.
  // We only publish rows that survived the filter step so drilldowns
  // reflect exactly what the summary is counting.
  window._bpDetails = { rows, nurseryOf, filterFrom: from, filterTo: to, breed };

  // ── Render ──
  loading.classList.add('hidden');
  out.classList.remove('hidden');

  const clickable = 'cursor-pointer hover:shadow-lg hover:-translate-y-0.5 transition-all';
  out.innerHTML = `
    <!-- Summary cards -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="stat-card">
        <div class="stat-label">Batches</div>
        <div class="stat-num">${fmtNum(summary.batches)}</div>
      </div>
      <div class="stat-card ${clickable}" onclick="openBpDrill('seeds')" title="Click to see the seed intake per batch">
        <div class="stat-label">Seeds Received</div>
        <div class="stat-num text-[#c07820]">${fmtNum(summary.seeds)}</div>
        <div class="text-[9px] font-bold text-[#8a7a68] mt-1 uppercase tracking-widest">Click for details</div>
      </div>
      <div class="stat-card ${clickable}" onclick="openBpDrill('trans')" title="Click to see the transplant rows per nursery">
        <div class="stat-label">Transplanted</div>
        <div class="stat-num text-[#3a7ab4]">${fmtNum(summary.trans)}</div>
        <div class="text-[9px] font-bold text-[#8a7a68] mt-1 uppercase tracking-widest">Click for details</div>
      </div>
      <div class="stat-card ${clickable}" onclick="openBpDrill('cull')" title="Click to see the culled qty per nursery">
        <div class="stat-label">Culled (1+2+3)</div>
        <div class="stat-num text-[#a83020]">${fmtNum(summary.cull)}</div>
        <div class="text-[9px] font-bold text-[#8a7a68] mt-1 uppercase tracking-widest">Click for details</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Final Alive</div>
        <div class="stat-num text-[#4a7a2e]">${fmtNum(summary.final)}</div>
        <div class="text-[10px] font-black uppercase tracking-widest text-[#4a7a2e] mt-1">Survival ${fmtPct(overallSurvival)}</div>
      </div>
    </div>

    <!-- Per-batch table -->
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Batch Production Summary</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${fmtNum(rows.length)} batch${rows.length === 1 ? '' : 'es'}${from ? ' · from ' + fmtDate(from) : ''}${to ? ' · to ' + fmtDate(to) : ''}${breed ? ' · ' + breed : ''}</div>
      </div>

      <div class="overflow-x-auto">
        <table class="report-table">
          <thead>
            <tr>
              <th>Batch</th>
              <th>Breed</th>
              <th>Seeds In</th>
              <th class="text-right">Seeds</th>
              <th class="text-right">Planted</th>
              <th class="text-right">Transplanted</th>
              <th class="text-right">Cull 1 / 2 / 3</th>
              <th class="text-right">Final Alive</th>
              <th class="text-right">Survival</th>
              <th style="min-width:200px">Funnel</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length ? rows.map(r => {
              const segMax = Math.max(r.seeds, r.planted, r.trans, 1);
              const segPct = (v) => Math.max(0, Math.min(100, (v / segMax) * 100));
              return `
                <tr>
                  <td><div class="font-black text-[#3d2610]">${r.batch_name}</div></td>
                  <td>${r.breed_name}</td>
                  <td>${fmtDate(r.seeds_date)}</td>
                  <td class="text-right text-[#c07820] font-black">${fmtNum(r.seeds)}</td>
                  <td class="text-right">${fmtNum(r.planted)}</td>
                  <td class="text-right text-[#3a7ab4] font-black">${fmtNum(r.trans)}</td>
                  <td class="text-right text-[#a83020]">${fmtNum(r.cull1)} / ${fmtNum(r.cull2)} / ${fmtNum(r.cull3)}</td>
                  <td class="text-right text-[#4a7a2e] font-black">${fmtNum(r.final_alive)}</td>
                  <td class="text-right font-black ${r.survival_pct >= 80 ? 'text-[#4a7a2e]' : r.survival_pct >= 60 ? 'text-[#c07820]' : 'text-[#a83020]'}">${fmtPct(r.survival_pct)}</td>
                  <td>
                    <div class="funnel-bar" title="Seeds ${fmtNum(r.seeds)} → Planted ${fmtNum(r.planted)} → Transplanted ${fmtNum(r.trans)}">
                      <div class="funnel-seg seg-seeds"   style="width:${segPct(r.seeds)}%"></div>
                    </div>
                    <div class="funnel-bar mt-1">
                      <div class="funnel-seg seg-planted" style="width:${segPct(r.planted)}%"></div>
                    </div>
                    <div class="funnel-bar mt-1">
                      <div class="funnel-seg seg-trans"   style="width:${segPct(r.trans)}%"></div>
                    </div>
                  </td>
                </tr>`;
            }).join('') : `<tr><td colspan="10" class="text-center py-10 text-[#8a7a68]">No batches match the selected filters.</td></tr>`}
          </tbody>
        </table>
      </div>

      <div class="text-[10px] font-bold text-[#8a7a68] mt-4 leading-relaxed">
        <strong class="text-[#3d2610]">Notes —</strong>
        Survival % = Final&nbsp;Alive ÷ Seeds&nbsp;Received × 100. Final&nbsp;Alive subtracts cull cycles 1, 2, 3 from Transplanted. Damaged seeds at planting are tracked separately in the Planting tab and are not included in the cull totals here.
      </div>
    </div>
  `;
}

async function runReport() {
  const which = document.getElementById('f-report').value;
  if (which === 'batch_production')   return runBatchProduction();
  if (which === 'pre_nursery_movement')  return runPreNurseryMovement();
  if (which === 'main_nursery_movement') return runMainNurseryMovement();
  if (which === 'seedling_sales')     return runSeedlingSales();
}

// ── Filter visibility by report type ─────────────────────────────────────────
function syncFilterVisibility() {
  const which     = document.getElementById('f-report').value;
  const isPre     = (which === 'pre_nursery_movement');
  const isMain    = (which === 'main_nursery_movement');
  const isMove    = isPre || isMain;
  const isBatch   = (which === 'batch_production');
  const isSales   = (which === 'seedling_sales');
  document.querySelectorAll('.f-range').forEach(el         => el.classList.toggle('hidden', !(isBatch || isMove)));
  // A movement report stands AT a date; only the batch summary covers a span.
  document.querySelectorAll('.f-from').forEach(el          => el.classList.toggle('hidden', !isBatch));
  const toLabel = document.getElementById('f-to-label');
  if (toLabel) toLabel.textContent = isMove ? 'As at' : 'To';
  document.querySelectorAll('.f-sort').forEach(el          => el.classList.toggle('hidden', !isMove));
  // Group By is gone: each movement report now has its own fixed layout —
  // tray or plot, then batch — so there was nothing left to choose.
  // Only the main-nursery report has nurseries to pick between; the
  // pre-nursery one is all one place.
  document.querySelectorAll('.f-nursery-inline').forEach(el => el.classList.toggle('hidden', !isMain));
  document.querySelectorAll('.f-breed').forEach(el         => el.classList.toggle('hidden', !isBatch));
  document.querySelectorAll('.f-sales-mode').forEach(el    => el.classList.toggle('hidden', !isSales));
  document.querySelectorAll('.f-sales-years').forEach(el   => el.classList.toggle('hidden', !isSales));
}

async function loadNurseryFilter() {
  const { data } = await _supabase.from('shared_plots').select('nursery_name');

  (data || []).forEach(p => { if (p.nursery_name) names.add(p.nursery_name); });

// ════════════════════════════════════════════════════════════════════════════
// Seedling Sales Report (year × month grid)
// ════════════════════════════════════════════════════════════════════════════
// Aggregates `shared_do_records.total_qty` by year and month of delivery_date,
// excluding cancelled DOs. Renders a year-by-year grid like the printed report,
// with a variance row at the bottom comparing the latest year to the previous.

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const _CHART_COLORS = ['#3a7ab4', '#c07820', '#4a7a2e', '#a83020', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ca8a04', '#0284c7', '#9333ea', '#dc2626'];

// Populate the year chip filter once the data has told us which years exist.
function _populateYearChips(years) {
  const wrap = document.getElementById('f-year-chips');
  if (!wrap) return;
  const existing = new Set([...wrap.querySelectorAll('input')].map(cb => cb.value));
  const incoming = new Set(years.map(String));
  // Only rebuild when the set of years actually changes
  if (existing.size === incoming.size && [...existing].every(v => incoming.has(v))) return;
  wrap.innerHTML = '';
  years.forEach(y => {
    const lbl = document.createElement('label');
    lbl.className = 'nursery-chip';
    lbl.innerHTML = `<input type="checkbox" class="f-yr-cb" value="${y}" checked>${y}`;
    wrap.appendChild(lbl);
  });
  document.getElementById('f-yr-all').onclick  = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = true);  };
  document.getElementById('f-yr-none').onclick = () => { document.querySelectorAll('.f-yr-cb').forEach(cb => cb.checked = false); };
}
function _selectedYears() {
  return [...document.querySelectorAll('.f-yr-cb:checked')].map(cb => Number(cb.value));
}

// Simple SVG line chart of monthly sales, one line per selected year.
function _renderSalesChart(grid, years) {
  const W = 960, H = 460, PL = 60, PR = 20, PT = 30, PB = 50;
  const months = MONTHS_SHORT;
  const data = years.map(y => grid[y] || new Array(12).fill(0));
  const max = Math.max(1, ...data.flat());
  const niceMax = Math.ceil(max / 5000) * 5000 || max;
  const xStep = (W - PL - PR) / 11;
  const yPlot = (v) => PT + (H - PT - PB) * (1 - v / niceMax);
  const xPlot = (i) => PL + xStep * i;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:520px" preserveAspectRatio="xMidYMid meet">`;
  // Y gridlines + labels
  for (let i = 0; i <= 5; i++) {
    const y   = yPlot((niceMax * i) / 5);
    const val = Math.round((niceMax * i) / 5);
    svg += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e8dcc8" stroke-width="1"/>`;
    svg += `<text x="${PL - 10}" y="${y + 4}" text-anchor="end" fill="#8a7a68" font-size="11" font-weight="700">${fmtNum(val)}</text>`;
  }
  // X labels
  months.forEach((m, i) => {
    svg += `<text x="${xPlot(i)}" y="${H - PB + 22}" text-anchor="middle" fill="#3d2610" font-size="11" font-weight="700">${m}</text>`;
  });
  // Lines + dots
  data.forEach((vals, idx) => {
    const color = _CHART_COLORS[idx % _CHART_COLORS.length];
    const pts = vals.map((v, i) => `${xPlot(i)},${yPlot(v)}`).join(' ');
    svg += `<polyline points="${pts}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v, i) => {
      svg += `<circle cx="${xPlot(i)}" cy="${yPlot(v)}" r="4" fill="${color}"><title>${years[idx]} ${months[i]}: ${fmtNum(v)}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = years.map((y, i) => `
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white border border-[#e8dcc8] text-[11px] font-bold text-[#3d2610]">
      <span style="width:14px;height:14px;background:${_CHART_COLORS[i % _CHART_COLORS.length]};border-radius:3px;display:inline-block"></span>${y}
    </span>`).join('');

  return `<div class="flex flex-wrap gap-2 mb-4">${legend}</div>${svg}`;
}

async function runSeedlingSales() {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const { data: dos, error } = await _supabase
    .from('shared_do_records')
    .select('delivery_date, total_qty, status, remark')
    .order('delivery_date', { ascending: true });

  if (error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load deliveries: ${error.message}</div>`;
    return;
  }

  // Build the full year × month grid (all years on record).
  const grid = {};
  (dos || []).forEach(d => {
    const cancelled = d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'));
    if (cancelled) return;
    if (!d.delivery_date) return;
    const dt = new Date(d.delivery_date);
    if (isNaN(dt)) return;
    const y = dt.getFullYear();
    const m = dt.getMonth();
    if (!grid[y]) grid[y] = new Array(12).fill(0);
    grid[y][m] += Number(d.total_qty || 0);
  });

  const allYears = Object.keys(grid).map(Number).sort();
  if (!allYears.length) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No delivery records found.</div>`;
    return;
  }

  // Populate the year chip filter (idempotent — only rebuilds if the year set changed).
  _populateYearChips(allYears);

  // Years the user picked (default: every checkbox is checked on first load).
  let years = _selectedYears();
  if (!years.length) years = allYears;
  years.sort();

  const latest = years[years.length - 1];
  const prev   = years.length > 1 ? years[years.length - 2] : null;
  const rowTotal = (arr) => arr.reduce((s, v) => s + v, 0);

  // Year-by-year variance row (latest visible year vs the one before it).
  let varianceAbs = null, variancePct = null;
  if (prev != null) {
    varianceAbs = grid[latest].map((v, i) => v - grid[prev][i]);
    variancePct = grid[latest].map((v, i) => {
      const base = grid[prev][i];
      return (base === 0) ? null : ((v - base) / base) * 100;
    });
  }

  const fmtVarPct = (n) => (n == null) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cell = (n) => `<td class="text-right">${n === 0 ? '0' : fmtNum(n)}</td>`;
  const varCell = (n) => {
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${n > 0 ? '+' : ''}${fmtNum(n)}</td>`;
  };
  const varPctCell = (n) => {
    if (n == null) return `<td class="text-right text-[#8a7a68]">—</td>`;
    const cls = n > 0 ? 'text-[#4a7a2e]' : (n < 0 ? 'text-[#a83020]' : 'text-[#8a7a68]');
    return `<td class="text-right font-black ${cls}">${fmtVarPct(n)}</td>`;
  };

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  const headerHtml = `
    <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
      <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">Seedlings Sales Report</h3>
      <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${years.length} year${years.length === 1 ? '' : 's'} · ${years[0]} – ${latest}</div>
    </div>`;

  const bodyHtml = (_salesViewMode === 'chart')
    ? _renderSalesChart(grid, years)
    : `
      <div class="overflow-x-auto">
        <table class="report-table sales-table">
          <colgroup>
            <col class="c-year">
            ${MONTHS_SHORT.map(() => '<col class="c-month">').join('')}
            <col class="c-total">
          </colgroup>
          <thead>
            <tr>
              <th>Year</th>
              ${MONTHS_SHORT.map(m => `<th class="text-right">${m}</th>`).join('')}
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${years.map(y => `
              <tr>
                <td class="font-black text-[#3d2610]">${y}</td>
                ${grid[y].map(v => cell(v)).join('')}
                <td class="text-right font-black text-[#3d2610]">${fmtNum(rowTotal(grid[y]))}</td>
              </tr>
            `).join('')}
            ${prev != null ? `
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">Variance<br><span class="text-[10px] font-bold text-[#8a7a68]">(${latest} vs ${prev})</span></td>
                ${varianceAbs.map(v => varCell(v)).join('')}
                ${varCell(rowTotal(varianceAbs))}
              </tr>
              <tr style="background:#fdfaf4">
                <td class="font-black text-[#3d2610]">%</td>
                ${variancePct.map(p => varPctCell(p)).join('')}
                ${varPctCell(rowTotal(varianceAbs) / (rowTotal(grid[prev]) || 1) * 100)}
              </tr>
            ` : ''}
          </tbody>
        </table>
      </div>`;

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      ${headerHtml}
      ${bodyHtml}
      <div class="text-[10px] font-bold text-[#8a7a68] mt-4 leading-relaxed">
        <strong class="text-[#3d2610]">Notes —</strong>
        Issuance is the sum of <code>total_qty</code> on delivery (DO) records, bucketed by <code>delivery_date</code>.
        Cancelled DOs are excluded. Each DO can cover multiple plots / batches; the total here counts the DO once.
        Variance row compares the latest visible year against the one before it (within the current Years selection).
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════════════════
// Nursery Summary Report (per-nursery monthly movement for a chosen year)
// ════════════════════════════════════════════════════════════════════════════
// Per nursery (mapped via shared_plots.nursery_name + Pre-Nursery aliases):
//   Seeds In         = SUM(Seeds_Received)               — pre-nursery only
//   Transplanted In  = SUM(Transplanted*) into this nursery's plots
//   Transplanted Out = mirror of trans-in, credited to source nursery
//                      (best-effort: source assumed Pre-Nursery for transplants
//                      into Main; not perfectly resolvable from current schema)
//   Damaged          = ABS(SUM(Damaged_Seeds))
//   Culling          = ABS(SUM(1st/2nd/3rd_Culling))
//   Sold             = SUM(qty_n) on DO records, by plot_n's nursery (cancelled excluded)
//   Balance c/f      = Balance b/f + Seeds In + Trans In − Trans Out − Damaged − Culling − Sold

const PRE_NURSERY_PLOTS = ['Pre-Nursery', 'DOUBLE-TONE', 'PREMIUM CARE'];
const TRANSPLANT_TYPES  = ['Transplanted', 'Transplanted_Premium', 'Transplanted_DoubleTone'];

function ymKey(d) {
  if (!d) return null;
  const x = new Date(d);
  if (isNaN(x)) return null;
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`;
}


// ════════════════════════════════════════════════════════════════════════════
// Summary Report (group by Batch / Plot / Date)
// ════════════════════════════════════════════════════════════════════════════
// One universal column set; rows roll up to the chosen dimension:
//   By Plot  → one row per (Plot, Batch). Plot is shown once at the top of
//              each plot group, then individual batch rows underneath; a TOTAL
//              line closes each plot. Matches the supplied xlsx samples.
//   By Batch → one row per Batch (summed across plots).
//   By Date  → one row per calendar date.
//
// Columns: B/F · Seeds In · Planted · Transplanted · Premium · Double Tone ·
//          Damaged · 1st Cull · 2nd Cull · 3rd Cull · Sold · Closing
// B/F is the cumulative net of all transactions BEFORE the From date for the
// same (plot, batch) / batch / date key. Closing = B/F + inflow − outflow.

const SUMMARY_SKIP_TYPES = new Set([
  'Seed_Audit', 'Seed_Audit_Email', 'Seed_Audit_Note', 'Seed_Audit_Action',
  'Planting_Photo', 'Stock_Calibration'
]);

/* ── Reading a movement date out of a batch-report log ──────────────────────
   The batch report writes most movement rows WITHOUT transaction_date — the
   date the user keyed sits inside the remark instead:

     Transplanted / Premium / D-Tone  →  "... Date: 2026-03-04"
     1st Culling                      →  "... Date: 2026-03-04"
     2nd Culling                      →  "... CullDate: 2026-03-04"
     3rd Culling                      →  no date at all
     Seeds_Received / Planted         →  real transaction_date

   The report used to read transaction_date only, so every transplanting and
   culling row resolved to NaN and was skipped — which is why those columns
   read 0 while Sold (from the DO system, which does carry a date) did not.
   Resolve in the order the batch report actually records: the keyed date
   first, then the remark, then when the row was written. */
const _RE_LOG_DATE = /(?:Cull)?Date:\s*(\d{4}-\d{2}-\d{2})/i;
function _logDate(l) {
  if (l.transaction_date) return String(l.transaction_date).slice(0, 10);
  const m = l.remark ? String(l.remark).match(_RE_LOG_DATE) : null;
  if (m) return m[1];
  return l.created_at ? String(l.created_at).slice(0, 10) : null;
}

/* Supabase caps a single request at 1000 rows. The movement report reads the
   whole ledger, so it has to page or it silently reports on a fraction of the
   batches. */
async function fetchAllRows(buildQuery, pageSize = 1000) {
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await buildQuery().range(from, from + pageSize - 1);
    if (error) return { data: null, error };
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return { data: all, error: null };
}

/* A delivery order's plot and batch are typed by hand: "225.", " 225",
   "U15 (UPB PREMIER HYBRID)". Read them the way the batch report reads them,
   so a D/O line lands on the row the batch report already has rather than
   inventing one of its own. */
function _mvPlotKey(v) {
  return String(v == null ? '' : v).trim().toUpperCase()
    .replace(/^PLOT\s*:?\s*/, '')
    .split(/[\s(,\[]/)[0]
    .replace(/[^0-9A-Z\-]/g, '');
}
/* A batch is identified by its trailing digits, exactly as the batch report
   identifies it — "MJM-225", "225." and " 225 " are all batch 225. Something
   with no trailing digits at all ("24D") identifies no batch and returns '',
   so it can never be matched to one. */
function _mvBatchKey(v) {
  // Trailing punctuation first — "225." is still batch 225 — then the digits
  // it ends with.
  const cleaned = String(v == null ? '' : v).trim().replace(/[^0-9A-Za-z]+$/, '');
  const m = /(\d+)$/.exec(cleaned);
  return m ? String(parseInt(m[1], 10)) : '';
}


/* ════════════════════════════════════════════════════════════════════════════
   MOVEMENT REPORTS

   Two reports, not one. The pre-nursery and the main nursery hold different
   things and move them in different ways, and a single table that tried to
   serve both left most of its columns empty on every row.

     Pre-nursery   keyed by TRAY · batch. Seeds are planted into a tray, some
                   are culled, and the rest leave — to a main-nursery plot, or
                   to the Premium Care / Double Tone trays.
     Main nursery  keyed by PLOT · batch. Seedlings arrive from pre-nursery,
                   are culled twice more, sold, or transferred plot to plot.

   Both are built by the same engine below: a column spec says what each
   column is called, which way it moves the balance, and how it is coloured.
════════════════════════════════════════════════════════════════════════════ */

/* Nurseries read in the order the nursery works in, not the order the
   alphabet happens to put them in. Anything not named here follows after. */
const NURSERY_ORDER = ['BNN', 'UNN 1', 'UNN 2'];
function nurseryRank(n) {
  const k = _mvPlotKey(n);
  const i = NURSERY_ORDER.findIndex(x => _mvPlotKey(x) === k);
  return i === -1 ? NURSERY_ORDER.length : i;
}

/* sign: how the column moves the balance. 0 means shown but not counted —
   see Seed Damage, which never entered a tray to begin with. */
const MOVE_COLS = {
  pre: [
    { key: 'trIn',     label: 'Transfer In',      sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'planted',  label: 'Planted',          sign: +1, cls: 'text-[#c07820]' },
    { key: 'damaged',  label: 'Seed Damage',      sign:  0, cls: 'text-[#a83020]' },
    { key: 'cull1',    label: '1st Culled',       sign: -1, cls: 'text-[#a83020]' },
    { key: 'transOut', label: 'Transplanted Out', sign: -1, cls: 'text-[#a83020]' },
    { key: 'premium',  label: 'Premium Care',     sign: -1, cls: 'text-[#a83020]', grp: 'Transfer Out' },
    { key: 'dtone',    label: 'Double Tone',      sign: -1, cls: 'text-[#a83020]', grp: 'Transfer Out' },
  ],
  main: [
    { key: 'trIn',    label: 'Transfer In',           sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'transIn', label: 'Transplanted from PN',  sign: +1, cls: 'text-[#3a7ab4]' },
    { key: 'cull2',   label: '2nd Culled',            sign: -1, cls: 'text-[#a83020]' },
    { key: 'sold',    label: 'Sold',                  sign: -1, cls: 'text-[#a83020]' },
    { key: 'cull3',   label: '3rd Culled',            sign: -1, cls: 'text-[#a83020]' },
    { key: 'trOut',   label: 'Transfer Out',          sign: -1, cls: 'text-[#a83020]' },
  ],
};

const emptyRow = (scope) => MOVE_COLS[scope].reduce((a, c) => { a[c.key] = 0; return a; }, {});

/**
 * What a row's movements come to.
 *
 * The 3rd culling count is cumulative: it is keyed against the ORIGINAL
 * transplanted figure rather than against what was left by then, so it
 * already contains the 2nd culling. Taking both off subtracts the 2nd
 * culling twice — which is why B1's batch 237 read -2 when 1,182
 * transplanted less 90 culled, 989 sold and 103 transferred away comes to
 * exactly nought.
 *
 * So the 2nd culling counts only while no 3rd culling has been recorded.
 * Before the 3rd it is the live deduction; after it, it is already inside
 * the figure that replaced it.
 */
function netOfRow(scope, b) {
  const superseded = scope === 'main' && (b.cull3 || 0) > 0;
  return MOVE_COLS[scope].reduce((s, c) => {
    if (superseded && c.key === 'cull2') return s;
    return s + c.sign * (b[c.key] || 0);
  }, 0);
}

/* "2 months". Age is measured from the batch's own planting date, so it reads
   the same whether the batch is still in a tray or long since out in a plot. */
function ageLabel(planted) {
  if (!planted) return '—';
  const d = new Date(planted);
  if (isNaN(d.getTime())) return '—';
  const now = new Date();
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m--;
  if (m < 0) m = 0;
  return m + (m === 1 ? ' month' : ' months');
}

async function runPreNurseryMovement()  { return runMovementReport('pre'); }
async function runMainNurseryMovement() { return runMovementReport('main'); }

async function runMovementReport(scope) {
  const out = document.getElementById('report-output');
  const loading = document.getElementById('loading');
  out.classList.add('hidden');
  loading.classList.remove('hidden');

  const toStr   = document.getElementById('f-to').value;
  const toMs    = toStr ? new Date(toStr).getTime() + 86400000 : Infinity;
  const groupBy = (document.getElementById('f-sort') || {}).value || 'plot';

  const [logsRes, dosRes, plotsRes, traysRes] = await Promise.all([
    fetchAllRows(() => _supabase.from('shared_inventory_logs')
      .select('transaction_type, transaction_date, created_at, remark, plot_name, batch_name, quantity_change')
      .in('transaction_type', ['Seeds_Received', 'Planted', 'Transplanted',
          'Transplanted_Premium', 'Transplanted_DoubleTone', 'Damaged_Seeds',
          '1st_Culling', '2nd_Culling', '3rd_Culling', 'Cull3_Transfer'])
      .order('id', { ascending: true })),
    fetchAllRows(() => _supabase.from('shared_do_records')
      .select('delivery_date, status, remark, plot_1, qty_1, batch_1, plot_2, qty_2, batch_2, plot_3, qty_3, batch_3, plot_4, qty_4, batch_4, plot_5, qty_5, batch_5')
      .order('id', { ascending: true })),
    _supabase.from('shared_plots').select('plot_name, nursery_name'),
    _supabase.from('operation_trays').select('tray_name, nursery_name').then(r => r, () => ({ data: [] }))
  ]);
  if (logsRes.error || dosRes.error || plotsRes.error) {
    loading.classList.add('hidden');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-red-700 text-sm">Failed to load data.</div>`;
    return;
  }

  const logs = logsRes.data || [];

  // ── Where each place belongs ──
  const plotToLoc = {};
  (plotsRes.data || []).forEach(p => { plotToLoc[p.plot_name] = p.nursery_name || 'Unassigned'; });
  // Trays are pre-nursery whatever nursery they sit in; their own nursery is
  // kept only so the pre-nursery list can be read in the same order.
  const trayNames = new Set();
  const trayNursery = {};
  ((traysRes && traysRes.data) || []).forEach(t => {
    if (!t.tray_name) return;
    trayNames.add(t.tray_name);
    trayNursery[t.tray_name] = t.nursery_name || '';
  });
  PRE_NURSERY_PLOTS.forEach(p => trayNames.add(p));
  const isTray = (name) => trayNames.has(name);

  const selectedLocs = new Set(selectedNurseries());
  const passMain = (plot) => !!plot && !isTray(plot) && selectedLocs.has(plotToLoc[plot] || 'Unassigned');

  // ── When each batch was planted, for Age ──
  // The same source the batch list uses: the keyed date on Seeds_Received.
  const batchPlantedAt = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Seeds_Received') return;
    const k = _mvBatchKey(l.batch_name);
    const d = l.transaction_date || l.created_at;
    if (!k || !d) return;
    if (!batchPlantedAt[k] || String(d) < String(batchPlantedAt[k])) batchPlantedAt[k] = d;
  });

  // ── Every movement, as (place, batch, column, qty) ──
  const ev = [];
  const push = (sc, date, place, batch, col, qty) => {
    if (sc !== scope || !place || !qty) return;
    ev.push({ date, place, batch: batch || '—', col, qty });
  };
  const srcTrayOf = (l) => {
    const m = (l.remark || '').match(/from tray \[([^\]]+)\]/i);
    return m ? m[1].trim() : null;
  };

  // Damaged seeds carry no tray: they are counted at the batch as it is
  // planted and never enter one. Shown against the tray the batch was mostly
  // planted into, once, so the column is visible without being invented for
  // every tray the batch happens to occupy — and it does not move that tray's
  // balance, because those seeds were never standing in it.
  const batchHomeTray = {};
  logs.forEach(l => {
    if (l.transaction_type !== 'Planted' || !l.plot_name) return;
    const k = _mvBatchKey(l.batch_name);
    const q = Math.abs(l.quantity_change || 0);
    if (!batchHomeTray[k] || q > batchHomeTray[k].qty) batchHomeTray[k] = { tray: l.plot_name, qty: q };
  });

  logs.forEach(l => {
    if (SUMMARY_SKIP_TYPES.has(l.transaction_type)) return;
    const d = _logDate(l);
    const q = Math.abs(l.quantity_change || 0);
    const t = l.transaction_type;
    const b = l.batch_name;

    if (t === 'Planted')     { push('pre', d, l.plot_name, b, 'planted', q); return; }
    if (t === '1st_Culling') { push('pre', d, l.plot_name, b, 'cull1', q); return; }
    if (t === '2nd_Culling') { if (passMain(l.plot_name)) push('main', d, l.plot_name, b, 'cull2', q); return; }
    if (t === '3rd_Culling') { if (passMain(l.plot_name)) push('main', d, l.plot_name, b, 'cull3', q); return; }

    if (t === 'Damaged_Seeds') {
      const home = batchHomeTray[_mvBatchKey(b)];
      if (home) push('pre', d, home.tray, b, 'damaged', q);
      return;
    }

    if (t === 'Transplanted') {
      const src = srcTrayOf(l);
      if (src) push('pre', d, src, b, 'transOut', q);
      if (passMain(l.plot_name)) push('main', d, l.plot_name, b, 'transIn', q);
      return;
    }

    if (t === 'Transplanted_Premium' || t === 'Transplanted_DoubleTone') {
      const src = srcTrayOf(l);
      const col = t === 'Transplanted_Premium' ? 'premium' : 'dtone';
      if (src) push('pre', d, src, b, col, q);
      push('pre', d, l.plot_name, b, 'trIn', q);   // the receiving tray
      return;
    }

    if (t === 'Cull3_Transfer') {
      const from = (l.remark || '').match(/From:\s*\[([^\]|]+)\|/);
      if (passMain(l.plot_name)) push('main', d, l.plot_name, b, 'trIn', q);
      if (from && passMain(from[1])) push('main', d, from[1], b, 'trOut', q);
      return;
    }
  });

  // ── Sales, only against a plot·batch the batch report already has ──
  const unmatchedSales = [];
  if (scope === 'main') {
    const realRows = new Map();
    ev.forEach(e => {
      const pk = _mvPlotKey(e.place), bk = _mvBatchKey(e.batch);
      if (!pk || !bk) return;
      if (!realRows.has(pk)) realRows.set(pk, new Map());
      if (!realRows.get(pk).has(bk)) realRows.get(pk).set(bk, { place: e.place, batch: e.batch });
    });
    // Diagnostic trace — every DO line that landed as a Sold event
    // for the main-nursery view. Open DevTools > Console and grep for
    // [mv:sales] to audit "which DO lines add up to N sold on plot X
    // batch Y". Grouped and totalled below the raw list.
    const _salesTrace = [];
    (dosRes.data || []).forEach(d => {
      if (d.status === 'Cancelled' || (d.remark && d.remark.includes('[CANCELLED]'))) return;
      for (let i = 1; i <= 5; i++) {
        const qty = Number(d[`qty_${i}`] || 0);
        if (!qty) continue;
        const plot = d[`plot_${i}`];
        if (!passMain(plot)) continue;
        const hit = (realRows.get(_mvPlotKey(plot)) || new Map()).get(_mvBatchKey(d[`batch_${i}`]));
        if (!hit) { unmatchedSales.push({ plot: plot || '—', batch: d[`batch_${i}`] || '—', qty }); continue; }
        ev.push({ date: d.delivery_date || null, place: hit.place, batch: hit.batch, col: 'sold', qty });
        _salesTrace.push({
          do: d.do_number || d.id, line: i,
          plot: hit.place, batch: hit.batch,
          raw_plot: plot, raw_batch: d[`batch_${i}`], qty,
          delivery_date: d.delivery_date, status: d.status
        });
      }
    });
    const _byPB = {};
    _salesTrace.forEach(t => {
      const k = t.plot + ' · ' + t.batch;
      (_byPB[k] = _byPB[k] || []).push(t);
    });
    Object.keys(_byPB).sort().forEach(k => {
      const rows = _byPB[k];
      const total = rows.reduce((s, r) => s + r.qty, 0);
      console.log('[mv:sales]', k, '=', total, '(' + rows.length + ' DO line' + (rows.length===1?'':'s') + ')', rows);
    });
  }

  // ── Everything up to the date being stood at ──
  const SEP = '';
  const buc = {}, meta = {};
  for (const e of ev) {
    const ts = e.date ? new Date(e.date).getTime() : NaN;
    if (!isFinite(ts) || ts > toMs) continue;
    const k = e.place + SEP + e.batch;
    meta[k] = meta[k] || { place: e.place, batch: e.batch };
    if (!buc[k]) buc[k] = emptyRow(scope);
    buc[k][e.col] += e.qty;
  }

  let rows = [];
  for (const k of Object.keys(buc)) {
    const b = buc[k];
    const moved = MOVE_COLS[scope].some(c => b[c.key]);
    if (!moved) continue;
    const closing = netOfRow(scope, b);
    // Nothing of this batch left here — culled, sold or moved on. A NEGATIVE
    // closing is kept: that is a figure to look into, not one to hide.
    if (closing === 0) continue;
    rows.push({ ...meta[k], ...b, closing,
                age: ageLabel(batchPlantedAt[_mvBatchKey(meta[k].batch)]) });
  }

  const _natCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  const locOfRow = (r) => scope === 'pre'
    ? (trayNursery[r.place] || 'Pre-Nursery')
    : (plotToLoc[r.place] || 'Unassigned');
  rows.sort((a, c) => (groupBy === 'batch'
    // A transferred batch sits in several plots, often in several nurseries;
    // keeping it under one heading is the whole point of this view.
    ? _natCmp(a.batch, c.batch) ||
      nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(a.place, c.place)
    : nurseryRank(locOfRow(a)) - nurseryRank(locOfRow(c)) ||
      _natCmp(locOfRow(a), locOfRow(c)) ||
      _natCmp(a.place, c.place) || _natCmp(a.batch, c.batch)));

  loading.classList.add('hidden');
  out.classList.remove('hidden');

  const cols = MOVE_COLS[scope];
  const placeLabel = scope === 'pre' ? 'Tray No' : 'Plot';
  const firstLabel  = groupBy === 'batch' ? 'Batch' : placeLabel;
  const secondLabel = groupBy === 'batch' ? placeLabel : 'Batch';
  const title = scope === 'pre' ? 'Pre-Nursery Movement' : 'Main Nursery Movement';

  if (!rows.length) {
    out.innerHTML = `<div class="glass-panel p-6 rounded-[2rem] text-[#8a7a68] text-sm">No ${
      scope === 'pre' ? 'pre-nursery' : 'main nursery'} movement found in this period.</div>`;
    return;
  }

  const fmtCell = (n, cls) => `<td class="${cls || ''}">${n ? fmtNum(n) : '0'}</td>`;

  // ── Body: a section per nursery, a group per tray/plot ──
  // Grouped by whichever the reader asked for. By batch, a batch that has
  // been transferred shows every plot it now sits in under one heading —
  // which is the only way to see where a batch actually IS.
  const keyOf   = (r) => (groupBy === 'batch' ? r.batch : r.place);
  const otherOf = (r) => (groupBy === 'batch' ? r.place : r.batch);
  const groups = [];
  rows.forEach(r => {
    const last = groups[groups.length - 1];
    if (last && last.key === keyOf(r)) last.list.push(r);
    else groups.push({ key: keyOf(r), loc: locOfRow(r), list: [r] });
  });

  const totalCols = 5 + cols.length;
  const bodyHtml = [];
  let lastLoc = null;
  let band = false;
  groups.forEach(g => {
    if (groupBy !== 'batch' && g.loc !== lastLoc) {
      lastLoc = g.loc;
      bodyHtml.push(`<tr style="background:#f3ede1"><td colspan="${totalCols}"
        class="font-black text-[11px] uppercase tracking-widest text-[#3d2610] py-2">${g.loc}</td></tr>`);
    }
    const bal = g.list.reduce((s, r) => s + r.closing, 0);
    // Alternating bands, one shade apart, so a group's rows read as a block
    // without the table turning into a colour chart.
    band = !band;
    const zebra = band ? ' style="background:#fdfaf4"' : '';
    g.list.forEach((r, i) => {
      bodyHtml.push(`<tr${zebra}>
        <td class="font-black text-[#3d2610]">${i === 0 ? g.key : ''}</td>
        <td>${otherOf(r) || '—'}</td>
        <td class="text-[#8a7a68] text-xs whitespace-nowrap">${r.age}</td>
        ${cols.map(c => fmtCell(r[c.key], c.cls)).join('')}
        ${fmtCell(r.closing, 'text-[#4a7a2e] font-black')}
        <td class="font-black text-[#4a7a2e]">${i === 0 ? fmtNum(bal) : ''}</td>
      </tr>`);
    });
  });

  // ── Grand total ──
  const grand = rows.reduce((s, r) => {
    cols.forEach(c => { s[c.key] += r[c.key] || 0; });
    s.closing += r.closing;
    return s;
  }, { closing: 0, ...emptyRow(scope) });

  // A grouped header row only where two columns belong together.
  const grouped = cols.some(c => c.grp);
  let groupRow = '';
  if (grouped) {
    const cells = [];
    let i = 0;
    while (i < cols.length) {
      const g = cols[i].grp;
      if (!g) { cells.push('<th></th>'); i++; continue; }
      let n = 0;
      while (i + n < cols.length && cols[i + n].grp === g) n++;
      cells.push(`<th colspan="${n}" class="text-center text-[#c07820]">${g}</th>`);
      i += n;
    }
    groupRow = `<tr><th colspan="3"></th>${cells.join('')}<th colspan="2"></th></tr>`;
  }

  const rangeLabel = toStr ? `As at ${fmtDate(toStr)}` : 'As at today';
  const unmatchedHtml = unmatchedSales.length ? `
      <div class="mt-4 rounded-2xl border border-[#f0b429] bg-[#fffbeb] p-4">
        <div class="text-[11px] font-black text-[#7a4a10] uppercase tracking-widest mb-2">
          ${unmatchedSales.length} delivery order line${unmatchedSales.length === 1 ? '' : 's'} not matched to a batch report
        </div>
        <div class="text-[10px] font-bold text-[#8a7a68] mb-2">
          These are left out of the table above. The plot or batch on the delivery order does not
          exist in any batch report, so there is no row for the sale to belong to.
        </div>
        <div class="flex flex-wrap gap-2">
          ${unmatchedSales.map(u => `<span class="inline-block bg-white border border-[#e8dcc8] rounded-lg px-2.5 py-1 text-[11px] font-bold text-[#3d2610]">
             ${u.plot} · batch ${u.batch} · ${fmtNum(u.qty)}</span>`).join('')}
        </div>
      </div>` : '';

  out.innerHTML = `
    <div class="glass-panel p-6 rounded-[2rem]">
      <div class="flex items-center justify-between mb-4 border-b border-[#e8dcc8] pb-4">
        <h3 class="text-lg font-black uppercase tracking-widest text-[#3d2610]">${title}</h3>
        <div class="text-[10px] font-bold text-[#8a7a68] uppercase tracking-widest">${rangeLabel}</div>
      </div>

      <div class="overflow-x-auto">
        <table class="report-table movement-table">
          <thead>
            ${groupRow}
            <tr>
              <th>${firstLabel}</th>
              <th>${secondLabel}</th>
              <th>Age</th>
              ${cols.map(c => `<th>${c.label}</th>`).join('')}
              <th>Batch Balance</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody>
            ${bodyHtml.join('')}
            <tr style="background:#fdf3e6">
              <td class="font-black text-[#3d2610]">GRAND TOTAL</td>
              <td></td><td></td>
              ${cols.map(c => fmtCell(grand[c.key], (c.cls || '') + ' font-black')).join('')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black')}
              ${fmtCell(grand.closing, 'text-[#4a7a2e] font-black')}
            </tr>
          </tbody>
        </table>
      </div>

      ${unmatchedHtml}

      <div class="text-[10px] font-bold text-[#8a7a68] mt-4 leading-relaxed">
        <strong class="text-[#3d2610]">Notes —</strong>
        <em>Age</em> is measured from the batch's own planting date, so it reads the same
        wherever the batch has got to.
        <em>B/F</em> is the net of everything before the From date for the same row.
        <em>Batch Balance</em> is that row's closing figure; <em>Balance</em> is the
        group's, shown once against its first row — the
        ${scope === 'pre' ? 'tray' : 'plot'}'s when sorted by
        ${scope === 'pre' ? 'tray' : 'plot'}, and the batch's across every
        ${scope === 'pre' ? 'tray' : 'plot'} it sits in when sorted by batch.
        A row whose balance works out to zero is left off — everything has been
        ${scope === 'pre' ? 'culled or moved on' : 'culled, sold or moved on'}. A negative
        balance is still shown, because that is a figure to look into.
        ${scope === 'pre' ? `
        Every tray movement names its tray: planting and 1st culling record it directly, and a
        transplant records the tray it left in its remark, so a tray frees by exactly what left
        it. <em>Transfer In</em> is what the Premium Care and Double Tone trays receive from
        other trays. <em>Seed Damage</em> is counted at the batch as it is planted and never
        enters a tray, so it is shown against the tray the batch was mostly planted into and
        does <strong>not</strong> reduce that tray's balance.`
        : `
        <em>Transplanted from PN</em> is what arrived from the pre-nursery trays.
        <em>Sold</em> comes from the Customer DO system; cancelled DOs are excluded, and a
        delivery order can only subtract from a row the batch report already has — it never
        creates one, so a plot or batch mistyped on a D/O cannot appear here.
        <em>Transfer In / Out</em> are the 3rd culling's plot-to-plot transfers.`}
        <em>2nd Culled</em> is shown but only deducted while no 3rd culling has been
        recorded: the 3rd culling count is keyed against the original transplanted
        figure, so it already contains the 2nd, and taking both off would subtract
        the 2nd twice.
        Dates are the ones keyed into the batch report; where a stage was saved without one,
        the record's save date is used. Audit, photo and stock-calibration entries are not
        counted as movements.
      </div>
    </div>
  `;
}

async function bootstrap() {
  await MJMAccess.load(_supabase);
  if (!MJMAccess.user()) { window.location.href = 'operation_dashboard.html'; return; }
  if (!MJMAccess.canAccess('reports')) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('report-area').classList.add('hidden');
    document.getElementById('forbidden').classList.remove('hidden');
    return;
  }
  const { from, to } = defaultRange();
  const todayStr = new Date().toISOString().slice(0, 10);
  const fFrom = document.getElementById('f-from');
  const fTo   = document.getElementById('f-to');
  fFrom.value = from; fTo.value = to;
  // Reports look at what has actually happened — future dates make no
  // sense. Cap the "To" picker at today; keep "From" bounded by "To"
  // so you can't pick From > To either.
  fFrom.max = todayStr;
  fTo.max   = todayStr;
  fTo.addEventListener('input',   () => { fFrom.max = fTo.value || todayStr; });
  fFrom.addEventListener('input', () => { fTo.min   = fFrom.value || ''; });
  await Promise.all([loadBreeds(), loadNurseryFilter()]);
  _setSalesView('table');
  document.getElementById('f-mode-table').addEventListener('click', () => { _setSalesView('table'); runReport(); });
  document.getElementById('f-mode-chart').addEventListener('click', () => { _setSalesView('chart'); runReport(); });
  document.addEventListener('change', e => {
    if (e.target && (e.target.classList.contains('f-yr-cb') || e.target.classList.contains('f-nurs-cb'))) runReport();
  });
  syncFilterVisibility();
  runReport();
}

bootstrap();

// ── Batch Production drilldown modal ─────────────────────────────
// A single centred modal reused for the Seeds Received / Transplanted /
// Culled tiles. Content is regenerated on every open so we always
// reflect the active date+breed filter.
// Persist the active drilldown's Year + Month picks so onchange handlers
// on the modal's dropdowns can re-render without re-fetching.
let _bpDrillState = { kind: null, year: '', month: '' };

const _BP_MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Extract raw records for the active drilldown kind. Each record must
// carry a `date` so we can build Year / Month filters and re-filter
// without re-querying the DB.
function _bpDrillCollect(kind, D) {
  const rows = D.rows || [];
  const list = [];
  if (kind === 'seeds') {
    rows.forEach(r => {
      const seedsQty = r.seedsLogs.reduce((s, l) => s + Number(l.quantity_change || 0), 0) || r.seeds;
      list.push({
        date:     r.seeds_date,
        breed:    r.breed_name,
        batch:    r.batch_name,
        received: seedsQty,
        damaged:  r.damaged || 0
      });
    });
  } else if (kind === 'trans') {
    rows.forEach(r => r.transLogs.forEach(l => list.push({
      // The keyed transplanting date, not when the row happened to be written.
      date:    _logDate(l),
      batch:   r.batch_name,
      breed:   r.breed_name,
      plot:    l.plot_name || '—',
      nursery: D.nurseryOf(l.plot_name),
      qty:     Number(l.quantity_change || 0)
    })));
  } else if (kind === 'cull') {
    const push = (r, l, stage) => list.push({
      date:    _logDate(l),
      stage,
      batch:   r.batch_name,
      breed:   r.breed_name,
      plot:    l.plot_name || '—',
      nursery: stage === '1st' ? 'Pre-Nursery' : D.nurseryOf(l.plot_name),
      qty:     Math.abs(Number(l.quantity_change || 0))
    });
    rows.forEach(r => {
      r.cull1Logs.forEach(l => push(r, l, '1st'));
      r.cull2Logs.forEach(l => push(r, l, '2nd'));
      r.cull3Logs.forEach(l => push(r, l, '3rd'));
    });
  }
  return list;
}

// Render the Year/Month picker bar for the active drilldown. `all` is the
// full extracted set (pre-filter) so we can offer only years/months that
// actually have records — no dead selections.
function _bpDrillFilterBar(all) {
  const years = new Set(), months = new Set();
  all.forEach(x => {
    if (!x.date) return;
    const d = new Date(x.date);
    if (isNaN(d)) return;
    years.add(d.getFullYear());
    months.add(d.getMonth());
  });
  const yearOpts = ['<option value="">All years</option>']
    .concat(Array.from(years).sort((a,b) => b-a)
      .map(y => `<option value="${y}"${String(y) === String(_bpDrillState.year) ? ' selected' : ''}>${y}</option>`))
    .join('');
  const monthOpts = ['<option value="">All months</option>']
    .concat(Array.from(months).sort((a,b) => a-b)
      .map(m => `<option value="${m}"${String(m) === String(_bpDrillState.month) ? ' selected' : ''}>${_BP_MONTH_NAMES[m]}</option>`))
    .join('');
  return `
    <div class="flex items-center gap-2 flex-wrap mb-3">
      <span class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mr-1">Filter</span>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Year
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_bpDrillSetFilter('year', this.value)">${yearOpts}</select>
      </label>
      <label class="text-[10px] font-bold text-[#3d2610] flex items-center gap-1.5">Month
        <select class="border border-[#e8dcc8] rounded-lg px-2 py-1 text-[11px] font-black text-[#3d2610]"
                onchange="_bpDrillSetFilter('month', this.value)">${monthOpts}</select>
      </label>
      ${(_bpDrillState.year || _bpDrillState.month !== '') ? `
        <button type="button" onclick="_bpDrillClearFilter()" class="text-[10px] font-black text-[#a83020] uppercase tracking-widest hover:underline ml-1">Clear</button>
      ` : ''}
    </div>`;
}

function _bpDrillSetFilter(key, value) {
  _bpDrillState[key] = value;
  _bpDrillRender();
}
function _bpDrillClearFilter() {
  _bpDrillState.year = ''; _bpDrillState.month = '';
  _bpDrillRender();
}

function _bpDrillApplyFilter(all) {
  const y = _bpDrillState.year, m = _bpDrillState.month;
  if (!y && m === '') return all.slice();
  return all.filter(x => {
    if (!x.date) return false;
    const d = new Date(x.date);
    if (isNaN(d)) return false;
    if (y && d.getFullYear() !== Number(y)) return false;
    if (m !== '' && d.getMonth() !== Number(m)) return false;
    return true;
  });
}

function openBpDrill(kind) {
  if (!window._bpDetails) return;
  _bpDrillState = { kind, year: '', month: '' };
  _bpDrillRender();
  document.getElementById('bp-drill-modal').classList.remove('hidden');
  document.getElementById('bp-drill-modal').classList.add('flex');
}

function _bpDrillRender() {
  const D = window._bpDetails; if (!D) return;
  const kind = _bpDrillState.kind;
  const rangeLabel = [
    D.filterFrom ? 'From ' + fmtDate(D.filterFrom) : '',
    D.filterTo   ? 'to '   + fmtDate(D.filterTo)   : '',
    D.breed || ''
  ].filter(Boolean).join(' · ') || 'All time';

  const allList = _bpDrillCollect(kind, D);
  const list    = _bpDrillApplyFilter(allList);

  // Filter chip text so the count line reads honestly.
  const activeYear  = _bpDrillState.year;
  const activeMonth = _bpDrillState.month;
  const filterNote = (activeYear || activeMonth !== '') ?
    ` · Filtered: ${activeMonth !== '' ? _BP_MONTH_NAMES[Number(activeMonth)] : ''} ${activeYear || ''}`.trim() : '';

  const barHtml = _bpDrillFilterBar(allList);

  let title = '', bodyInner = '';
  if (kind === 'seeds') {
    title = 'Seeds Received · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const totRcv = list.reduce((s, x) => s + x.received, 0);
    const totDmg = list.reduce((s, x) => s + x.damaged,  0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} batch${list.length === 1 ? '' : 'es'}${filterNote}</div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Breed (Source)</th><th>Batch</th>
            <th class="text-right">Qty Received</th><th class="text-right">Damaged</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td>${x.breed}</td>
                <td class="font-black">${x.batch}</td>
                <td class="text-right text-[#c07820] font-black">${fmtNum(x.received)}</td>
                <td class="text-right ${x.damaged ? 'text-[#a83020] font-black' : 'text-[#8a7a68]'}">${x.damaged ? fmtNum(x.damaged) : '—'}</td>
              </tr>`).join('') : '<tr><td colspan="5" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="3" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Totals</td>
            <td class="text-right text-[#c07820]">${fmtNum(totRcv)}</td>
            <td class="text-right text-[#a83020]">${fmtNum(totDmg)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }
  else if (kind === 'trans') {
    title = 'Transplanted · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const roll = {};
    list.forEach(x => { roll[x.nursery] = (roll[x.nursery] || 0) + x.qty; });
    const rollRows = Object.entries(roll).sort((a, b) => b[1] - a[1]);
    const total = list.reduce((s, x) => s + x.qty, 0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} transplant record${list.length === 1 ? '' : 's'}${filterNote}</div>
      <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        ${rollRows.map(([n, q]) => `
          <div class="bg-[#eef5fc] border border-[#bee3f8] rounded-xl px-3 py-2">
            <div class="text-[9px] font-black text-[#3a7ab4] uppercase tracking-widest">${n}</div>
            <div class="text-lg font-black text-[#3a7ab4]">${fmtNum(q)}</div>
          </div>`).join('') || '<div class="text-[10px] text-[#8a7a68] uppercase tracking-widest col-span-full">No transplant records for the selected filter.</div>'}
      </div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Batch</th><th>Breed (Source)</th>
            <th>Nursery</th><th>Plot</th><th class="text-right">Qty</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td class="font-black">${x.batch}</td>
                <td>${x.breed}</td>
                <td class="font-black text-[#3a7ab4]">${x.nursery}</td>
                <td>${x.plot}</td>
                <td class="text-right text-[#3a7ab4] font-black">${fmtNum(x.qty)}</td>
              </tr>`).join('') : '<tr><td colspan="6" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="5" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#3a7ab4]">${fmtNum(total)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }
  else if (kind === 'cull') {
    title = 'Culled (1 + 2 + 3) · detail';
    list.sort((a, b) => (new Date(b.date || 0)) - (new Date(a.date || 0)));
    const roll = {};
    list.forEach(x => {
      if (!roll[x.nursery]) roll[x.nursery] = { total: 0, '1st': 0, '2nd': 0, '3rd': 0 };
      roll[x.nursery].total    += x.qty;
      roll[x.nursery][x.stage] += x.qty;
    });
    const rollEntries = Object.entries(roll).sort((a, b) => b[1].total - a[1].total);
    const total = list.reduce((s, x) => s + x.qty, 0);
    bodyInner = `
      <div class="text-[10px] font-black text-[#8a7a68] uppercase tracking-widest mb-2">${rangeLabel} · ${list.length} culling record${list.length === 1 ? '' : 's'}${filterNote}</div>
      <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        ${rollEntries.map(([n, v]) => `
          <div class="bg-[#fff5f5] border border-[#f8d7da] rounded-xl px-3 py-2">
            <div class="text-[9px] font-black text-[#a83020] uppercase tracking-widest">${n}</div>
            <div class="text-lg font-black text-[#a83020]">${fmtNum(v.total)}</div>
            <div class="text-[9px] font-bold text-[#8a7a68] mt-0.5">1st ${fmtNum(v['1st'])} · 2nd ${fmtNum(v['2nd'])} · 3rd ${fmtNum(v['3rd'])}</div>
          </div>`).join('') || '<div class="text-[10px] text-[#8a7a68] uppercase tracking-widest col-span-full">No culling records for the selected filter.</div>'}
      </div>
      <div class="overflow-x-auto">
        <table class="report-table w-full">
          <thead><tr>
            <th>Date</th><th>Stage</th><th>Batch</th><th>Breed (Source)</th>
            <th>Nursery</th><th>Plot</th><th class="text-right">Culled Qty</th>
          </tr></thead>
          <tbody>
            ${list.length ? list.map(x => `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td class="font-black text-[#a83020]">${x.stage}</td>
                <td class="font-black">${x.batch}</td>
                <td>${x.breed}</td>
                <td class="font-black text-[#a83020]">${x.nursery}</td>
                <td>${x.plot}</td>
                <td class="text-right text-[#a83020] font-black">${fmtNum(x.qty)}</td>
              </tr>`).join('') : '<tr><td colspan="7" class="text-center text-[#8a7a68] text-[11px] py-6">No records for the selected filter.</td></tr>'}
          </tbody>
          <tfoot><tr class="font-black bg-[#f8f4ec]">
            <td colspan="6" class="text-right uppercase tracking-widest text-[10px] text-[#8a7a68]">Total</td>
            <td class="text-right text-[#a83020]">${fmtNum(total)}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }

  document.getElementById('bp-drill-title').textContent = title;
  document.getElementById('bp-drill-body').innerHTML   = barHtml + bodyInner;
}
window._bpDrillSetFilter   = _bpDrillSetFilter;
window._bpDrillClearFilter = _bpDrillClearFilter;

function closeBpDrill() {
  const m = document.getElementById('bp-drill-modal');
  if (!m) return;
  m.classList.add('hidden');
  m.classList.remove('flex');
}

window.openBpDrill  = openBpDrill;
window.closeBpDrill = closeBpDrill;
</script>

<!-- Batch Production drilldown modal — reused across Seeds Received / Transplanted / Culled tiles. -->
<div id="bp-drill-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/60 p-4" onclick="if(event.target===this)closeBpDrill()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-6 py-4 border-b border-[#e8dcc8] bg-gradient-to-r from-[#f8f4ec] to-white">
      <div class="text-base font-black text-[#3d2610] uppercase tracking-widest" id="bp-drill-title">Detail</div>
      <button onclick="closeBpDrill()" class="w-9 h-9 rounded-lg bg-[#e8dcc8]/60 hover:bg-[#e8dcc8] text-[#3d2610] text-xl leading-none flex items-center justify-center transition-colors">×</button>
    </div>
    <div class="p-5 overflow-y-auto" id="bp-drill-body"></div>
  </div>
</div>

</body>
</html>
