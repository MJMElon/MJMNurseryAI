<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJM Nursery AI · Collection Time Slot Booking</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234a7a2e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Outfit', system-ui, sans-serif; }
  body { background:#f1f5f9; margin:0; min-height:100vh; }

  .fade-enter { animation:fadeIn .35s ease-out; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}

  /* SEARCH INPUT */
  .search-input { background:white; border:2px solid #e2e8f0; color:#1e293b; border-radius:14px; padding:14px 20px; font-size:16px; font-weight:600; outline:none; transition:all .2s; font-family:'Outfit',sans-serif; width:100%; box-sizing:border-box; }
  .search-input:focus { border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.1); }
  .search-input::placeholder { color:#94a3b8; }

  /* QTY BUTTONS */
  .qty-btn { padding:12px 22px; border-radius:14px; border:2px solid #e2e8f0; background:white; font-weight:900; font-size:16px; cursor:pointer; transition:all .2s; font-family:'Outfit',sans-serif; color:#334155; }
  .qty-btn:hover { border-color:#10b981; background:#ecfdf5; color:#065f46; }
  .qty-btn.active { border-color:#10b981; background:#10b981; color:white; box-shadow:0 4px 12px rgba(16,185,129,.3); }

  /* CARD */
  .dash-card { background:white; border-radius:20px; border:1px solid #e2e8f0; box-shadow:0 4px 16px rgba(0,0,0,.06); }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:white; border-radius:24px; width:100%; max-width:560px; max-height:93vh; overflow-y:auto; box-shadow:0 32px 80px rgba(0,0,0,.35); animation:popIn .25s ease both; }

  /* ALLOCATION BOARD */
  .alloc-board { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media(max-width:640px){ .alloc-board { grid-template-columns:1fr 1fr; } }
  .alloc-col { background:#f8fafc; border:2px solid #e2e8f0; border-radius:16px; min-height:220px; padding:10px; transition:border-color .2s,background .2s; }
  .alloc-col.drag-over { border-color:#10b981; background:#ecfdf5; }
  .alloc-col-header { font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; padding:10px 12px; border-radius:10px; margin-bottom:10px; text-align:center; }
  .alloc-col.pending .alloc-col-header { background:#fef3c7; color:#92400e; }
  .alloc-col.nursery .alloc-col-header { background:#dbeafe; color:#1e40af; }
  .alloc-card { background:white; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px; cursor:grab; transition:all .15s; box-shadow:0 2px 6px rgba(0,0,0,.04); }
  .alloc-card:hover { border-color:#10b981; box-shadow:0 4px 12px rgba(0,0,0,.08); }
  .alloc-card.dragging { opacity:.4; transform:scale(.95); }
  .alloc-card.status-pending { border-left:4px solid #f59e0b; }
  .alloc-card.status-booked { border-left:4px solid #10b981; }
  .alloc-card .card-name { font-size:15px; font-weight:900; color:#1e293b; }
  .alloc-card .card-detail { font-size:13px; font-weight:600; color:#64748b; margin-top:3px; }
  .alloc-card .card-qty { font-size:14px; font-weight:900; color:#065f46; }
  .alloc-card .card-time { font-size:13px; font-weight:700; color:#3b82f6; }
  .alloc-count { font-size:12px; font-weight:700; color:#94a3b8; margin-left:4px; }

  /* TOAST */
  .toast { position:fixed; bottom:24px; right:24px; background:linear-gradient(135deg,#064e3b,#10b981); color:white; padding:14px 22px; border-radius:14px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:10px; z-index:999; opacity:0; transform:translateY(10px); transition:opacity .3s,transform .3s; pointer-events:none; box-shadow:0 8px 24px rgba(16,185,129,.4); }
  .toast.show { opacity:1; transform:translateY(0); }

  /* CALENDAR */
  .cal-grid { display:grid; grid-template-columns: 80px repeat(var(--cols,6), 1fr); border:1px solid #e2e8f0; border-radius:16px; overflow:hidden; background:white; }
  .cal-header { background:#f8fafc; padding:12px 8px; text-align:center; font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:#64748b; border-bottom:2px solid #e2e8f0; border-right:1px solid #e2e8f0; }
  .cal-header.today { background:#ecfdf5; color:#065f46; border-bottom-color:#10b981; }
  .cal-time { background:#fafbfc; padding:8px 10px; font-size:13px; font-weight:900; color:#94a3b8; text-align:right; border-bottom:1px solid #f1f5f9; border-right:1px solid #e2e8f0; display:flex; align-items:flex-start; justify-content:flex-end; min-height:72px; }
  .cal-cell { border-bottom:1px solid #f1f5f9; border-right:1px solid #f1f5f9; padding:4px; min-height:72px; cursor:pointer; transition:background .15s; position:relative; }
  .cal-cell:hover { background:#f0fdf4; }
  .cal-cell.closed { background:#f8f8f8; cursor:default; }
  .cal-cell.closed:hover { background:#f8f8f8; }
  .cal-cell.today-col { background:#fafffe; }

  .booking-pill { display:block; padding:5px 9px; border-radius:8px; font-size:12px; font-weight:700; margin-bottom:3px; cursor:pointer; transition:all .15s; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .booking-pill.booked { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
  .booking-pill.booked:hover { background:#10b981; color:white; }
  .booking-pill.completed { background:#dbeafe; color:#1e40af; border:1px solid #bfdbfe; }
  .booking-pill.cancelled { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; text-decoration:line-through; opacity:.6; }
  .booking-pill.pending { background:#fef3c7; color:#92400e; border:1px solid #fde68a; animation:pulse-pending 2s infinite; }
  @keyframes pulse-pending { 0%,100%{ box-shadow:none; } 50%{ box-shadow:0 0 8px rgba(251,191,36,.4); } }

  /* MONTH VIEW */
  .month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid #e2e8f0; border-radius:16px; overflow:hidden; background:white; }
  .month-header { background:#f8fafc; padding:11px 6px; text-align:center; font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:#64748b; border-bottom:2px solid #e2e8f0; border-right:1px solid #e2e8f0; }
  .month-header:last-child { border-right:none; }
  .month-cell { min-width:0; min-height:110px; border-bottom:1px solid #f1f5f9; border-right:1px solid #f1f5f9; padding:6px 8px; cursor:pointer; transition:background .15s; position:relative; overflow:hidden; }
  .month-cell:nth-child(7n) { border-right:none; }
  .month-cell:hover { background:#f0fdf4; }
  .month-cell.other-month { background:#fafafa; opacity:.4; }
  .month-cell.today { background:#ecfdf5; }
  .month-cell.past { opacity:.5; }
  .month-cell.closed { background:#f8f8f8; cursor:default; }
  .month-cell.closed:hover { background:#f8f8f8; }
  .month-day-num { font-size:16px; font-weight:900; color:#334155; margin-bottom:3px; }
  .month-cell.today .month-day-num { color:#065f46; background:#10b981; color:white; display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:15px; }

  .cal-header.holiday { background:#fef2f2; color:#dc2626; border-bottom-color:#fca5a5; }
  .cal-cell.holiday-col { background:#fffbfb; }
  .holiday-tag { display:inline-block; background:#fee2e2; color:#dc2626; font-size:10px; font-weight:900; padding:2px 7px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em; margin-top:3px; line-height:1.3; }
  .month-cell.holiday { background:#fef2f2; }
  .month-holiday-tag { display:block; font-size:10px; font-weight:700; color:#dc2626; line-height:1.2; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* DATE OVERRIDE (operator can manually open/close any day) */
  .override-banner { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-radius:14px; margin-bottom:14px; color:white; font-weight:700; flex-wrap:wrap; }
  .override-banner.open { background:linear-gradient(135deg,#059669,#10b981); }
  .override-banner.closed { background:linear-gradient(135deg,#dc2626,#ef4444); }
  .override-banner.default-closed { background:linear-gradient(135deg,#f59e0b,#fbbf24); color:#1e293b; }
  .override-banner.fully-booked { background:linear-gradient(135deg,#b45309,#f59e0b); }
  .override-banner-text { font-size:13px; line-height:1.4; flex:1; min-width:200px; }
  .override-banner-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .override-banner select { background:white; color:#1e293b; font-weight:700; font-size:11px; padding:7px 10px; border-radius:8px; border:none; font-family:'Outfit',sans-serif; cursor:pointer; }
  .override-btn { background:white; color:#1e293b; font-weight:900; font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; border-radius:999px; border:none; cursor:pointer; transition:transform .15s,box-shadow .15s; font-family:'Outfit',sans-serif; }
  .override-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .override-btn.danger { background:#1e293b; color:white; }
  .override-notes { width:100%; display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-top:6px; align-items:end; }
  @media (max-width: 640px) { .override-notes { grid-template-columns:1fr; } }
  .override-notes label { display:flex; flex-direction:column; gap:3px; font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; opacity:.9; }
  .override-notes textarea { background:white; color:#1e293b; font-weight:600; font-size:12px; padding:8px 10px; border-radius:8px; border:none; font-family:'Outfit',sans-serif; resize:vertical; min-height:38px; max-height:120px; line-height:1.35; }
  .override-badge { position:absolute; top:3px; right:3px; font-size:7px; font-weight:900; padding:2px 5px; border-radius:5px; letter-spacing:.04em; text-transform:uppercase; line-height:1; z-index:2; }
  .override-badge.open { background:#10b981; color:white; }
  .override-badge.closed { background:#ef4444; color:white; }
  .override-badge.full { background:#f59e0b; color:white; }
  .month-cell.override-open { background:#ecfdf5 !important; }
  .month-cell.override-closed { background:#fef2f2 !important; }
  .month-cell.override-full { background:#fef3c7 !important; }
  .month-cell .full-remark { font-size:8px; font-weight:700; color:#7c2d12; line-height:1.2; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .day-count { display:inline-flex; align-items:center; justify-content:center; background:#10b981; color:white; font-size:11px; font-weight:900; min-width:22px; height:22px; border-radius:11px; padding:0 6px; margin-left:5px; }

  /* MOBILE DAY VIEW */
  .tab-row { display:flex; gap:4px; background:#e2e8f0; border-radius:14px; padding:4px; overflow-x:auto; }
  .tab-btn { flex:1; padding:11px 8px; border:none; background:none; border-radius:10px; font-size:12px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; color:#64748b; text-transform:uppercase; letter-spacing:.06em; transition:all .2s; white-space:nowrap; min-width:48px; }
  .tab-btn.active { background:white; color:#065f46; box-shadow:0 2px 8px rgba(0,0,0,.08); }

  .mobile-slot { display:flex; align-items:flex-start; gap:12px; padding:14px; border-bottom:1px solid #f1f5f9; cursor:pointer; transition:background .15s; }
  .mobile-slot:hover { background:#f0fdf4; }
  .mobile-slot:last-child { border-bottom:none; }
  .mobile-slot.closed { opacity:.4; cursor:default; }
  .mobile-slot.closed:hover { background:transparent; }

  /* TIME SLOT PICKER (booking modal) */
  .time-slot-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px; border-bottom:1px solid #f1f5f9; cursor:pointer; transition:background .15s; background:white; }
  .time-slot-row:hover { background:#f0fdf4; }
  .time-slot-row:last-child { border-bottom:none; }
  .time-slot-row.full-slot { background:#fef2f2; cursor:default; opacity:.55; }
  .time-slot-row.full-slot:hover { background:#fef2f2; }
  .time-slot-row.selected { background:#10b981; color:white; }
  .time-slot-row.selected .ts-meta { color:#d1fae5; }
  .ts-time { font-size:15px; font-weight:900; color:#1e293b; }
  .time-slot-row.selected .ts-time { color:white; }
  .ts-meta { font-size:12px; font-weight:700; color:#64748b; }
  .slot-full { background:#fee2e2; color:#991b1b; font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; display:inline-block; }
  .slot-busy { background:#ecfdf5; color:#065f46; font-size:11px; font-weight:600; padding:2px 8px; border-radius:8px; display:inline-block; }
  .slot-available { color:#10b981; font-size:12px; font-weight:700; }
  .est-box { background:#eff6ff; border:1.5px solid #bfdbfe; border-radius:14px; padding:12px 16px; }
  .est-box.warn { background:#fef2f2; border-color:#fecaca; }

  /* AL SEARCH DROPDOWN */
  .al-dropdown { position:absolute; left:0; right:0; top:100%; background:white; border:2px solid #e2e8f0; border-top:none; border-radius:0 0 14px 14px; max-height:240px; overflow-y:auto; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.1); }
  .al-dropdown-item { padding:12px 16px; cursor:pointer; font-size:15px; font-weight:600; transition:background .1s; }
  .al-dropdown-item:hover { background:#ecfdf5; }
  .al-dropdown-item .al-num { font-weight:900; color:#065f46; }
  .al-dropdown-item .al-cust { color:#64748b; font-size:14px; }

  /* WEATHER STRIP (7-Day Forecast) */
  .weather-strip { display:flex; gap:6px; overflow-x:auto; padding:2px 0; scrollbar-width:none; }
  .weather-strip::-webkit-scrollbar { display:none; }
  .weather-day { flex:1 1 0; min-width:74px; background:white; border:1.5px solid #e2e8f0; border-radius:12px; padding:8px 6px; text-align:center; transition:all .2s; }
  .weather-day.today { border-color:#10b981; background:#ecfdf5; }
  .weather-day-name { font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; }
  .weather-day.today .weather-day-name { color:#065f46; }
  .weather-day-icon { font-size:1.4rem; margin:3px 0 1px; line-height:1; }
  .weather-day-temp { font-size:11px; font-weight:900; color:#1e293b; }
  .weather-day-rain { font-size:9px; font-weight:700; color:#3b82f6; margin-top:1px; }
  .weather-day-rain.high { color:#ef4444; }
  .weather-day-desc { font-size:8px; font-weight:700; color:#94a3b8; margin-top:1px; line-height:1.2; }
</style>
</head>
<body class="fade-enter">

<!-- TOP NAV (operation module style) -->
<div class="bg-white border-b border-slate-200 px-5 py-3 flex justify-between items-center sticky top-0 z-30 shadow-sm">
  <div class="flex items-center gap-3">
    <button onclick="window.location.href='operation_stock_sales.html'" class="text-[10px] font-bold text-slate-500 hover:text-blue-700 uppercase tracking-widest bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-sm border-none cursor-pointer">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to sales page
    </button>
    <span class="font-black text-slate-800 uppercase tracking-widest text-xs hidden sm:inline">Collection Time Slot Booking</span>
  </div>
  <div class="flex items-center gap-3">
    <span id="user-label" class="text-xs font-bold text-slate-400 hidden md:block"></span>
    <button id="logout-btn" class="text-[10px] font-bold text-slate-500 hover:text-red-500 uppercase tracking-widest bg-slate-50 px-4 py-2 rounded-full border border-slate-200 cursor-pointer transition-colors">Sign Out</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="max-w-[1200px] mx-auto px-4 sm:px-6 py-6 space-y-4">

  <!-- Weather Forecast (7-Day, Miri) -->
  <div class="dash-card p-4" id="weather-card" style="display:none;">
    <div class="flex items-center gap-2 mb-2">
      <svg class="w-4 h-4 text-blue-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 0 0 4 4h9a5 5 0 1 0-.1-9.999 5.002 5.002 0 1 0-9.78 2.096A4.001 4.001 0 0 0 3 15z"/></svg>
      <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Miri 7-Day Weather Forecast</span>
    </div>
    <div class="weather-strip" id="weather-strip"></div>
  </div>

  <!-- Nav bar -->
  <div class="dash-card p-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <button onclick="changePeriod(-1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-emerald-100 flex items-center justify-center text-slate-500 hover:text-emerald-700 font-black text-lg cursor-pointer transition-colors border-none">&lsaquo;</button>
      <div class="text-sm font-black text-slate-800 uppercase tracking-wide" id="period-label">&mdash;</div>
      <button onclick="changePeriod(1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-emerald-100 flex items-center justify-center text-slate-500 hover:text-emerald-700 font-black text-lg cursor-pointer transition-colors border-none">&rsaquo;</button>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="goToday()" class="text-[10px] font-black text-emerald-700 uppercase tracking-widest bg-emerald-50 hover:bg-emerald-100 px-4 py-2 rounded-xl border border-emerald-200 cursor-pointer transition-colors">Today</button>
    </div>
  </div>

  <!-- Month View -->
  <div class="dash-card p-0 overflow-x-auto" id="month-cal" style="display:block;">
    <div id="month-grid"></div>
  </div>

</div>

<!-- BOOKING MODAL — New / Edit -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal-box">

    <div style="background:linear-gradient(135deg,#064e3b,#065f46);" class="p-6 rounded-t-[24px] flex justify-between items-start">
      <div>
        <div class="text-base font-black text-emerald-300 uppercase tracking-widest mb-1">&#128197; Collection Time Slot Booking</div>
      </div>
      <button onclick="closeBookingModal()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white font-black text-lg flex items-center justify-center transition-colors shrink-0 ml-4">&times;</button>
    </div>

    <div class="p-5 sm:p-6 space-y-4">

      <input id="bk-date" type="hidden">
      <div id="bk-date-label" class="text-sm font-black text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">&mdash;</div>

      <!-- STEP 1 — AL Search -->
      <div>
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Step 1 &mdash; Search customer / order *</label>
        <div class="relative" id="al-search-wrap">
          <input id="bk-al-search" type="text" class="search-input text-sm" style="padding:10px 14px;" placeholder="Search order number, AL number or customer name..." autocomplete="off" oninput="searchAL(this.value)" onfocus="searchAL(this.value)">
          <div class="al-dropdown hidden" id="al-dropdown"></div>
        </div>
      </div>

      <!-- Selected AL info -->
      <div id="bk-al-info" class="hidden">
        <div class="grid grid-cols-2 gap-3" id="bk-al-details"></div>
      </div>

      <!-- STEP 2 — Time slot list (revealed after AL selected) -->
      <div id="bk-time-wrap" class="hidden">
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Step 2 &mdash; Pick a time slot *</label>
        <div class="rounded-xl border border-slate-200 overflow-hidden" id="bk-time-slots-list"></div>
        <input id="bk-time" type="hidden">
      </div>

      <!-- STEP 3 — Quantity + capacity analysis -->
      <div id="bk-qty-wrap" class="hidden">
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Step 3 &mdash; Collection quantity *</label>
        <div class="flex flex-wrap gap-2 mb-3">
          <button class="qty-btn bk-qty-btn" onclick="selectBkQty(50)">+50</button>
          <button class="qty-btn bk-qty-btn" onclick="selectBkQty(100)">+100</button>
          <button class="qty-btn bk-qty-btn" onclick="selectBkQty(500)">+500</button>
          <button class="qty-btn bk-qty-btn" onclick="selectBkQty(1000)">+1,000</button>
          <input id="bk-qty" type="number" min="1" class="search-input text-sm" style="padding:10px 14px; width:130px;" placeholder="Custom qty" oninput="selectBkCustomQty()">

async function loadDateOverrides() {
  try {

    (data || []).forEach(function(o) { dateOverrides[o.date_str] = o; });

function getDefaultClosedReason(ds) {
  var d = new Date(ds + 'T00:00:00');
  if (d.getDay() === 0) return 'Sunday';
  if (MY_HOLIDAYS[ds]) return MY_HOLIDAYS[ds];
  return null;
}

function isEffectivelyClosed(ds) {
  var ovr = dateOverrides[ds];
  if (ovr) return !ovr.is_open;
  return !!getDefaultClosedReason(ds);
}

function getEffectiveHours(ds) {
  var ovr = dateOverrides[ds];
  if (ovr) {
    if (!ovr.is_open) return [];
    var arr = [];
    for (var h = ovr.open_hour; h < ovr.close_hour; h++) arr.push(h);
    return arr;
  }
  var d = new Date(ds + 'T00:00:00'), dow = d.getDay();
  if (dow === 0 || MY_HOLIDAYS[ds]) return [];
  return dow === 6 ? HOURS_SAT : HOURS_WEEKDAY;
}

async function applyDateOverride(isOpen, openHour, closeHour) {
  if (!dayModalDate) return;
  var ds = dayModalDate;
  var existing = dateOverrides[ds] || {};
  // Switching open/closed always wipes the fully-booked flag — it only
  // applies to the "open but blocked" state and re-flipping the day
  // shouldn't surprise the next operator with a stale block.
  var record = { date_str: ds, is_open: isOpen, is_fully_booked: false };
  if (isOpen) {
    record.open_hour = openHour;
    record.close_hour = closeHour;
    record.note = 'Override open: ' + formatHour(openHour) + '-' + formatHour(closeHour);
    // Opening the day — close-day remarks no longer apply
    record.external_note = null;
    record.internal_note = null;
  } else {
    record.open_hour = null;
    record.close_hour = null;
    record.note = 'Manual closure';
    // Preserve any remark already typed into the banner inputs;
    // otherwise carry over what was previously saved.
    var extEl = document.getElementById('ovr-ext-note');
    var intEl = document.getElementById('ovr-int-note');
    record.external_note = extEl ? (extEl.value.trim() || null) : (existing.external_note || null);
    record.internal_note = intEl ? (intEl.value.trim() || null) : (existing.internal_note || null);
  }
  var { error } = await _supabase.from('shared_date_overrides').upsert(record);
  if (error) { showToast('❌ ' + error.message); return; }
  dateOverrides[ds] = record;
  showToast(isOpen ? '✅ Opened ' + formatHour(openHour) + ' – ' + formatHour(closeHour) : '🚫 Closed for collection');
  renderCalendar();
  renderBoard();
}

// Flip the "fully booked" admin flag for a day that is (or becomes) open.
// The day stays in-hours so the operations team can still record any
// late-arriving manual bookings; customers see the calendar as amber
// "Fully Booked" with the external_note remark and can't open the time
// modal. Hours default to the existing override or the calendar default
// so we never end up with is_open=true and no hours set.
async function applyFullyBookedFlag(flag) {
  if (!dayModalDate) return;
  var ds = dayModalDate;
  var existing = dateOverrides[ds] || {};
  var defaultReason = getDefaultClosedReason(ds);
  if (flag && defaultReason && !existing.is_open) {
    // A default-closed day (Sunday / holiday) can't be "fully booked"
    // without first being explicitly opened. Surface a clear instruction
    // rather than silently flipping to is_open=true with no hours.
    showToast('⚠ Open this day first, then mark it Fully Booked');
    return;
  }
  var d = new Date(ds + 'T00:00:00');
  var defOpen = existing.open_hour || (d.getDay() === 6 ? 8 : 8);
  var defClose = existing.close_hour || (d.getDay() === 6 ? 12 : 17);
  // Preserve any remark currently in the banner inputs (the operator may
  // have just typed one and clicked Mark Fully Booked without saving).
  var extEl = document.getElementById('ovr-ext-note');
  var intEl = document.getElementById('ovr-int-note');
  var ext = extEl ? (extEl.value.trim() || null) : (existing.external_note || null);
  var intl = intEl ? (intEl.value.trim() || null) : (existing.internal_note || null);
  var record = {
    date_str: ds,
    is_open: true,
    is_fully_booked: !!flag,
    open_hour: defOpen,
    close_hour: defClose,
    note: flag ? 'Marked fully booked' : 'Cleared fully-booked flag',
    external_note: flag ? ext : null,
    internal_note: flag ? intl : null,

  var { error } = await _supabase.from('shared_date_overrides').delete().eq('date_str', ds);
  if (error) { showToast('❌ ' + error.message); return; }
  delete dateOverrides[ds];
  showToast('↩ Reverted to default');
  renderCalendar();
  renderBoard();
}

function saveOverrideOpen() {
  var oh = parseInt(document.getElementById('ovr-open-h').value);
  var ch = parseInt(document.getElementById('ovr-close-h').value);
  if (ch <= oh) { showToast('❌ Close time must be after open time'); return; }
  applyDateOverride(true, oh, ch);
}

function buildHourOptions(selected) {
  var opts = '';
  for (var h = 6; h <= 20; h++) {
    opts += '<option value="' + h + '"' + (h === selected ? ' selected' : '') + '>' + formatHour(h) + '</option>';
  }
  return opts;
}

function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function buildCloseNotesHtml(ds, mode) {
  // mode: 'closed' (default) — saving writes is_open=false
  //       'fullybooked'      — saving writes is_open=true + is_fully_booked=true
  // The inputs and IDs are shared between modes so the existing edit/lock
  // behaviour (enableCloseNotesEdit) works for both without duplicate code.
  mode = mode || 'closed';
  var ovr = dateOverrides[ds] || {};
  var ext = escAttr(ovr.external_note || '');
  var intl = escAttr(ovr.internal_note || '');
  var hasSaved = !!(ovr.external_note || ovr.internal_note);
  var lockedAttrs = hasSaved ? ' readonly style="background:#f1f5f9;color:#475569;"' : '';
  var btnLabel = hasSaved ? '✏️ Edit Remark' : '💾 Save Remark';
  var btnStyle = hasSaved ? 'background:#065f46;color:white;' : '';
  var saveCall = (mode === 'fullybooked') ? 'saveFullyBookedNotes()' : 'saveCloseNotes()';
  var btnOnclick = hasSaved ? "enableCloseNotesEdit('" + mode + "')" : saveCall;
  var statusStyle = 'font-size:10px;font-weight:700;opacity:.85;margin-top:4px;display:' + (hasSaved ? 'block' : 'none') + ';';
  var statusText = hasSaved ? '✓ Saved' : '';
  var extPlaceholder = (mode === 'fullybooked')
    ? 'e.g. Fully booked — next available slot Wednesday'
    : 'e.g. Annual stock-take — collections resume Monday';
  var intPlaceholder = (mode === 'fullybooked')
    ? 'e.g. All seedlings reserved for school programme'
    : 'e.g. Closed by Boss — Andy handling Mon reopen';
  return '<div class="override-notes">' +
           '<label>External remark (customers see this)' +
             '<textarea id="ovr-ext-note" placeholder="' + extPlaceholder + '"' + lockedAttrs + '>' + ext + '</textarea>' +
           '</label>' +
           '<label>Internal remark (operations only)' +
             '<textarea id="ovr-int-note" placeholder="' + intPlaceholder + '"' + lockedAttrs + '>' + intl + '</textarea>' +
           '</label>' +
           '<button id="ovr-notes-save-btn" class="override-btn" style="' + btnStyle + '" onclick="' + btnOnclick + '">' + btnLabel + '</button>' +
         '</div>' +
         '<div id="ovr-notes-status" style="' + statusStyle + '">' + statusText + '</div>';
}

function buildOverrideBanner(ds) {
  if (!ds) return '';
  var defaultReason = getDefaultClosedReason(ds);
  var override = dateOverrides[ds];
  var statusCls, statusText, controls;
  var showNotes = false;
  var notesMode = 'closed';

  if (override && override.is_open && override.is_fully_booked) {
    // Open hours stand, but every customer slot is administratively
    // blocked. Operations can still record manual bookings; customers
    // see "Fully Booked" amber + remark on the calendar.
    statusCls = 'fully-booked';
    statusText = '🔒 <b>Fully Booked</b> — open ' + formatHour(override.open_hour) + ' – ' + formatHour(override.close_hour) + ', customer slots blocked';
    controls = '<button class="override-btn" onclick="applyFullyBookedFlag(false)">✅ Mark Available</button>' +
               '<button class="override-btn danger" onclick="applyDateOverride(false)">🚫 Close this Day</button>' +
               '<button class="override-btn" onclick="resetDateOverride()">↩ Reset</button>';
    showNotes = true;
    notesMode = 'fullybooked';
  } else if (override && override.is_open) {
    statusCls = 'open';
    statusText = '✅ <b>Override:</b> Open ' + formatHour(override.open_hour) + ' – ' + formatHour(override.close_hour) +
      (defaultReason ? ' <span style="opacity:.85;">(default: ' + defaultReason + ')</span>' : '');
    controls = '<select id="ovr-open-h">' + buildHourOptions(override.open_hour) + '</select>' +
               '<span style="color:white;font-weight:900;">→</span>' +
               '<select id="ovr-close-h">' + buildHourOptions(override.close_hour) + '</select>' +
               '<button class="override-btn" onclick="saveOverrideOpen()">Update Hours</button>' +
               '<button class="override-btn" onclick="applyFullyBookedFlag(true)">🔒 Mark Fully Booked</button>' +
               '<button class="override-btn danger" onclick="applyDateOverride(false)">🚫 Close</button>' +
               '<button class="override-btn" onclick="resetDateOverride()">↩ Reset</button>';
  } else if (override && !override.is_open) {
    statusCls = 'closed';
    statusText = '🚫 <b>Override:</b> Manually Closed' + (defaultReason ? '' : ' (was open by default)');
    controls = '<select id="ovr-open-h">' + buildHourOptions(8) + '</select>' +
               '<span style="color:white;font-weight:900;">→</span>' +
               '<select id="ovr-close-h">' + buildHourOptions(17) + '</select>' +
               '<button class="override-btn" onclick="saveOverrideOpen()">✅ Open</button>' +
               '<button class="override-btn" onclick="resetDateOverride()">↩ Reset</button>';
    showNotes = true;
  } else if (defaultReason) {
    statusCls = 'default-closed';
    statusText = '🚫 <b>Closed:</b> ' + defaultReason + ' (default)';
    controls = '<select id="ovr-open-h">' + buildHourOptions(8) + '</select>' +
               '<span style="font-weight:900;">→</span>' +
               '<select id="ovr-close-h">' + buildHourOptions(17) + '</select>' +
               '<button class="override-btn" onclick="saveOverrideOpen()">✅ Open this Day</button>';
    showNotes = true;
  } else {
    statusCls = 'open';
    var d = new Date(ds + 'T00:00:00');
    var defHrs = d.getDay() === 6 ? '8 AM – 12 PM' : '8 AM – 5 PM';
    statusText = '✅ <b>Open</b> (default ' + defHrs + ')';
    controls = '<button class="override-btn" onclick="applyFullyBookedFlag(true)">🔒 Mark Fully Booked</button>' +
               '<button class="override-btn danger" onclick="applyDateOverride(false)">🚫 Close this Day</button>';
  }

  return '<div class="override-banner ' + statusCls + '">' +
           '<div class="override-banner-text">' + statusText + '</div>' +
           '<div class="override-banner-actions">' + controls + '</div>' +
           (showNotes ? buildCloseNotesHtml(ds, notesMode) : '') +
         '</div>';
}

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HOURS_WEEKDAY = [8,9,10,11,12,13,14,15,16];
const HOURS_SAT = [8,9,10,11];

function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  dt.setHours(0,0,0,0);
  return dt;
}

function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function formatDateDisplay(d) {
  return d.toLocaleDateString('en-MY', { day:'2-digit', month:'short' });
}

function formatHour(h) {
  if (h === 0) return '12 AM';
  if (h < 12) return h + ' AM';
  if (h === 12) return '12 PM';
  return (h - 12) + ' PM';
}

function timeSlotLabel(h) {
  return formatHour(h) + ' - ' + formatHour(h + 1);
}

function isToday(d) {
  const today = new Date();
  return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
}

// Booking pills can be saved with an empty customer_name (e.g. when a
// customer self-books on the mobile app using only their order number).
// Prefer the booking's own customer_name; fall back to the linked AL's
// customer_name (lookup via al_number, then order_number); finally fall
// back to the order number / dash so the pill is never blank.
function bookingDisplayName(b) {
  if (b && b.customer_name) return b.customer_name;
  const ref = b && (b.al_number || b.order_number);
  const al = ref && alData.find(a => a.al_number === ref);
  if (al && al.customer_name) return al.customer_name;
  return (b && b.order_number) || '—';
}

function isPast(d) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const check = new Date(d);
  check.setHours(0,0,0,0);
  return check < today;
}

// CAPACITY CONFIG
var RATE = 350;              // seedlings processed per hour per booking
var MAX_LOAD_PER_HOUR = 600; // max total seedling load per hour

function hoursNeeded(qty) { return Math.ceil(qty / RATE); }
function hourlyLoad(qty) { var hrs = hoursNeeded(qty); return qty / hrs; }

function getBookingsFor(date, hour) {
  const ds = formatDate(date);
  return bookings.filter(b => {
    if ((b.booking_date || '').substring(0, 10) !== ds || b.status === 'cancelled') return false;
    var startH = parseInt((b.start_time || '00').split(':')[0]);
    var endH = parseInt((b.end_time || '00').split(':')[0]);
    if (endH <= startH) endH = startH + 1;
    return hour >= startH && hour < endH;
  });
}

function getHourLoad(date, hour) {
  var bks = getBookingsFor(date, hour);
  var total = 0;
  bks.forEach(b => { total += hourlyLoad(b.collection_qty || 0); });
  return total;
}

function isSlotFull(date, hour) {
  return getHourLoad(date, hour) >= MAX_LOAD_PER_HOUR;
}

function getDayBookedSlotCount(date) {
  const ds = formatDate(date);
  const dow = date.getDay();
  const hours = dow === 6 ? HOURS_SAT : HOURS_WEEKDAY;
  var count = 0;
  hours.forEach(h => { if (getBookingsFor(date, h).length > 0) count++; });
  return count;
}

function renderDesktop() {
  const grid = document.getElementById('cal-grid');

  html += '<div class="cal-header" style="border-right:1px solid #e2e8f0;">Time</div>';

    const holidayTag = holiday ? '<br><span class="holiday-tag">' + holiday + '</span>' : '';
    html += '<div class="cal-header' + todayCls + holidayCls + '" style="cursor:pointer;" onclick="openDayModal(\'' + formatDate(d) + '\')">' + DAYS[i] + '<br>' + formatDateDisplay(d) + countBadge + holidayTag + '</div>';
  }

  const allHours = HOURS_WEEKDAY;
  allHours.forEach(h => {
    html += '<div class="cal-time">' + formatHour(h) + '</div>';
    for (let i = 0; i < 6; i++) {
      const d = new Date(currentWeekStart);
      d.setDate(d.getDate() + i);
      const isSat = i === 5;
      const isClosed = isSat && h >= 12;
      const todayCls = isToday(d) ? ' today-col' : '';
      const holidayColCls = getHoliday(formatDate(d)) ? ' holiday-col' : '';
      const past = isPast(d);

      if (isClosed) {
        html += '<div class="cal-cell closed' + todayCls + '"><span class="text-[9px] font-bold text-slate-300">Closed</span></div>';
      } else {
        const cellBookings = getBookingsFor(d, h);
        const pills = cellBookings.map(b => {
          const cls = b.status === 'completed' ? 'completed' : b.status === 'cancelled' ? 'cancelled' : b.status === 'pending' ? 'pending' : 'booked';
          const pendingIcon = b.status === 'pending' ? '⏳ ' : '';
          const displayName = bookingDisplayName(b);
          const plotTag = b.plot_name ? ' · ' + b.plot_name : '';
          return '<div class="booking-pill ' + cls + '" onclick="event.stopPropagation();viewBooking(\'' + b.id + '\')" title="' + displayName + ' - ' + (b.al_number || '') + '" style="white-space:normal;line-height:1.3;">' +
            pendingIcon + displayName + ' (' + (b.collection_qty || 0) + ')' + plotTag +
          '</div>';
        }).join('');
        const clickAction = past ? '' : ' onclick="openNewBooking(\'' + formatDate(d) + '\',' + h + ')"';
        const pastCls = past ? ' opacity-50 cursor-default' : '';
        html += '<div class="cal-cell' + todayCls + holidayColCls + pastCls + '"' + clickAction + '>' + pills + '</div>';
      }
    }
  });

  grid.innerHTML = html;
}

function getMonthBookingsFor(dateStr) {

function renderMonth() {
  const container = document.getElementById('month-grid');
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  let startDow = firstDay.getDay();
  if (startDow === 0) startDow = 7;

  let html = '<div class="month-grid">';
  var dayHeaders = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  dayHeaders.forEach(function(d) {
    html += '<div class="month-header">' + d + '</div>';
  });

  var cellDate = new Date(firstDay);
  cellDate.setDate(cellDate.getDate() - (startDow - 1));

  for (var row = 0; row < 6; row++) {
    var hasContent = false;
    for (var col = 0; col < 7; col++) {
      var isThisMonth = cellDate.getMonth() === currentMonth;
      var isTodayCls = isToday(cellDate) ? ' today' : '';
      var pastCls = isPast(cellDate) ? ' past' : '';
      var otherCls = !isThisMonth ? ' other-month' : '';

      if (isThisMonth) hasContent = true;

      var ds = formatDate(cellDate);
      var bks = isThisMonth ? getMonthBookingsFor(ds) : [];
      var dayNum = cellDate.getDate();
      var defaultReason = getDefaultClosedReason(ds);
      var override = dateOverrides[ds];
      var isFullyBooked = !!(override && override.is_open && override.is_fully_booked);
      var effectivelyClosed = override ? !override.is_open : !!defaultReason;
      var closedCls = effectivelyClosed ? ' closed' : '';
      var holidayCls = (defaultReason && defaultReason !== 'Sunday') ? ' holiday' : '';
      var overrideCls = '';
      if (override) {
        overrideCls = isFullyBooked ? ' override-full' : (override.is_open ? ' override-open' : ' override-closed');
      }

      var overrideBadgeHtml = '';
      if (override) {
        var badgeCls = isFullyBooked ? 'full' : (override.is_open ? 'open' : 'closed');
        var badgeText = isFullyBooked ? '🔒 FULL' : (override.is_open ? '✓ OPEN' : '✗ CLOSED');
        overrideBadgeHtml = '<span class="override-badge ' + badgeCls + '">' + badgeText + '</span>';
      }

      var pillsHtml = '';
      if (defaultReason && defaultReason !== 'Sunday') {
        pillsHtml += '<div class="month-holiday-tag">' + defaultReason + '</div>';
      }
      // External remark on a fully-booked day — surface it on the cell so
      // operators don't have to open each day to see why a slot is blocked.
      if (isFullyBooked && override.external_note) {
        var safeNote = escAttr(String(override.external_note).trim());
        pillsHtml += '<div class="full-remark" title="' + safeNote + '">' + safeNote + '</div>';
      }
      bks.slice(0, 2).forEach(function(b) {
        var cls = b.status === 'completed' ? 'completed' : b.status === 'pending' ? 'pending' : 'booked';
        pillsHtml += '<div class="booking-pill ' + cls + '" style="font-size:9px;padding:2px 5px;" onclick="event.stopPropagation();openDayModal(\'' + ds + '\')">' +
          bookingDisplayName(b).substring(0, 10) + ' (' + (b.collection_qty || 0) + ')</div>';
      });
      if (bks.length > 2) {
        pillsHtml += '<div class="text-[9px] font-bold text-slate-400 cursor-pointer" onclick="event.stopPropagation();openDayModal(\'' + ds + '\')">+' + (bks.length - 2) + ' more</div>';
      }

      var clickAction = '';
      if (isThisMonth && !isPast(cellDate)) {
        clickAction = ' onclick="openDayModal(\'' + ds + '\')"';
      }

      html += '<div class="month-cell' + isTodayCls + pastCls + otherCls + closedCls + holidayCls + overrideCls + '"' + clickAction + '>' +
        overrideBadgeHtml +
        '<div class="month-day-num">' + dayNum + '</div>' +
        pillsHtml +
      '</div>';

      cellDate.setDate(cellDate.getDate() + 1);
    }
    if (!hasContent && row > 4) break;
  }

  html += '</div>';
  container.innerHTML = html;
}

// NEW BOOKING MODAL — progressive flow:
//  AL search -> time slot pick -> qty + analysis -> nursery + plot -> save
let bookingQty = 0;
let bookingTime = null;
let bookingDayBookings = [];

function closingHour(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  if (dow === 0) return 0;
  return dow === 6 ? 12 : 17;
}

function bkCanFit(dateStr, startH, qty) {
  return (startH + hoursNeeded(qty)) <= closingHour(dateStr);

async function openNewBooking(dateStr) {

function renderBkTimeSlots() {
  const dateStr = document.getElementById('bk-date').value;
  if (!dateStr) return;
  const d = new Date(dateStr + 'T00:00:00');
  const isSat = d.getDay() === 6;
  const hours = isSat ? HOURS_SAT : HOURS_WEEKDAY;
  const cl = closingHour(dateStr);
  const isToday = dateStr === formatDate(new Date());
  const nowH = isToday ? new Date().getHours() : -1;

  const list = document.getElementById('bk-time-slots-list');
  list.innerHTML = hours.map(h => {
    const timeStr = String(h).padStart(2,'0') + ':00';
    const slotBks = bookingDayBookings.filter(b => {
      const sH = parseInt((b.start_time || '00').substring(0,2));
      const eH = parseInt((b.end_time   || '00').substring(0,2));
      return h >= sH && h < eH;
    });
    const past = h <= nowH;
    const closed = (h >= cl);
    const full = past || closed;
    const meta = past ? 'Past hour'
               : closed ? 'After closing'
               : slotBks.length === 0 ? '<span class="slot-available">Open</span>'
               : '<span class="slot-busy">' + slotBks.length + ' booked</span>';
    const click = full ? '' : ' onclick="selectBkTimeSlot(\'' + timeStr + '\')"';
    return '<div class="time-slot-row' + (full ? ' full-slot' : '') + '" data-time="' + timeStr + '"' + click + '>' +
             '<div><div class="ts-time">' + timeSlotLabel(h) + '</div></div>' +
             '<div class="ts-meta">' + meta + '</div>' +
           '</div>';
  }).join('');
}

function updateBkAnalysis() {
  const wrap = document.getElementById('bk-analysis');
  if (!bookingQty || !bookingTime) { wrap.classList.add('hidden'); return; }
  const dateStr = document.getElementById('bk-date').value;
  const startH = parseInt(bookingTime.split(':')[0]);
  const hrs = hoursNeeded(bookingQty);
  const endH = startH + hrs;
  const cl = closingHour(dateStr);
  const fits = endH <= cl;

  let html;
  if (fits) {
    html = '<div class="est-box">' +
           '<div class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-1">⏱ Estimated collection time</div>' +
           '<div class="text-base font-black text-blue-800">' + bookingQty.toLocaleString() + ' seedlings → ' + hrs + ' hr (≈ ' + RATE.toLocaleString() + '/hr)</div>' +
           '<div class="text-xs font-bold text-blue-700 mt-1">' + formatHour(startH) + ' → ' + formatHour(endH) + ' — closes at ' + formatHour(cl) + '</div>' +
           '</div>';
  } else {
    const overflowHrs = endH - cl;
    html = '<div class="est-box warn">' +
           '<div class="text-[10px] font-black text-red-700 uppercase tracking-widest mb-1">⚠️ Quantity exceeds slot</div>' +
           '<div class="text-base font-black text-red-800">' + bookingQty.toLocaleString() + ' seedlings need ' + hrs + ' hr (' + overflowHrs + ' hr past closing)</div>' +
           '<div class="text-xs font-bold text-red-700 mt-1">Pick an earlier time, reduce qty, or split the booking.</div>' +
           '</div>';
  }
  wrap.innerHTML = html;
  wrap.classList.remove('hidden');

  document.getElementById('bk-nursery-wrap').classList.toggle('hidden', !fits);
  document.getElementById('bk-notes-wrap').classList.toggle('hidden', !fits);
}

function checkBookingReady() {
  const dateStr = document.getElementById('bk-date').value;
  const hasAL = !!selectedAL;
  const hasTime = !!bookingTime;
  const hasQty = bookingQty > 0 && bookingQty <= (selectedAL?.balance_quantity || 0);
  const fits = hasTime && hasQty && bkCanFit(dateStr, parseInt(bookingTime.split(':')[0]), bookingQty);
  const hasNursery = !!document.getElementById('bk-nursery').value;
  const hasPlot = !!document.getElementById('bk-plot').value;
  document.getElementById('bk-submit-btn').disabled = !(hasAL && hasTime && hasQty && fits && hasNursery && hasPlot);

async function submitBooking() {
  if (!selectedAL || bookingQty <= 0) return;
  const btn = document.getElementById('bk-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  if (bookingQty > (selectedAL.balance_quantity || 0)) {
    showToast('⚠️ Qty exceeds balance');
    btn.disabled = false;
    btn.textContent = '📅 Confirm Booking';
    return;
  }

  const timeVal = bookingTime || document.getElementById('bk-time').value;
  if (!timeVal) {
    showToast('⚠️ Please pick a time slot');
    btn.disabled = false;
    btn.textContent = '📅 Confirm Booking';
    return;
  }
  const startH = parseInt(timeVal.split(':')[0]);

  const hrs = hoursNeeded(bookingQty);
  const endH = startH + hrs;

  const payload = {
    al_number:      selectedAL.al_number,
    order_number:   selectedAL.order_number || '',
    customer_name:  selectedAL.customer_name || '',
    collection_qty: bookingQty,
    booking_date:   document.getElementById('bk-date').value,
    start_time:     timeVal,
    end_time:       String(endH).padStart(2,'0') + ':00',
    status:         'booked',
    nursery_name:   document.getElementById('bk-nursery').value.trim() || null,
    plot_name:      document.getElementById('bk-plot').value.trim() || null,
    notes:          document.getElementById('bk-notes').value.trim() || null,
  };

  const { error } = await _supabase.from('shared_collection_bookings').insert([payload]);
  if (error) {
    showToast('❌ ' + error.message);
    btn.disabled = false;
    btn.textContent = '📅 Confirm Booking';
    return;
  }

  showToast('✅ Booking confirmed for ' + selectedAL.customer_name);
  btn.textContent = '📅 Confirm Booking';
  closeBookingModal();
  await reloadCurrentView();
}

// RELOAD HELPER
function populateNurseryPlotSelects() {
  var nurseryHtml = '<option value="">— Select Nursery —</option>';
  var plotHtml = '<option value="">— Select Plot —</option>';
  var seenNursery = {};
  var sortedNurseries = [];
  plotsData.forEach(function(p) {
    if (p.nursery_name && !seenNursery[p.nursery_name]) {
      seenNursery[p.nursery_name] = true;
      sortedNurseries.push(p.nursery_name);
    }
  });
  sortedNurseries.sort(function(a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); });
  sortedNurseries.forEach(function(n) {
    nurseryHtml += '<option value="' + n + '">' + n + '</option>';
  });
  var sortedPlots = plotsData.filter(function(p) { return !!p.plot_name; })
    .sort(function(a, b) { return a.plot_name.localeCompare(b.plot_name, undefined, { numeric: true, sensitivity: 'base' }); });
  sortedPlots.forEach(function(p) {
    plotHtml += '<option value="' + p.plot_name + '">' + p.plot_name + '</option>';
  });
  ['bk-nursery', 'det-nursery'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = nurseryHtml;
  });
  ['bk-plot', 'det-plot'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = plotHtml;
  });
}

function filterPlots(nurserySelectId, plotSelectId) {
  var selectedNursery = document.getElementById(nurserySelectId).value;
  var plotEl = document.getElementById(plotSelectId);
  var html = '<option value="">— Select Plot —</option>';
  var filtered = plotsData.filter(function(p) {
    return p.plot_name && (!selectedNursery || p.nursery_name === selectedNursery);
  }).sort(function(a, b) {
    return a.plot_name.localeCompare(b.plot_name, undefined, { numeric: true, sensitivity: 'base' });
  });
  filtered.forEach(function(p) {
    html += '<option value="' + p.plot_name + '">' + p.plot_name + '</option>';
  });
  plotEl.innerHTML = html;
}

async function openDayModal(ds) {
  dayModalDate = ds;
  var d = new Date(ds + 'T00:00:00');
  var dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('day-modal-title').textContent =
    dayNames[d.getDay()] + ', ' + d.toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' });

  document.getElementById('day-board-area').innerHTML =
    '<div class="text-center py-8 text-slate-300 text-xs font-bold uppercase tracking-widest">Loading…</div>';
  document.getElementById('day-modal').classList.add('open');

  var { data } = await _supabase.from('shared_collection_bookings').select('*')
    .eq('booking_date', ds).neq('status', 'cancelled').order('start_time', { ascending: true });
  dayBookings = data || [];
  renderBoard();
}

function closeDayModal() {
  document.getElementById('day-modal').classList.remove('open');
  dayModalDate = null;
}

function openNewBookingFromDay() {
  var ds = dayModalDate;
  closeDayModal();
  openNewBooking(ds, 8);
}

function getNurseryList() {
  var names = [];
  var seen = {};
  plotsData.forEach(function(p) {
    if (p.nursery_name && !seen[p.nursery_name]) {
      seen[p.nursery_name] = true;
      names.push(p.nursery_name);
    }
  });
  return names.slice(0, 3);
}

function renderBoard() {
  var area = document.getElementById('day-board-area');
  var nurseries = getNurseryList();

  var columns = [{ id: 'pending', label: '⏳ Pending', type: 'pending' }];
  nurseries.forEach(function(n) {
    columns.push({ id: 'nursery-' + n.replace(/[^a-zA-Z0-9]/g, '_'), label: '🌱 ' + n, type: 'nursery', nurseryName: n });
  });

  var html = buildOverrideBanner(dayModalDate);
  html += '<div class="alloc-board">';
  columns.forEach(function(col) {
    var colBookings = dayBookings.filter(function(b) {
      if (col.type === 'pending') return !b.nursery_name || b.nursery_name === '' || b.nursery_name === 'PENDING';
      return b.nursery_name === col.nurseryName;
    });

    colBookings.sort(function(a, b) {
      return (a.start_time || '').localeCompare(b.start_time || '');
    });

    var totalQty = colBookings.reduce(function(sum, b) { return sum + (b.collection_qty || 0); }, 0);

    var colCls = col.type === 'pending' ? 'pending' : 'nursery';
    html += '<div class="alloc-col ' + colCls + '" id="col-' + col.id + '" ' +
      'ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ' +
      'ondrop="boardDrop(event,\'' + (col.nurseryName || '') + '\')">';
    html += '<div class="alloc-col-header">' + col.label + '<span class="alloc-count">(' + colBookings.length + ')</span></div>';
    if (totalQty > 0) {
      html += '<div class="text-center font-black mb-2 px-3 py-2 rounded-lg ' +
        (col.type === 'pending' ? 'text-amber-700 bg-amber-50' : 'text-blue-700 bg-blue-50') +
        '"><div class="text-lg">' + totalQty.toLocaleString() + '</div><div class="text-[9px] uppercase tracking-widest">seedlings</div></div>';
    }

    var lastTimeLabel = '';
    colBookings.forEach(function(b) {
      var startH = parseInt((b.start_time || '08').split(':')[0]);
      var endH = parseInt((b.end_time || '09').split(':')[0]);
      var timeLabel = formatHour(startH) + ' – ' + formatHour(endH);

      if (timeLabel !== lastTimeLabel) {
        html += '<div class="text-[8px] font-black text-slate-400 uppercase tracking-widest px-2 py-1 mt-1 bg-slate-100 rounded-md">⏰ ' + timeLabel + '</div>';
        lastTimeLabel = timeLabel;
      }

      var statusCls = b.status === 'pending' ? 'status-pending' : 'status-booked';
      var plotOptions = '<option value="">— Assign Plot —</option>';
      var filterNursery = col.type === 'nursery' ? col.nurseryName : null;
      var filteredPlots = plotsData.filter(function(p) {
        return p.plot_name && (!filterNursery || p.nursery_name === filterNursery);
      }).sort(function(a, b) {
        return a.plot_name.localeCompare(b.plot_name, undefined, { numeric: true, sensitivity: 'base' });
      });
      filteredPlots.forEach(function(p) {
          var sel = (b.plot_name === p.plot_name) ? ' selected' : '';
          plotOptions += '<option value="' + p.plot_name + '"' + sel + '>' + p.plot_name + '</option>';
      });

      html += '<div class="alloc-card ' + statusCls + '" draggable="true" ' +
        'ondragstart="boardDragStart(event,\'' + b.id + '\')" ' +
        'id="card-' + b.id + '" style="position:relative;">';
      html += '<button onclick="event.stopPropagation();cancelFromBoard(\'' + b.id + '\')" style="position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:9px;border:none;background:#fee2e2;color:#dc2626;font-size:11px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .15s;" onmouseover="this.style.background=\'#dc2626\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'#fee2e2\';this.style.color=\'#dc2626\'">&times;</button>';
      html += '<div class="card-name" style="padding-right:22px;cursor:pointer;" onclick="viewBooking(\'' + b.id + '\')">' + (b.customer_name || '—') + '</div>';
      html += '<div class="flex justify-between items-center mt-1">';
      html += '<span class="card-qty">' + (b.collection_qty || 0).toLocaleString() + ' seedlings</span>';
      html += '<span class="card-detail">' + (b.al_number && b.al_number !== 'PENDING' ? b.al_number : '') + '</span>';
      html += '</div>';
      html += '<div class="mt-2" onclick="event.stopPropagation();">';
      html += '<select onchange="updatePlotFromBoard(\'' + b.id + '\',this.value)" ' +
        'style="width:100%;padding:5px 8px;font-size:10px;font-weight:700;font-family:Outfit,sans-serif;border:1.5px solid #e2e8f0;border-radius:8px;background:#f8fafc;color:#334155;cursor:pointer;outline:none;" ' +
        'onfocus="this.style.borderColor=\'#10b981\'" onblur="this.style.borderColor=\'#e2e8f0\'">' +
        plotOptions + '</select>';
      html += '</div>';
      if (b.plot_name) {
        html += '<div class="text-[9px] font-bold text-emerald-600 mt-1">📍 ' + b.plot_name + '</div>';
      }
      if (b.status === 'pending') {
        html += '<div class="text-[9px] font-black text-amber-600 mt-1">⚠️ Awaiting confirmation</div>';
      }
      html += '</div>';
    });

    if (colBookings.length === 0) {
      html += '<div class="text-center py-6 text-slate-300 text-[10px] font-bold uppercase tracking-widest">Drop here</div>';
    }

    html += '</div>';
  });
  html += '</div>';

  area.innerHTML = html;
}

async function updatePlotFromBoard(id, plotName) {
  var { error } = await _supabase.from('shared_collection_bookings').update({ plot_name: plotName || null }).eq('id', id);
  if (error) { showToast('❌ ' + error.message); return; }
  var bk = dayBookings.find(function(b) { return b.id === id; });
  if (bk) bk.plot_name = plotName || null;
  showToast('✅ Plot updated' + (plotName ? ': ' + plotName : ''));
  renderBoard();
}

async function cancelFromBoard(id) {
  if (!confirm('Cancel this booking?')) return;
  var { error } = await _supabase.from('shared_collection_bookings').update({ status: 'cancelled' }).eq('id', id);
  if (error) { showToast('❌ ' + error.message); return; }
  dayBookings = dayBookings.filter(function(b) { return b.id !== id; });
  showToast('❌ Booking cancelled');
  renderBoard();
  await reloadCurrentView();
}

// Drag & Drop
var dragBookingId = null;

function boardDragStart(e, id) {
  dragBookingId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(function() {
    var card = document.getElementById('card-' + id);
    if (card) card.classList.add('dragging');
  }, 0);
}

function boardDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function boardDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function boardDrop(e, nurseryName) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var id = e.dataTransfer.getData('text/plain') || dragBookingId;
  if (!id) return;

  var card = document.getElementById('card-' + id);
  if (card) card.classList.remove('dragging');

  var bk = dayBookings.find(function(b) { return b.id === id; });
  var oldNursery = bk ? bk.nursery_name : null;
  var switchedNursery = nurseryName !== oldNursery;

  var updates = { nursery_name: nurseryName || null };
  if (switchedNursery) updates.plot_name = null;
  if (nurseryName && bk && bk.status === 'pending') {
    updates.status = 'booked';
  }

  var { error } = await _supabase.from('shared_collection_bookings').update(updates).eq('id', id);
  if (error) { showToast('❌ ' + error.message); return; }

  if (bk) {
    bk.nursery_name = nurseryName || null;
    if (switchedNursery) bk.plot_name = null;
    if (updates.status) bk.status = updates.status;
  }

  showToast('✅ Moved to ' + (nurseryName || 'Pending'));
  renderBoard();
  await reloadCurrentView();
}

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ════════════════════════════════════════════════════════
//  7-DAY WEATHER FORECAST (Open-Meteo — Miri, Sarawak)
// ════════════════════════════════════════════════════════
var _wCache = {};
var _wCodes = {0:'Clear',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',48:'Fog',51:'Lt Drizzle',53:'Drizzle',55:'Hvy Drizzle',61:'Lt Rain',63:'Rain',65:'Hvy Rain',80:'Lt Showers',81:'Showers',82:'Hvy Showers',95:'T-Storm',96:'T-Storm+Hail',99:'Hvy T-Storm'};
var _wIcons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌧️',55:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⚡',96:'⚡',99:'⚡'};

async function loadWeather() {
  var card = document.getElementById('weather-card');
  if (!card) return;
  var fmt = function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  var today = new Date(); today.setHours(0,0,0,0);
  var end = new Date(today); end.setDate(end.getDate() + 6);
  var fs = fmt(today), fe = fmt(end), ck = fs + '_' + fe;
  var wd;
  if (_wCache[ck]) { wd = _wCache[ck]; }
  else {
    try {
      var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=4.3995&longitude=114.0148&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Kuching&start_date=' + fs + '&end_date=' + fe);
      if (!r.ok) throw 0;
      var j = await r.json();
      if (!j.daily || !j.daily.time) throw 0;
      wd = j.daily; _wCache[ck] = wd;
    } catch(e) { card.style.display = 'none'; return; }
  }
  var dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], html = '';
  for (var i = 0; i < wd.time.length; i++) {
    var ds = wd.time[i], dt = new Date(ds + 'T00:00:00');
    var dl = ds === fs ? 'Today' : dn[dt.getDay()];
    var dd = String(dt.getDate()).padStart(2,'0') + '/' + String(dt.getMonth()+1).padStart(2,'0');
    var code = wd.weather_code[i];
    var hi = Math.round(wd.temperature_2m_max[i]);
    var lo = Math.round(wd.temperature_2m_min[i]);
    var rain = wd.precipitation_probability_max[i] || 0;
    var ic = _wIcons[code] || '☁️';
    var dc = _wCodes[code] || 'Cloudy';
    var rc = rain >= 60 ? ' high' : '';
    html += '<div class="weather-day' + (ds === fs ? ' today' : '') + '">' +
      '<div class="weather-day-name">' + dl + '</div>' +
      '<div style="font-size:8px;color:#cbd5e1;font-weight:700;">' + dd + '</div>' +
      '<div class="weather-day-icon">' + ic + '</div>' +
      '<div class="weather-day-temp">' + hi + '°/' + lo + '°</div>' +
      '<div class="weather-day-rain' + rc + '">💧 ' + rain + '%</div>' +
      '<div class="weather-day-desc">' + dc + '</div>' +
      '</div>';
  }
  document.getElementById('weather-strip').innerHTML = html;
  card.style.display = '';
}
