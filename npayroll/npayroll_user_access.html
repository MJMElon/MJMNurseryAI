<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Access — Nursery Payroll System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%236366f1%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2715%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAI%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<script src="../shared/shared_module_access.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<script>
MJMModuleAccess.init({
  module: 'npayroll',
  title:  'Nursery Payroll System',
  moduleLabel: 'Nursery Payroll',
  icon:   '💵',
  accent: 'indigo',
  back:   { href: 'npayroll_dashboard.html', label: 'Back to Main Page' },
  note:   `This page manages users who were <strong>opened for this module</strong> on the main portal's User Access.
           This module decides what people are paid, so tick with care — anyone who can open a sheet can see
           every worker's earnings on it.`,
  pages: [
    { key:'maint', label:'Payroll · Work Maintenance', desc:'The salary claim, priced from the Worker Record',
      actions:[
        { key:'export', label:'Download the salary claim form', desc:'Produce the PDF that goes for payment' }
      ]},
    { key:'transpl', label:'Payroll · Transplanting', desc:'What each worker transplanted, and what it pays',
      actions:[
        { key:'manage', label:'Add, edit & delete entries', desc:'Key in transplanting work against a worker' }
      ]},
    { key:'seedling', label:'Payroll · Seedlings Collection', desc:'What each worker collected, and what it pays',
      actions:[
        { key:'manage', label:'Add, edit & delete entries', desc:'Key in collection work against a worker' }
      ]},
    { key:'monthly', label:'Payroll · Monthly Payroll', desc:'Everything a worker earned this month, from all sheets',
      actions:[
        { key:'export', label:'Download the monthly payroll', desc:'Produce the month’s payroll PDF' }
      ]},
    { key:'workers', label:'Worker System', desc:'The worker register — the one the tick sheets read',
      actions:[
        { key:'manage', label:'Add & edit workers',   desc:'Add somebody, change their role, section or status' },
        { key:'remove', label:'Remove workers',       desc:'Delete a worker permanently, taking their pay entries with them',
          adminOnly:true, highlight:true, chip:'Remove Workers' }
      ]},
    { key:'rates', label:'Piece Rate', desc:'What each job pays per unit — MN, PN and Machinery',
      actions:[
        { key:'manage', label:'Add & edit piece rates', desc:'Set what a job pays. Changing a rate never restates a month already paid',
          highlight:true, chip:'Set Piece Rates' },
        { key:'remove', label:'Remove jobs',           desc:'Delete a job from the rate list', adminOnly:true }
      ]}
  ]
});
</script>

<!-- Nelos floating To-Do dock — the round button in the corner.
     See shared/shared_nelos_dock.js -->
<script src="../shared/shared_nelos_dock.js"></script>
</body>
</html>
