<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Register — Nursery Payroll</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%236366f1%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27system-ui,sans-serif%27 font-size=%2714%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ENP%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shared_supabase.js"></script>
<script src="../shared/shared_access.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family:'Outfit', system-ui, sans-serif; }
  body { background:#f5f5ff; margin:0; }
  .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:10px; border:1.5px solid #c7d2fe;
         background:#fff; color:#4338ca; font-weight:900; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
         cursor:pointer; text-decoration:none; transition:all .15s; }
  .btn:hover { background:#eef2ff; }
  .btn-primary { background:#4f46e5; border-color:#4f46e5; color:#fff; }
  .btn-primary:hover { background:#4338ca; }
  .btn-danger { border-color:#fecaca; color:#b91c1c; }
  .btn-danger:hover { background:#fef2f2; }
  .btn-sm { padding:5px 11px; font-size:10px; }
  table { width:100%; border-collapse:collapse; }
  thead th { background:#eef2ff; color:#4338ca; font-size:10px; font-weight:900; letter-spacing:.12em; text-transform:uppercase;
             padding:11px 12px; text-align:left; border-bottom:2px solid #c7d2fe; white-space:nowrap; }
  tbody td { padding:10px 12px; border-bottom:1px solid #eef2ff; font-size:13px; color:#334155; vertical-align:middle; }
  tbody tr:hover td { background:#fafaff; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:10px; font-weight:900; letter-spacing:.05em; }
  .pill-on  { background:#dcfce7; color:#166534; }
  .pill-off { background:#f1f5f9; color:#64748b; }
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center;
              padding:18px; z-index:60; }
  .modal-bg.open { display:flex; }
  .modal { background:#fff; border-radius:18px; width:100%; max-width:560px; max-height:92vh; overflow:auto;
           box-shadow:0 24px 60px rgba(15,23,42,.3); }
  .frow { margin-bottom:13px; }
  .frow label { display:block; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
                color:#64748b; margin-bottom:4px; }
  .frow input, .frow select, .frow textarea {
    width:100%; padding:9px 11px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:13px; font-family:inherit;
    color:#1e293b; background:#fff; outline:none; }
  .frow input:focus, .frow select:focus, .frow textarea:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .grid2 { grid-template-columns:1fr; } }
  .setup-note { background:#fffbeb; border:1.5px solid #fcd34d; border-radius:16px; padding:18px 20px; color:#78350f; }
</style>
</head>
<body>

<div class="bg-white border-b border-indigo-100 px-6 py-4 grid grid-cols-3 items-center sticky top-0 z-30 shadow-sm">
  <a href="npayroll_dashboard.html" class="justify-self-start text-[10px] font-bold text-slate-500 hover:text-indigo-600 uppercase tracking-widest bg-slate-50 hover:bg-slate-100 px-4 py-2 rounded-full border border-slate-200 no-underline transition-colors">&#8592; Payroll Home</a>
  <span class="justify-self-center text-center font-black text-slate-800 uppercase tracking-widest text-sm">Worker Register</span>
  <div class="justify-self-end flex items-center gap-2">
    <span id="who" class="hidden md:inline text-[11px] font-bold text-slate-500"></span>
    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black text-xs">NP</div>
  </div>
</div>

<div id="loading" class="max-w-[1100px] mx-auto px-6 py-16 text-center text-xs font-bold text-slate-400 uppercase tracking-widest animate-pulse">Checking access…</div>

<div id="main" class="max-w-[1100px] mx-auto px-4 md:px-6 py-8 hidden">

  <div id="setup" class="setup-note mb-6 hidden">
    <div class="font-black text-sm mb-1">⚠️ Database not set up yet</div>
    <div class="text-[13px] leading-relaxed">
      Run <code class="bg-amber-100 px-1.5 py-0.5 rounded">shared/migration_mjmnpayroll.sql</code>
      in the Supabase SQL Editor, then reload.
      <div class="mt-2 text-[12px] opacity-80" id="setup-err"></div>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-3 mb-5">
    <select id="f-nursery" class="btn" style="text-transform:none;letter-spacing:0;font-weight:700;">
      <option value="">All nurseries</option>
      <option value="PN">PN — Pre Nursery</option>
      <option value="BNN">BNN — Batu Niah</option>
      <option value="UNN1">UNN1 — Ulu Niah 1</option>
      <option value="UNN2">UNN2 — Ulu Niah 2</option>
      <option value="OTHER">Other</option>
    </select>
    <label class="flex items-center gap-2 text-[12px] font-bold text-slate-600">
      <input type="checkbox" id="f-inactive" class="w-4 h-4 accent-indigo-600"> Show inactive
    </label>
    <input type="text" id="f-search" placeholder="Search name or IC…"
           class="px-3 py-2 border-[1.5px] border-slate-200 rounded-[10px] text-[13px] outline-none focus:border-indigo-500" style="min-width:200px;">
    <button class="btn btn-primary ml-auto" id="add-btn" onclick="openWorker()">+ Add Worker</button>
  </div>

  <div class="bg-white border border-indigo-100 rounded-2xl shadow-sm overflow-hidden">
    <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th>No.</th><th>Name</th><th>IC / Passport</th><th>Nursery</th>
          <th>Job</th><th>Pay Type</th><th style="text-align:right;">Base Rate</th>
          <th>Status</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <p class="text-[11px] text-slate-400 mt-4" id="count-line"></p>
</div>

<!-- ═══ ADD / EDIT WORKER ═══ -->
<div class="modal-bg" id="worker-modal">
  <div class="modal">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <div class="font-black text-slate-800" id="modal-title">Add Worker</div>
      <button class="text-slate-400 hover:text-slate-700 text-2xl leading-none" onclick="closeWorker()">&times;</button>
    </div>
    <div class="px-6 py-5">
      <div class="grid2">
        <div class="frow"><label>Full Name *</label><input type="text" id="w-name" placeholder="e.g. Asriawan"></div>
        <div class="frow"><label>Worker No.</label><input type="text" id="w-no" placeholder="optional"></div>
      </div>
      <div class="grid2">
        <div class="frow"><label>IC / Passport</label><input type="text" id="w-ic"></div>
        <div class="frow"><label>Nursery</label>
          <select id="w-nursery">
            <option value="">—</option>
            <option value="PN">PN — Pre Nursery</option>
            <option value="BNN">BNN — Batu Niah</option>
            <option value="UNN1">UNN1 — Ulu Niah 1</option>
            <option value="UNN2">UNN2 — Ulu Niah 2</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="frow"><label>Job Title</label><input type="text" id="w-job" placeholder="e.g. Sprayer"></div>
        <div class="frow"><label>Pay Type</label>
          <select id="w-paytype" onchange="onPayTypeChange()">
            <option value="piece">Piece rate</option>
            <option value="daily">Daily wage</option>
            <option value="monthly">Monthly salary</option>
          </select>
        </div>
      </div>
      <div class="frow" id="w-rate-row">
        <label id="w-rate-lbl">Base Rate (RM)</label>
        <input type="number" min="0" step="0.01" id="w-rate" placeholder="0.00">
        <div class="text-[11px] text-slate-400 mt-1" id="w-rate-hint"></div>
      </div>
      <div class="grid2">
        <div class="frow"><label>Bank</label><input type="text" id="w-bank" placeholder="e.g. Maybank"></div>
        <div class="frow"><label>Account No.</label><input type="text" id="w-acct"></div>
      </div>
      <div class="grid2">
        <div class="frow"><label>Joined On</label><input type="date" id="w-joined"></div>
        <div class="frow"><label>Status</label>
          <select id="w-active"><option value="1">Active</option><option value="0">Inactive</option></select>
        </div>
      </div>
      <div class="frow"><label>Remark</label><textarea id="w-remark" rows="2"></textarea></div>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3">
      <button class="btn" onclick="closeWorker()">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveWorker()">Save Worker</button>
    </div>
  </div>
</div>

<script>
const _supabase = supabase.createClient(SHARED_SUPA_URL, SHARED_SUPA_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let workers = [];
let editId  = null;
let isAdmin = false;
let userEmail = '';

const PAY_LABEL = { piece:'Piece rate', daily:'Daily wage', monthly:'Monthly salary' };

function onPayTypeChange() {
  const t = $('w-paytype').value;
  $('w-rate-row').style.display = t === 'piece' ? 'none' : '';
  $('w-rate-lbl').textContent = t === 'daily' ? 'Daily Wage (RM)' : 'Monthly Salary (RM)';
  $('w-rate-hint').textContent = t === 'daily'
    ? 'Paid per day worked.'
    : 'Fixed amount each month.';
}

function openWorker(id) {
  const w = id ? workers.find(x => x.id === id) : null;
  editId = w ? w.id : null;
  $('modal-title').textContent = w ? 'Edit Worker' : 'Add Worker';
  $('w-name').value    = w?.full_name || '';
  $('w-no').value      = w?.worker_no || '';
  $('w-ic').value      = w?.id_no || '';
  $('w-nursery').value = w?.nursery || '';
  $('w-job').value     = w?.job_title || '';
  $('w-paytype').value = w?.pay_type || 'piece';
  $('w-rate').value    = (w && w.base_rate != null) ? w.base_rate : '';
  $('w-bank').value    = w?.bank_name || '';
  $('w-acct').value    = w?.bank_acct || '';
  $('w-joined').value  = w?.joined_on || '';
  $('w-active').value  = (w && w.active === false) ? '0' : '1';
  $('w-remark').value  = w?.remark || '';
  onPayTypeChange();
  $('worker-modal').classList.add('open');
}
function closeWorker() { $('worker-modal').classList.remove('open'); }

async function saveWorker() {
  const name = $('w-name').value.trim();
  if (!name) { alert('Enter the worker\'s full name.'); return; }
  const payType = $('w-paytype').value;
  const rateRaw = ($('w-rate').value ?? '').trim();

  const row = {
    full_name: name,
    worker_no: $('w-no').value.trim() || null,
    id_no:     $('w-ic').value.trim() || null,
    nursery:   $('w-nursery').value || null,
    job_title: $('w-job').value.trim() || null,
    pay_type:  payType,
    // Piece-rate workers are paid from the Work Maintenance rates, so they
    // carry no base rate of their own.
    base_rate: payType === 'piece' ? 0 : Math.max(0, parseFloat(rateRaw) || 0),
    bank_name: $('w-bank').value.trim() || null,
    bank_acct: $('w-acct').value.trim() || null,
    joined_on: $('w-joined').value || null,
    active:    $('w-active').value === '1',
    remark:    $('w-remark').value.trim() || null,
    updated_at: new Date().toISOString(),
    updated_by: userEmail || null
  };

  $('save-btn').disabled = true;
  try {
    let error;
    if (editId) {
      ({ error } = await _supabase.from('mjmnpayroll_workers').update(row).eq('id', editId));
    } else {
      row.created_by = userEmail || null;
      ({ error } = await _supabase.from('mjmnpayroll_workers').insert(row));
    }
    if (error) throw error;
    closeWorker();
    await loadWorkers();
  } catch (e) {
    alert('Could not save the worker.\n\n' + (e.message || e));
  } finally {
    $('save-btn').disabled = false;
  }
}

async function removeWorker(id) {
  const w = workers.find(x => x.id === id);
  if (!w) return;
  if (!isAdmin) { alert('Only an administrator can remove a worker.'); return; }
  // Deleting loses the pay history, so offer the safe option first.
  const msg = `Remove ${w.full_name}?\n\nOK = delete permanently (their pay history goes too).\n` +
              `Cancel = keep the record and mark them Inactive instead.`;
  if (confirm(msg)) {
    const { error } = await _supabase.from('mjmnpayroll_workers').delete().eq('id', id);
    if (error) { alert('Could not delete: ' + error.message); return; }
  } else {
    const { error } = await _supabase.from('mjmnpayroll_workers')
      .update({ active: false, left_on: new Date().toISOString().slice(0, 10), updated_by: userEmail || null })
      .eq('id', id);
    if (error) { alert('Could not update: ' + error.message); return; }
  }
  await loadWorkers();
}

function render() {
  const nf  = $('f-nursery').value;
  const inc = $('f-inactive').checked;
  const q   = $('f-search').value.trim().toLowerCase();

  const list = workers.filter(w => {
    if (!inc && w.active === false) return false;
    if (nf && (w.nursery || '') !== nf) return false;
    if (q && !`${w.full_name || ''} ${w.id_no || ''} ${w.worker_no || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });

  $('rows').innerHTML = list.length ? list.map((w, i) => `
    <tr>
      <td class="text-slate-400">${i + 1}</td>
      <td class="font-bold text-slate-800">${esc(w.full_name)}${w.worker_no ? `<div class="text-[11px] text-slate-400 font-normal">${esc(w.worker_no)}</div>` : ''}</td>
      <td class="text-slate-500">${esc(w.id_no || '—')}</td>
      <td>${esc(w.nursery || '—')}</td>
      <td class="text-slate-500">${esc(w.job_title || '—')}</td>
      <td>${esc(PAY_LABEL[w.pay_type] || w.pay_type)}</td>
      <td style="text-align:right;">${w.pay_type === 'piece' ? '<span class="text-slate-400">—</span>' : 'RM ' + Number(w.base_rate || 0).toFixed(2)}</td>
      <td><span class="pill ${w.active === false ? 'pill-off' : 'pill-on'}">${w.active === false ? 'Inactive' : 'Active'}</span></td>
      <td style="white-space:nowrap;text-align:right;">
        <button class="btn btn-sm" onclick="openWorker(${w.id})">Edit</button>
        ${isAdmin ? `<button class="btn btn-sm btn-danger" onclick="removeWorker(${w.id})">Remove</button>` : ''}
      </td>
    </tr>`).join('')
    : `<tr><td colspan="9" class="text-center text-slate-400 py-10 text-[13px]">
         ${workers.length ? 'No worker matches this filter.' : 'No workers yet — press “+ Add Worker”.'}
       </td></tr>`;

  const active = workers.filter(w => w.active !== false).length;
  $('count-line').textContent = `${list.length} shown · ${active} active · ${workers.length} total on the register.`;
}

async function loadWorkers() {
  const { data, error } = await _supabase.from('mjmnpayroll_workers')
    .select('*').order('full_name', { ascending: true });
  if (error) {
    $('setup').classList.remove('hidden');
    $('setup-err').textContent = error.message || '';
    $('add-btn').disabled = true;
    $('rows').innerHTML = `<tr><td colspan="9" class="text-center text-slate-400 py-10 text-[13px]">Worker register unavailable.</td></tr>`;
    return;
  }
  $('setup').classList.add('hidden');
  workers = data || [];
  render();
}

['f-nursery', 'f-inactive', 'f-search'].forEach(id => {
  $(id).addEventListener(id === 'f-search' ? 'input' : 'change', render);
});
$('worker-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeWorker(); });

(async () => {
  try {
    await MJMAccess.load(_supabase);
    if (!MJMAccess.user()) { window.location.href = '../index.html'; return; }
    if (!MJMAccess.canAccess('npayroll')) {
      alert('You do not have access to the Nursery Payroll System.');
      window.location.href = '../index.html';
      return;
    }
    const u = MJMAccess.user();
    userEmail = u.email || '';
    isAdmin = MJMAccess.isAdminOf('npayroll');
    $('who').textContent = u.full_name || u.email || '';
    await loadWorkers();
    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
  } catch (e) {
    if (e && e.message === 'NO_OPS_ACCESS') return;
    console.warn(e);
    window.location.href = '../index.html';
  }
})();
</script>
</body>
</html>
